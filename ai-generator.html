<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MP3 Song Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h2 { margin-bottom: 20px; color: #00adb5; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background: #028d94; }
        .loader { display: none; margin-top: 15px; }
        audio { margin-top: 20px; width: 100%; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 AI Song Generator</h2>
    <p>Apna song description likhein:</p>
    <textarea id="prompt" rows="3" placeholder="e.g., A happy hindi song about friendship"></textarea>
    <button onclick="generateSong()">Generate MP3</button>
    
    <!-- Loading Animation -->
    <div class="loader" id="loader">
        Song generate ho raha hai... 🎧
    </div>

    <!-- Audio Player -->
    <audio id="audioPlayer" controls></audio>
</div>

<script>
    async function generateSong() {
        const prompt = document.getElementById('prompt').value;
        const loader = document.getElementById('loader');
        const audioPlayer = document.getElementById('audioPlayer');

        if(!prompt) {
            alert("Please enter a description!");
            return;
        }

        // UI Loading state
        loader.style.display = 'block';
        audioPlayer.style.display = 'none';

        try {
            // Backend ko request bhejna
            const response = await fetch('http://localhost:5000/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });
            
            const data = await response.json();

            if(data.audio_url) {
                // Song play karna
                audioPlayer.src = data.audio_url;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
            } else {
                alert("Error: Song generate nahi hua.");
            }
        } catch (error) {
            console.error('Error:', error);
            alert("Server se connect nahi ho pa raha.");
        } finally {
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
