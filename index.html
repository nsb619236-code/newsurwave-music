<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss - Golden</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px;}
.gold{color:#FFD700;}
button{background:#FFD700;color:#000;border:none;padding:12px;margin:5px;border-radius:25px;width:100%;font-weight:bold;cursor:pointer;}
input{width:100%;padding:12px;margin:5px;background:#111;color:#fff;border:1px solid #FFD700;border-radius:25px;}
.card{background:#111;padding:15px;margin:10px 0;border-radius:15px;border:1px solid #FFD700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.nav{display:flex;gap:5px;margin:10px 0;}
.nav-btn{background:#111;color:#FFD700;border:1px solid #FFD700;padding:10px;border-radius:20px;flex:1;cursor:pointer;}
.nav-btn:hover{background:#FFD700;color:#000;}
</style>
</head>
<body>

<div style="text-align:center;margin:20px 0;">
<h1 style="color:#FFD700;font-size:48px;">👑 MUSIC BOSS</h1>
<p style="color:#FFD700;">गाने सुनो पैसे कमाओ | Listen & Earn</p>
</div>

<div class="nav">
<button class="nav-btn" onclick="showHome()">Home</button>
<button class="nav-btn" onclick="showUpload()">Upload</button>
<button class="nav-btn" onclick="showRadio()">Radio</button>
<button class="nav-btn" onclick="showEarnings()">Earnings</button>
</div>

<div id="main"></div>

<script>
// Simple data
let user = localStorage.getItem('user') || null;
let songs = JSON.parse(localStorage.getItem('songs') || '[]');
let earnings = parseInt(localStorage.getItem('earnings') || '0');
let hours = parseInt(localStorage.getItem('hours') || '0');

// Default songs
if(songs.length === 0){
songs = [
{id:1, title:'Blinding Lights', artist:'Weeknd', emoji:'🎤'},
{id:2, title:'Levitating', artist:'Dua Lipa', emoji:'✨'},
{id:3, title:'Peaches', artist:'JB', emoji:'🍑'},
];
localStorage.setItem('songs', JSON.stringify(songs));
}

// Show home page
function showHome(){
let html = '<h2 style="color:#FFD700;">🔥 Trending Songs</h2><div class="grid">';
songs.forEach(song => {
html += `<div class="card" onclick="playSong(${song.id})">
<div style="font-size:40px;">${song.emoji}</div>
<h3>${song.title}</h3>
<p style="color:#FFD700;">${song.artist}</p>
</div>`;
});
html += '</div>';
document.getElementById('main').innerHTML = html;
}

// Show upload page
function showUpload(){
if(!user){
alert('Login first!');
showLogin();
return;
}
let html = `
<h2 style="color:#FFD700;">📤 Upload Song</h2>
<input type="file" id="audio" accept="audio/*">
<input type="text" id="title" placeholder="Song Title">
<input type="text" id="artist" placeholder="Artist Name">
<button onclick="uploadSong()">Upload Song</button>
<h3 style="color:#FFD700;margin-top:20px;">Your Uploads</h3>
<div id="uploads"></div>
`;
document.getElementById('main').innerHTML = html;
showUserUploads();
}

function uploadSong(){
let file = document.getElementById('audio').files[0];
let title = document.getElementById('title').value;
let artist = document.getElementById('artist').value;
if(!file || !title || !artist){
alert('Fill all fields');
return;
}
let newSong = {
id: Date.now(),
title: title,
artist: artist,
emoji: '🎵',
url: URL.createObjectURL(file),
user: user
};
songs.push(newSong);
localStorage.setItem('songs', JSON.stringify(songs));
alert('Song uploaded!');
showUpload();
}

function showUserUploads(){
let userSongs = songs.filter(s => s.user === user);
let html = '<div class="grid">';
userSongs.forEach(s => {
html += `<div class="card">
<div style="font-size:40px;">${s.emoji}</div>
<h3>${s.title}</h3>
<p>${s.artist}</p>
<button onclick="deleteSong(${s.id})" style="background:#ff4444;">Delete</button>
</div>`;
});
html += '</div>';
document.getElementById('uploads').innerHTML = html || '<p>No uploads</p>';
}

function deleteSong(id){
songs = songs.filter(s => s.id !== id);
localStorage.setItem('songs', JSON.stringify(songs));
showUpload();
}

// Show radio page
function showRadio(){
let html = '<h2 style="color:#FFD700;">📻 Live Radio</h2><div class="grid">';
let stations = [
{name:'Bollywood', country:'India', emoji:'🇮🇳'},
{name:'English Pop', country:'USA', emoji:'🇺🇸'},
{name:'Punjabi', country:'India', emoji:'🇮🇳'},
{name:'K-Pop', country:'Korea', emoji:'🇰🇷'},
];
stations.forEach(s => {
html += `<div class="card" onclick="playRadio('${s.name}')">
<div style="font-size:50px;">${s.emoji}</div>
<h3>${s.name}</h3>
<p>${s.country}</p>
<span style="background:red;color:white;padding:2px 8px;border-radius:10px;">LIVE</span>
</div>`;
});
html += '</div>';
document.getElementById('main').innerHTML = html;
}

function playRadio(name){
alert('🎵 Playing ' + name + ' Radio');
}

// Show earnings page
function showEarnings(){
if(!user){
alert('Login first');
showLogin();
return;
}
let userSongs = songs.filter(s => s.user === user);
let totalPlays = userSongs.length * 10;
let totalEarns = totalPlays * 0.45;
let progress = (hours/500)*100;
let html = `
<div style="background:#111;border:2px solid #FFD700;border-radius:20px;padding:20px;margin:20px 0;">
<h2 style="color:#FFD700;">💰 Your Earnings</h2>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0;">
<div style="background:#FFD700;color:#000;padding:20px;border-radius:15px;text-align:center;">
<h3>$${totalEarns.toFixed(2)}</h3>
<p>Earned</p>
</div>
<div style="background:#FFD700;color:#000;padding:20px;border-radius:15px;text-align:center;">
<h3>${totalPlays}</h3>
<p>Plays</p>
</div>
</div>
<div style="background:#FFD700;color:#000;padding:20px;border-radius:15px;">
<h3>💰 Earning Structure</h3>
<p>Artist: $45 | Platform: $40 | Listeners: $15</p>
<p>500 Hours Required</p>
<div style="background:#000;height:10px;border-radius:5px;margin:10px 0;">
<div style="width:${progress}%;height:100%;background:#FFD700;border-radius:5px;"></div>
</div>
<p>${hours}/500 Hours</p>
</div>
</div>
<h3 style="color:#FFD700;">Your Songs</h3>
<div class="grid" id="earnSongs"></div>
`;
document.getElementById('main').innerHTML = html;
let songHtml = '';
userSongs.forEach(s => {
songHtml += `<div class="card">
<div style="font-size:40px;">${s.emoji}</div>
<h3>${s.title}</h3>
<p>${s.artist}</p>
<p style="color:#FFD700;">10 plays • $4.50</p>
</div>`;
});
document.getElementById('earnSongs').innerHTML = songHtml || '<p>No songs</p>';
}

// Show login page
function showLogin(){
let html = `
<h2 style="color:#FFD700;">Login / Sign Up</h2>
<input type="email" id="email" placeholder="Email" value="demo">
<input type="password" id="password" placeholder="Password" value="123">
<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
`;
document.getElementById('main').innerHTML = html;
}

function login(){
let email = document.getElementById('email').value;
let pass = document.getElementById('password').value;
let users = JSON.parse(localStorage.getItem('users') || '[]');
let found = users.find(u => u.email === email && u.pass === pass);
if(found){
user = email;
localStorage.setItem('user', email);
alert('Login success!');
showHome();
} else {
alert('Wrong credentials!');
}
}

function signup(){
let email = document.getElementById('email').value;
let pass = document.getElementById('password').value;
let users = JSON.parse(localStorage.getItem('users') || '[]');
users.push({email:email, pass:pass});
localStorage.setItem('users', JSON.stringify(users));
user = email;
localStorage.setItem('user', email);
alert('Account created!');
showHome();
}

// Play song function
function playSong(id){
let song = songs.find(s => s.id === id);
if(song){
hours += 0.1;
localStorage.setItem('hours', hours);
alert('🎵 Playing: ' + song.title + '\nEarning $0.45 per play');
}
}

// Initial load
showHome();
</script>
</body>
</html>
