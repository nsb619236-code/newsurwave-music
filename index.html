<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Boss - Simple Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #0a0c0f;
            color: white;
            padding: 10px;
        }
        .header {
            background: #e43d3d;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .btn {
            background: #e43d3d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            width: 100%;
        }
        .upload-box {
            background: #1a1e26;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
            border: 2px dashed #e43d3d;
            text-align: center;
        }
        .card {
            background: #1a1e26;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .poster {
            width: 60px;
            height: 60px;
            background: #e43d3d;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #0a0c0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
        }
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1e26;
            padding: 15px;
            display: none;
            border-top: 2px solid #e43d3d;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>🎵 Music Boss</h1>
        <p>Upload & Play Your Songs</p>
    </div>

    <!-- Login Section -->
    <div id="loginSection" style="background: #1a1e26; padding: 20px; border-radius: 10px;">
        <h2 style="color: #e43d3d; margin-bottom: 15px;">Login / Sign Up</h2>
        <input type="email" id="email" placeholder="Enter Email" value="test@email.com">
        <input type="password" id="password" placeholder="Enter Password" value="123456">
        <button class="btn" onclick="login()">Login</button>
        <button class="btn" style="background: #333;" onclick="signup()">Sign Up</button>
    </div>

    <!-- Main Content (Hidden by default) -->
    <div id="mainContent" style="display: none;">
        
        <!-- Upload Button -->
        <button class="btn" onclick="showUpload()">➕ Upload New Song</button>

        <!-- Upload Section (Hidden by default) -->
        <div id="uploadSection" style="display: none;">
            <div class="upload-box">
                <h3>Select Audio File</h3>
                <input type="file" id="audioFile" accept="audio/*" onchange="audioSelected()">
                <p id="audioName">No file selected</p>
            </div>

            <div class="upload-box">
                <h3>Select Poster Image</h3>
                <input type="file" id="posterFile" accept="image/*" onchange="posterSelected()">
                <p id="posterName">No file selected</p>
            </div>

            <input type="text" id="songTitle" placeholder="Song Title">
            <input type="text" id="songArtist" placeholder="Artist Name">
            
            <button class="btn" onclick="uploadSong()">📤 Upload Song</button>
        </div>

        <!-- My Uploads -->
        <h2 style="margin: 20px 0 10px 0;">🎵 My Uploads</h2>
        <div id="myUploads"></div>

        <!-- All Songs -->
        <h2 style="margin: 20px 0 10px 0;">🔥 All Songs</h2>
        <div id="allSongs"></div>
    </div>

    <!-- Player -->
    <div class="player" id="player">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="poster" id="playerPoster">🎵</div>
            <div style="flex: 1;">
                <h4 id="playerTitle">No song</h4>
                <p id="playerArtist" style="color: #999;">Select a song</p>
            </div>
            <div style="display: flex; gap: 20px;">
                <button onclick="prevSong()" style="background: none; border: none; color: white; font-size: 24px;">⏮️</button>
                <button onclick="playPause()" style="background: none; border: none; color: #e43d3d; font-size: 32px;" id="playBtn">▶️</button>
                <button onclick="nextSong()" style="background: none; border: none; color: white; font-size: 24px;">⏭️</button>
            </div>
        </div>
        <div style="height: 3px; background: #333; margin-top: 10px;">
            <div id="progress" style="height: 100%; background: #e43d3d; width: 0%;"></div>
        </div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let currentUser = null;
        let songs = [];
        let currentSong = null;
        let isPlaying = false;
        let audio = new Audio();
        
        // Load data on start
        loadData();

        // ========== AUTH FUNCTIONS ==========
        function signup() {
            let email = document.getElementById('email').value;
            let pass = document.getElementById('password').value;
            
            if (!email || !pass) {
                alert('Please enter email and password');
                return;
            }

            let users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.find(u => u.email === email)) {
                alert('User already exists! Please login.');
                return;
            }

            users.push({email: email, pass: pass});
            localStorage.setItem('users', JSON.stringify(users));
            
            currentUser = {email: email};
            localStorage.setItem('currentUser', email);
            
            alert('Sign up successful!');
            showMainContent();
        }

        function login() {
            let email = document.getElementById('email').value;
            let pass = document.getElementById('password').value;
            
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            let user = users.find(u => u.email === email && u.pass === pass);
            
            if (user) {
                currentUser = {email: email};
                localStorage.setItem('currentUser', email);
                alert('Login successful!');
                showMainContent();
            } else {
                alert('Wrong email or password!');
            }
        }

        function showMainContent() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadSongs();
        }

        // ========== UPLOAD FUNCTIONS ==========
        function showUpload() {
            let section = document.getElementById('uploadSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function audioSelected() {
            let file = document.getElementById('audioFile').files[0];
            document.getElementById('audioName').innerText = file ? file.name : 'No file selected';
        }

        function posterSelected() {
            let file = document.getElementById('posterFile').files[0];
            document.getElementById('posterName').innerText = file ? file.name : 'No file selected';
        }

        function uploadSong() {
            let audioFile = document.getElementById('audioFile').files[0];
            let posterFile = document.getElementById('posterFile').files[0];
            let title = document.getElementById('songTitle').value;
            let artist = document.getElementById('songArtist').value;

            if (!audioFile) {
                alert('Please select an audio file');
                return;
            }

            if (!title || !artist) {
                alert('Please enter title and artist');
                return;
            }

            // Create audio URL
            let audioUrl = URL.createObjectURL(audioFile);
            
            // Create poster URL if exists
            let posterUrl = null;
            if (posterFile) {
                posterUrl = URL.createObjectURL(posterFile);
            }

            // Create song object
            let song = {
                id: Date.now(),
                title: title,
                artist: artist,
                poster: posterUrl,
                url: audioUrl,
                uploadedBy: currentUser.email
            };

            // Save to localStorage
            let uploadedSongs = JSON.parse(localStorage.getItem('songs') || '[]');
            uploadedSongs.push(song);
            localStorage.setItem('songs', JSON.stringify(uploadedSongs));

            // Add to songs array
            songs.push(song);

            // Reset form
            document.getElementById('audioFile').value = '';
            document.getElementById('posterFile').value = '';
            document.getElementById('songTitle').value = '';
            document.getElementById('songArtist').value = '';
            document.getElementById('audioName').innerText = 'No file selected';
            document.getElementById('posterName').innerText = 'No file selected';
            
            alert('Song uploaded successfully!');
            loadSongs();
            showUpload(); // Hide upload section
        }

        // ========== LOAD SONGS ==========
        function loadSongs() {
            // Load from localStorage
            let uploadedSongs = JSON.parse(localStorage.getItem('songs') || '[]');
            songs = [...uploadedSongs];
            
            // Add default songs if no songs
            if (songs.length === 0) {
                songs = [
                    {id: 1, title: 'Song 1', artist: 'Artist 1', poster: null, url: null},
                    {id: 2, title: 'Song 2', artist: 'Artist 2', poster: null, url: null},
                    {id: 3, title: 'Song 3', artist: 'Artist 3', poster: null, url: null}
                ];
            }

            // Show my uploads
            let mySongs = songs.filter(s => s.uploadedBy === currentUser?.email);
            let myHtml = '';
            mySongs.forEach(song => {
                myHtml += createSongCard(song, true);
            });
            document.getElementById('myUploads').innerHTML = myHtml || '<p>No uploads yet</p>';

            // Show all songs
            let allHtml = '';
            songs.forEach(song => {
                allHtml += createSongCard(song, false);
            });
            document.getElementById('allSongs').innerHTML = allHtml;
        }

        function createSongCard(song, showDelete) {
            return `
                <div class="card" onclick="playSong(${song.id})">
                    <div class="poster" style="background-image: ${song.poster ? `url('${song.poster}')` : 'none'}; background-size: cover;">
                        ${!song.poster ? '🎵' : ''}
                    </div>
                    <div style="flex: 1;">
                        <h3>${song.title}</h3>
                        <p style="color: #999;">${song.artist}</p>
                    </div>
                    ${showDelete ? `<button onclick="deleteSong(${song.id}, event)" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px;">Delete</button>` : ''}
                </div>
            `;
        }

        function deleteSong(id, event) {
            event.stopPropagation();
            
            if (!confirm('Delete this song?')) return;

            // Remove from localStorage
            let uploadedSongs = JSON.parse(localStorage.getItem('songs') || '[]');
            uploadedSongs = uploadedSongs.filter(s => s.id !== id);
            localStorage.setItem('songs', JSON.stringify(uploadedSongs));

            // Remove from songs array
            songs = songs.filter(s => s.id !== id);

            alert('Song deleted');
            loadSongs();
        }

        // ========== PLAYER FUNCTIONS ==========
        function playSong(id) {
            let song = songs.find(s => s.id === id);
            if (!song) return;

            currentSong = song;
            
            document.getElementById('player').style.display = 'block';
            document.getElementById('playerTitle').innerText = song.title;
            document.getElementById('playerArtist').innerText = song.artist;
            
            if (song.poster) {
                document.getElementById('playerPoster').style.backgroundImage = `url('${song.poster}')`;
                document.getElementById('playerPoster').style.backgroundSize = 'cover';
                document.getElementById('playerPoster').innerText = '';
            } else {
                document.getElementById('playerPoster').style.backgroundImage = '';
                document.getElementById('playerPoster').innerText = '🎵';
            }

            if (song.url) {
                audio.src = song.url;
                audio.play();
                isPlaying = true;
                document.getElementById('playBtn').innerText = '⏸️';
            } else {
                alert('Demo song - Upload real audio to play');
            }
        }

        function playPause() {
            if (!currentSong) {
                if (songs.length > 0) playSong(songs[0].id);
                return;
            }

            if (isPlaying) {
                audio.pause();
                document.getElementById('playBtn').innerText = '▶️';
            } else {
                audio.play();
                document.getElementById('playBtn').innerText = '⏸️';
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            if (!currentSong || songs.length === 0) return;
            let index = songs.findIndex(s => s.id === currentSong.id);
            let nextIndex = (index + 1) % songs.length;
            playSong(songs[nextIndex].id);
        }

        function prevSong() {
            if (!currentSong || songs.length === 0) return;
            let index = songs.findIndex(s => s.id === currentSong.id);
            let prevIndex = (index - 1 + songs.length) % songs.length;
            playSong(songs[prevIndex].id);
        }

        audio.ontimeupdate = function() {
            if (audio.duration) {
                let progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progress').style.width = progress + '%';
            }
        };

        // ========== LOAD DATA ==========
        function loadData() {
            // Check if user is logged in
            let savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = {email: savedUser};
                showMainContent();
            }
        }
    </script>
</body>
</html>
