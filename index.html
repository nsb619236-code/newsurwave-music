.section-title{font-size:22px;margin:25px 0 15px;color:#1DB954;display:flex;align-items:center;gap:10px;}
.section-title i{font-size:24px;}

/* Grid Layouts */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-bottom:30px;}
.music-card{background:#181818;padding:15px;border-radius:12px;cursor:pointer;transition:0.2s;position:relative;}
.music-card:hover{background:#282828;transform:translateY(-5px);}
.card-img{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#1DB954,#0f8f3f);border-radius:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:40px;}
.card-title{font-size:15px;font-weight:bold;margin-bottom:5px;}
.card-artist{font-size:13px;color:#b3b3b3;}
.badge{position:absolute;top:10px;right:10px;background:#1DB954;color:#000;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;}

/* Radio Grid */
.radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;margin-bottom:30px;}
.radio-card{background:linear-gradient(135deg,#1DB954,#0f8f3f);border-radius:16px;padding:20px;cursor:pointer;transition:0.2s;position:relative;}
.radio-card:hover{transform:scale(1.02);}
.live-badge{position:absolute;top:10px;right:10px;background:red;color:#fff;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;animation:pulse 1.5s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.7;}100%{opacity:1;}}
.radio-card h2{font-size:40px;margin-bottom:10px;}
.radio-card h3{font-size:16px;margin-bottom:5px;}
.radio-card p{font-size:13px;opacity:0.9;}

.upload-section{background:#121212;border-radius:20px;padding:25px;margin:20px 0;}
.upload-area{background:#181818;border:2px dashed #1DB954;border-radius:12px;padding:25px;text-align:center;cursor:pointer;margin:10px 0;}
.upload-area:hover{background:#282828;}
.upload-area i{font-size:40px;color:#1DB954;margin-bottom:10px;}
.file-list{background:#181818;border-radius:10px;padding:15px;margin:10px 0;max-height:200px;overflow-y:auto;}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #333;}
.file-item:last-child{border-bottom:none;}
.file-item i{color:#1DB954;margin-right:10px;}
.remove-file{color:#ff4444;cursor:pointer;}

input,select{width:100%;padding:15px;margin:8px 0;background:#181818;border:1px solid #333;border-radius:30px;color:#fff;font-size:14px;}
input:focus{outline:none;border-color:#1DB954;}
button{background:#1DB954;color:#000;border:none;padding:15px;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer;width:100%;margin:8px 0;transition:0.2s;}
button:hover{background:#1ed760;}
button.sec{background:#333;color:#fff;}

/* Earnings Grid */
.earnings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:20px 0;}
.earning-card{background:linear-gradient(135deg,#1DB954,#0f8f3f);border-radius:16px;padding:20px;text-align:center;color:#000;}
.earning-card h3{font-size:28px;margin-bottom:5px;}

/* Player Bar */
.player-bar{position:fixed;bottom:0;left:0;right:0;background:#181818;padding:15px;border-top:2px solid #1DB954;display:none;z-index:100;}
.player-info{display:flex;align-items:center;gap:15px;margin-bottom:10px;}
.player-img{width:50px;height:50px;background:#1DB954;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:25px;}
.player-controls i{font-size:24px;color:#b3b3b3;cursor:pointer;}
.player-controls i:hover{color:#1DB954;}
.player-controls .fa-play-circle{color:#1DB954;font-size:36px;}
.progress-bar{width:100%;height:4px;background:#333;border-radius:2px;margin:8px 0;cursor:pointer;}
.progress{width:0%;height:100%;background:#1DB954;border-radius:2px;}

/* Modal */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:1000;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:#121212;padding:30px;border-radius:24px;width:90%;max-width:400px;}
.modal-content h2{color:#1DB954;margin-bottom:20px;}

/* Toast */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#1DB954;color:#000;padding:12px 24px;border-radius:50px;font-weight:bold;display:none;z-index:2000;}

/* Delete Button */
.delete-btn{background:#ff4444;color:#fff;border:none;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;margin-top:5px;}
</style>

function toggleAuthMode(){

function handleAuth(){
let email = document.getElementById('email').value;
let pass = document.getElementById('password').value;
let title = document.getElementById('authTitle').innerText;
if(!email||!pass){showToast('Please fill all fields');return;}
let users = JSON.parse(localStorage.getItem('users')||'[]');
if(title === 'Sign Up'){
if(users.find(u=>u.email===email)){showToast('User already exists');return;}
let newUser = {email:email,password:pass,name:email.split('@')[0]};
users.push(newUser);
localStorage.setItem('users',JSON.stringify(users));
currentUser = newUser;
localStorage.setItem('currentUser',email);
showToast('Account created successfully!');
}else{
let user = users.find(u=>u.email===email && u.password===pass);
if(user){
currentUser = user;
localStorage.setItem('currentUser',email);
showToast('Login successful!');
}else{showToast('Invalid credentials');return;}
