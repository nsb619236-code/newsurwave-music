<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss - Working Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0A1F0A;color:#fff;padding:15px;padding-bottom:100px;}
.gold{color:#FFD700;}
.header{background:#0F2B0F;border:2px solid #2A5A2A;border-radius:25px;padding:20px;text-align:center;margin-bottom:20px;}
.logo{color:#FFD700;font-size:40px;font-weight:bold;}
.logo i{color:#FFD700;}
.nav{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap;}
.nav-btn{background:#143814;border:1px solid #2A5A2A;color:#fff;padding:10px;border-radius:20px;flex:1;cursor:pointer;font-weight:bold;}
.nav-btn.active{background:#1DB954;color:#000;}
.user{background:#0F2B0F;border:1px solid #2A5A2A;border-radius:50px;padding:10px 15px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.avatar{width:40px;height:40px;background:#1DB954;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-bottom:25px;}
.card{background:#143814;border:1px solid #2A5A2A;border-radius:15px;padding:15px;transition:0.3s;}
.card:hover{transform:translateY(-5px);border-color:#1DB954;}
.card-img{width:100%;aspect-ratio:1;background:#0A1F0A;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:40px;background-size:cover;}
.btn-group{display:flex;gap:5px;margin-top:10px;}
.play-btn{background:#1DB954;color:#000;border:none;padding:8px;border-radius:15px;font-weight:bold;cursor:pointer;flex:1;}
.del-btn{background:#DC143C;color:#fff;border:none;padding:8px;border-radius:15px;cursor:pointer;flex:1;}
.radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;}
.radio-card{background:linear-gradient(135deg,#143814,#0F2B0F);border:1px solid #2A5A2A;border-radius:15px;padding:20px;cursor:pointer;position:relative;text-align:center;}
.live{position:absolute;top:5px;right:5px;background:red;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;}
.upload-area{background:#0F2B0F;border:2px dashed #1DB954;border-radius:15px;padding:20px;text-align:center;margin:10px 0;cursor:pointer;}
.upload-area i{font-size:40px;color:#1DB954;}
.file-list{background:#0A1F0A;border-radius:10px;padding:10px;margin:10px 0;max-height:150px;overflow-y:auto;}
.file-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #2A5A2A;}
input,select{width:100%;padding:12px;margin:8px 0;background:#0A1F0A;border:1px solid #2A5A2A;border-radius:25px;color:#fff;}
button{background:#1DB954;color:#000;border:none;padding:12px;border-radius:25px;font-weight:bold;cursor:pointer;width:100%;margin:5px 0;}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:#0F2B0F;border-top:2px solid #1DB954;padding:10px;display:none;z-index:100;}
.player-info{display:flex;align-items:center;gap:10px;}
.player-img{width:50px;height:50px;background:#1DB954;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.player-controls{display:flex;gap:20px;justify-content:center;margin-top:5px;}
.player-controls i{font-size:24px;cursor:pointer;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1DB954;color:#000;padding:10px 20px;border-radius:50px;display:none;z-index:2000;font-weight:bold;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:3000;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:#0F2B0F;border:2px solid #1DB954;border-radius:25px;padding:30px;width:90%;max-width:350px;}
.modal-content h2{color:#FFD700;margin-bottom:20px;}
</style>
<link rel="stylesheet" href="https://cdnjsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
<div class="logo"><i class="fas fa-crown"></i> MUSIC BOSS</div>
<p style="color:#A0C0A0;">गाने सुनो • पैसे कमाओ • Listen & Earn</p>
</div>

<!-- NAVIGATION -->
<div class="nav">
<button class="nav-btn active" onclick="showPage('home')">🏠 Home</button>
<button class="nav-btn" onclick="showPage('upload')">📤 Upload</button>
<button class="nav-btn" onclick="showPage('radio')">📻 Radio</button>
<button class="nav-btn" onclick="showPage('earnings')">💰 Earnings</button>
<button class="nav-btn" onclick="showPage('library')">📚 Library</button>
</div>

<!-- USER SECTION -->
<div class="user">
<span id="userDisplay"><i class="fas fa-user"></i> Guest</span>
<div class="avatar" id="avatarDisplay" onclick="showLogin()">G</div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent"></div>

<!-- PLAYER BAR -->
<div class="player-bar" id="playerBar">
<div class="player-info">
<div class="player-img" id="playerImg">🎵</div>
<div>
<div id="playerTitle">Not playing</div>
<div id="playerArtist" style="color:#A0C0A0;font-size:12px;">-</div>
</div>
</div>
<div class="player-controls">
<i class="fas fa-step-backward" onclick="prevSong()"></i>
<i class="fas fa-play-circle" id="playPauseIcon" onclick="togglePlay()" style="color:#FFD700;"></i>
<i class="fas fa-step-forward" onclick="nextSong()"></i>
</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
<div class="modal-content">
<h2 id="authTitle">Login</h2>
<input type="email" id="email" placeholder="Email" value="demo">
<input type="password" id="password" placeholder="Password" value="123">
<button onclick="handleAuth()" id="authBtn">Login</button>
<button onclick="toggleAuth()" style="background:#333;color:#fff;" id="toggleBtn">Sign Up</button>
</div>
</div>

<script>
// ========== DATA ==========
let currentUser = localStorage.getItem('currentUser') || null;
let songs = JSON.parse(localStorage.getItem('songs') || '[]');
let earnings = parseFloat(localStorage.getItem('earnings') || '0');
let plays = parseInt(localStorage.getItem('plays') || '0');
let hours = parseFloat(localStorage.getItem('hours') || '0');
let audio = new Audio();
let currentSong = null;
let isPlaying = false;
let currentRadio = null;
let radioInterval = null;
let audioFiles = [];
let imageFiles = [];

// Sample songs
if(songs.length === 0) {
songs = [
{id:1, title:'Blinding Lights', artist:'The Weeknd', emoji:'🎤', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', plays:1200},
{id:2, title:'Levitating', artist:'Dua Lipa', emoji:'✨', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', plays:900},
{id:3, title:'Peaches', artist:'Justin Bieber', emoji:'🍑', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', plays:800},
{id:4, title:'Stay', artist:'Kid Laroi', emoji:'⭐', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', plays:1100},
];
localStorage.setItem('songs', JSON.stringify(songs));
}

// Radio stations
const radios = [
{id:1, name:'Bollywood Hits', country:'India', emoji:'🇮🇳'},
{id:2, name:'English Pop', country:'USA', emoji:'🇺🇸'},
{id:3, name:'Punjabi Beats', country:'India', emoji:'🇮🇳'},
{id:4, name:'K-Pop', country:'Korea', emoji:'🇰🇷'},
{id:5, name:'Latin Hits', country:'Spain', emoji:'🇪🇸'},
{id:6, name:'Arabic Hits', country:'UAE', emoji:'🇦🇪'},
];

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
if(currentUser) {
document.getElementById('userDisplay').innerHTML = '<i class="fas fa-user"></i> ' + currentUser;
document.getElementById('avatarDisplay').innerText = currentUser[0].toUpperCase();
}
showHome();
});

// ========== AUTH ==========
function showLogin() {
document.getElementById('loginModal').classList.add('active');
}

function toggleAuth() {
let title = document.getElementById('authTitle');
if(title.innerText === 'Login') {
title.innerText = 'Sign Up';
document.getElementById('authBtn').innerText = 'Sign Up';
document.getElementById('toggleBtn').innerText = 'Back to Login';
} else {
title.innerText = 'Login';
document.getElementById('authBtn').innerText = 'Login';
document.getElementById('toggleBtn').innerText = 'Sign Up';
}
}

function handleAuth() {
let email = document.getElementById('email').value;
let pass = document.getElementById('password').value;
let title = document.getElementById('authTitle').innerText;

if(!email || !pass) { toast('Fill all fields'); return; }

let users = JSON.parse(localStorage.getItem('users') || '[]');

if(title === 'Sign Up') {
if(users.find(u => u.email === email)) { toast('User exists'); return; }
users.push({email, pass});
localStorage.setItem('users', JSON.stringify(users));
currentUser = email;
localStorage.setItem('currentUser', email);
toast('Account created!');
} else {
let user = users.find(u => u.email === email && u.pass === pass);
if(user) {
currentUser = email;
localStorage.setItem('currentUser', email);
toast('Login success!');
} else { toast('Wrong credentials'); return; }
}

document.getElementById('loginModal').classList.remove('active');
document.getElementById('userDisplay').innerHTML = '<i class="fas fa-user"></i> ' + currentUser;
document.getElementById('avatarDisplay').innerText = currentUser[0].toUpperCase();
}

// ========== PAGE NAVIGATION ==========
function showPage(page) {
document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
event.target.classList.add('active');
if(page === 'home') showHome();
if(page === 'upload') showUpload();
if(page === 'radio') showRadio();
if(page === 'earnings') showEarnings();
if(page === 'library') showLibrary();
}

// ========== HOME PAGE ==========
function showHome() {
let html = '<h2 style="color:#FFD700;margin:20px 0;">🔥 Trending Songs</h2><div class="grid">';
songs.forEach(s => {
html += `
<div class="card">
<div class="card-img">${s.emoji}</div>
<div><b>${s.title}</b></div>
<div style="color:#A0C0A0;">${s.artist}</div>
<div style="color:#FFD700;font-size:12px;margin:5px 0;">${s.plays} plays</div>
<div class="btn-group">
<button class="play-btn" onclick="playSong(${s.id})"><i class="fas fa-play"></i> Play</button>
<button class="del-btn" onclick="deleteSong(${s.id})"><i class="fas fa-trash"></i> Del</button>
</div>
</div>`;
});
html += '</div><h2 style="color:#FFD700;margin:20px 0;">📻 Live Radio</h2><div class="radio-grid">';
radios.slice(0,4).forEach(r => {
html += `
<div class="radio-card" onclick="playRadio('${r.name}')">
<span class="live">LIVE</span>
<div style="font-size:40px;">${r.emoji}</div>
<h3>${r.name}</h3>
<p>${r.country}</p>
</div>`;
});
html += '</div>';
document.getElementById('mainContent').innerHTML = html;
}

// ========== UPLOAD PAGE ==========
function showUpload() {
if(!currentUser) { toast('Login first'); showLogin(); return; }
audioFiles = []; imageFiles = [];
let html = `
<div style="background:#0F2B0F;border:2px solid #2A5A2A;border-radius:20px;padding:20px;margin:20px 0;">
<h2 style="color:#FFD700;"><i class="fas fa-cloud-upload-alt"></i> Upload Multiple Songs</h2>

<div class="upload-area" onclick="document.getElementById('audioFiles').click()">
<i class="fas fa-music"></i>
<h3>Select Audio Files</h3>
<p>MP3 (Select multiple)</p>
</div>
<input type="file" id="audioFiles" accept="audio/*" multiple style="display:none;" onchange="handleAudioSelect()">
<div id="audioList" class="file-list"></div>

<div class="upload-area" onclick="document.getElementById('imageFiles').click()">
<i class="fas fa-image"></i>
<h3>Select Poster Images</h3>
<p>JPG, PNG (One per song)</p>
</div>
<input type="file" id="imageFiles" accept="image/*" multiple style="display:none;" onchange="handleImageSelect()">
<div id="imageList" class="file-list"></div>

<input type="text" id="artistName" placeholder="Artist Name (for all songs)">
<button onclick="uploadAll()">Upload All Songs</button>
</div>

<h2 style="color:#FFD700;">Your Uploads</h2>
<div class="grid" id="userUploadsGrid"></div>
`;
document.getElementById('mainContent').innerHTML = html;
showUserUploads();
}

function handleAudioSelect() {
let files = document.getElementById('audioFiles').files;
audioFiles = Array.from(files);
let html = '<h4>Selected Audio:</h4>';
audioFiles.forEach((f,i) => {
html += `<div class="file-item"><span><i class="fas fa-music"></i> ${f.name}</span> <span style="color:#DC143C;cursor:pointer;" onclick="removeAudio(${i})">✖</span></div>`;
});
document.getElementById('audioList').innerHTML = html;
}

function handleImageSelect() {
let files = document.getElementById('imageFiles').files;
imageFiles = Array.from(files);
let html = '<h4>Selected Posters:</h4>';
imageFiles.forEach((f,i) => {
html += `<div class="file-item"><span><i class="fas fa-image"></i> ${f.name}</span> <span style="color:#DC143C;cursor:pointer;" onclick="removeImage(${i})">✖</span></div>`;
});
document.getElementById('imageList').innerHTML = html;
}

function removeAudio(i) { audioFiles.splice(i,1); handleAudioSelect(); }
function removeImage(i) { imageFiles.splice(i,1); handleImageSelect(); }

function uploadAll() {
if(!currentUser) { toast('Login required'); return; }
if(audioFiles.length === 0) { toast('Select audio files'); return; }
let artist = document.getElementById('artistName').value;
if(!artist) { toast('Enter artist name'); return; }

let count = 0;
audioFiles.forEach((file,i) => {
let title = prompt('Title for song '+(i+1), file.name.split('.')[0]);
if(!title) title = file.name;
let poster = imageFiles[i] ? URL.createObjectURL(imageFiles[i]) : null;
let newSong = {
id: Date.now() + i,
title: title,
artist: artist,
emoji: '🎵',
poster: poster,
url: URL.createObjectURL(file),
user: currentUser,
plays: 0
};
songs.push(newSong);
count++;
});

localStorage.setItem('songs', JSON.stringify(songs));
toast(count + ' songs uploaded!');
showUpload();
}

function showUserUploads() {
let userSongs = songs.filter(s => s.user === currentUser);
let html = '';
userSongs.forEach(s => {
html += `
<div class="card">
<div class="card-img" style="${s.poster ? `background-image:url('${s.poster}');background-size:cover;` : ''}">${!s.poster ? s.emoji : ''}</div>
<div><b>${s.title}</b></div>
<div style="color:#A0C0A0;">${s.artist}</div>
<div class="btn-group">
<button class="play-btn" onclick="playSong(${s.id})"><i class="fas fa-play"></i> Play</button>
<button class="del-btn" onclick="deleteSong(${s.id})"><i class="fas fa-trash"></i> Delete</button>
</div>
</div>`;
});
document.getElementById('userUploadsGrid').innerHTML = html || '<p>No uploads yet</p>';
}

// ========== RADIO PAGE ==========
function showRadio() {
let html = '<h2 style="color:#FFD700;margin:20px 0;">📻 All Radio Stations</h2><div class="radio-grid">';
radios.forEach(r => {
html += `
<div class="radio-card" onclick="playRadio('${r.name}')">
<span class="live">LIVE</span>
<div style="font-size:50px;">${r.emoji}</div>
<h3>${r.name}</h3>
<p>${r.country}</p>
</div>`;
});
html += '</div>';
document.getElementById('mainContent').innerHTML = html;
}

// ========== EARNINGS PAGE ==========
function showEarnings() {
if(!currentUser) { toast('Login first'); showLogin(); return; }
let userSongs = songs.filter(s => s.user === currentUser);
let progress = (hours / 500) * 100;
let html = `
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0;">
<div style="background:#143814;border:1px solid #2A5A2A;border-radius:20px;padding:20px;text-align:center;">
<h2 style="color:#FFD700;">$${earnings.toFixed(2)}</h2>
<p>Earnings</p>
</div>
<div style="background:#143814;border:1px solid #2A5A2A;border-radius:20px;padding:20px;text-align:center;">
<h2 style="color:#FFD700;">${plays}</h2>
<p>Plays</p>
</div>
<div style="background:#143814;border:1px solid #2A5A2A;border-radius:20px;padding:20px;text-align:center;">
<h2 style="color:#FFD700;">${userSongs.length}</h2>
<p>Songs</p>
</div>
<div style="background:#143814;border:1px solid #2A5A2A;border-radius:20px;padding:20px;text-align:center;">
<h2 style="color:#FFD700;">${hours.toFixed(1)}h</h2>
<p>Hours</p>
</div>
</div>
<div style="background:#0F2B0F;border:1px solid #2A5A2A;border-radius:20px;padding:20px;margin:20px 0;">
<h3 style="color:#FFD700;">⏰ 500 Hours Rule</h3>
<div style="background:#0A1F0A;height:10px;border-radius:5px;margin:10px 0;">
<div style="width:${progress}%;height:100%;background:#1DB954;border-radius:5px;"></div>
</div>
<p>${hours.toFixed(1)}/500 hours completed</p>
<p style="color:#FFD700;margin-top:10px;">Artist: 45% | Platform: 40% | Listeners: 15%</p>
</div>
<h2 style="color:#FFD700;">Your Songs Performance</h2>
<div class="grid" id="earningsGrid"></div>
`;
document.getElementById('mainContent').innerHTML = html;
let songHtml = '';
userSongs.forEach(s => {
let songPlays = s.plays || Math.floor(Math.random()*100);
songHtml += `
<div class="card">
<div class="card-img">${s.emoji}</div>
<div><b>${s.title}</b></div>
<div style="color:#A0C0A0;">${s.artist}</div>
<p style="color:#FFD700;">${songPlays} plays • $${(songPlays*0.45).toFixed(2)}</p>
</div>`;
});
document.getElementById('earningsGrid').innerHTML = songHtml || '<p>No songs</p>';
}

// ========== LIBRARY PAGE ==========
function showLibrary() {
if(!currentUser) { toast('Login first'); showLogin(); return; }
let userSongs = songs.filter(s => s.user === currentUser);
let html = '<h2 style="color:#FFD700;">📚 Your Library</h2><div class="grid" id="libraryGrid"></div>';
document.getElementById('mainContent').innerHTML = html;
let songHtml = '';
userSongs.forEach(s => {
songHtml += `
<div class="card">
<div class="card-img" style="${s.poster ? `background-image:url('${s.poster}');background-size:cover;` : ''}">${!s.poster ? s.emoji : ''}</div>
<div><b>${s.title}</b></div>
<div style="color:#A0C0A0;">${s.artist}</div>
<div class="btn-group">
<button class="play-btn" onclick="playSong(${s.id})"><i class="fas fa-play"></i> Play</button>
<button class="del-btn" onclick="deleteSong(${s.id})"><i class="fas fa-trash"></i> Delete</button>
</div>
</div>`;
});
document.getElementById('libraryGrid').innerHTML = songHtml || '<p>Your library is empty</p>';
}

// ========== PLAYER FUNCTIONS ==========
function playSong(id) {
let song = songs.find(s => s.id === id);
if(!song) return;

if(currentRadio) {
clearInterval(radioInterval);
currentRadio = null;
}

if(isPlaying) audio.pause();

currentSong = song;
audio.src = song.url;

audio.play().then(() => {
isPlaying = true;
document.getElementById('playerBar').style.display = 'block';
document.getElementById('playerTitle').innerText = song.title;
document.getElementById('playerArtist').innerText = song.artist;
document.getElementById('playerImg').innerHTML = song.emoji;
if(song.poster) {
document.getElementById('playerImg').style.backgroundImage = `url('${song.poster}')`;
document.getElementById('playerImg').innerHTML = '';
}
document.getElementById('playPauseIcon').className = 'fas fa-pause-circle';
toast('🎵 ' + song.title);

if(song.user) {
plays++; earnings += 0.45; hours += 0.1;
song.plays = (song.plays || 0) + 1;
localStorage.setItem('earnings', earnings);
localStorage.setItem('plays', plays);
localStorage.setItem('hours', hours);
localStorage.setItem('songs', JSON.stringify(songs));
}
}).catch(() => toast('Play error'));
}

function playRadio(name) {
if(radioInterval) clearInterval(radioInterval);
currentRadio = name;
document.getElementById('playerBar').style.display = 'block';
document.getElementById('playerTitle').innerText = name + ' Radio';
document.getElementById('playerArtist').innerText = 'Live 24/7';
document.getElementById('playerImg').innerHTML = '📻';
document.getElementById('playerImg').style.backgroundImage = '';
document.getElementById('playPauseIcon').className = 'fas fa-pause-circle';
isPlaying = true;
let progress = 0;
radioInterval = setInterval(() => {
progress = (progress + 0.1) % 100;
}, 500);
toast('📻 ' + name);
}

function togglePlay() {
if(currentRadio) {
if(isPlaying) {
clearInterval(radioInterv
