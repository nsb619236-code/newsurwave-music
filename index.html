<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Complete Music Platform</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #121212;
    color: #fff;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(135deg, #4caf50, #2c7be5);
    padding: 15px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 2rem;
  }
  #navbar {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 50px;
    background-color: #1ed760;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover {
    background-color: #17b34a;
  }
  section {
    padding: 20px;
    display: none;
    max-width: 1000px;
    margin: auto;
  }
  section.active {
    display: block;
  }
  /* Forms & Content styles */
  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #222;
    padding: 15px;
    border-radius: 10px;
  }
  input[type=text], input[type=email], input[type=tel], input[type=password], input[type=file] {
    padding: 8px;
    border-radius: 5px;
    border: none;
  }
  input[type=submit] {
    background: #4caf50;
    color: #fff;
    cursor: pointer;
  }
  input[type=submit]:hover {
    background: #3a9c44;
  }
  /* Content display */
#contentDisplay {
  margin-top: 20px;
}
.content-item {
  border: 1px solid #444;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
}
</style>
</head>
<body>

<header>
  <h1>Music & Content Platform</h1>
</header>

<div id="navbar">
  <button data-section="signup">Signup</button>
  <button data-section="login">Login</button>
  <button data-section="dashboard">Dashboard</button>
  <button data-section="upload">Upload Content</button>
  <button data-section="library">My Library</button>
  <button data-section="earnings">Earnings</button>
  <button data-section="admin">Admin Panel</button>
</div>

<!-- Signup Section -->
<section id="signup" class="active">
  <h2>Signup</h2>
  <form id="signupForm">
    <input type="text" placeholder="Full Name" id="signupName" required />
    <input type="email" placeholder="Email" id="signupEmail" required />
    <input type="tel" placeholder="Phone" id="signupPhone" required />
    <input type="password" placeholder="Password" id="signupPassword" required />
    <input type="submit" value="Sign Up" />
  </form>
</section>

<!-- Login Section -->
<section id="login">
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" placeholder="Email" id="loginEmail" required />
    <input type="password" placeholder="Password" id="loginPassword" required />
    <input type="submit" value="Login" />
  </form>
</section>

<!-- Dashboard for logged-in user -->
<section id="dashboard">
  <h2>Welcome to Dashboard</h2>
  <p>Use the menu to navigate.</p>
</section>

<!-- Content Upload -->
<section id="upload">
  <h2>Upload Content</h2>
  <form id="uploadForm">
    <input type="text" placeholder="Song Title" id="songTitle" required />
    <input type="text" placeholder="Artist Name" id="artistName" required />
    <input type="file" accept="audio/*" id="audioFile" required />
    <input type="file" accept="image/*" id="posterFile" required />
    <input type="submit" value="Upload" />
  </form>
</section>

<!-- Library -->
<section id="library">
  <h2>My Library</h2>
  <div id="contentDisplay">No Content Yet</div>
</section>

<!-- Earnings -->
<section id="earnings">
  <h2>Earnings Dashboard</h2>
  <p>Total Earnings: <strong>$0</strong></p>
</section>

<!-- Admin Panel -->
<section id="admin">
  <h2>Admin Panel</h2>
  <p>Manage Users & Content</p>
</section>

<script>
  const sections = document.querySelectorAll('section');
  const buttons = document.querySelectorAll('#navbar button');
  let currentUser = null;
  let userLibrary = [];
  let totalEarnings = 0;

  // Navigation
  buttons.forEach(btn => {
    btn.onclick = () => {
      const target = btn.getAttribute('data-section');
      sections.forEach(sec => {
        sec.classList.toggle('active', sec.id === target);
      });
    };
  });

  // Signup
document.getElementById('signupForm').onsubmit = (e) => {
  e.preventDefault();
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const phone = document.getElementById('signupPhone').value;
  const password = document.getElementById('signupPassword').value;
  // Save user info
  currentUser = { name, email, phone };
  alert('Signup successful! Welcome, ' + name);
  // Switch to dashboard
  sections.forEach(sec => sec.classList.remove('active'));
  document.getElementById('dashboard').classList.add('active');
  showLibrary();
};

// Login
document.getElementById('loginForm').onsubmit = (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  if (email && password) {
    currentUser = { name: 'Demo User', email };
    alert('Login successful!');
    sections.forEach(sec => sec.classList.remove('active'));
    document.getElementById('dashboard').classList.add('active');
    showLibrary();
  }
};

// Upload Content
document.getElementById('uploadForm').onsubmit = (e) => {
  e.preventDefault();
  const title = document.getElementById('songTitle').value;
  const artist = document.getElementById('artistName').value;
  const audioFile = document.getElementById('audioFile').files[0];
  const posterFile = document.getElementById('posterFile').files[0];

  if (audioFile && posterFile) {
    const readerAudio = new FileReader();
    readerAudio.onload = () => {
      const readerImage = new FileReader();
      readerImage.onload = () => {
        const content = {
          title,
          artist,
          audioSrc: readerAudio.result,
          posterSrc: readerImage.result
        };
        userLibrary.push(content);
        alert('Content uploaded!');
        showLibrary();
        document.getElementById('uploadForm').reset();
      };
      readerImage.readAsDataURL(posterFile);
    };
    readerAudio.readAsDataURL(audioFile);
  } else {
    alert('Select files!');
  }
};

function showLibrary() {
  const container = document.getElementById('contentDisplay');
  container.innerHTML = '';
  if (userLibrary.length === 0) {
    container.innerHTML = 'No Content Yet.';
  } else {
    userLibrary.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'content-item';
      div.innerHTML = `
        <h4>${item.title} by ${item.artist}</h4>
        <img src="${item.posterSrc}" style="width:100px; border-radius:8px; margin-right:10px; vertical-align:middle;">
        <audio controls src="${item.audioSrc}"></audio>
      `;
      container.appendChild(div);
    });
  }
}
</script>

</body>
</html>
