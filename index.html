<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>WaveHut • Premium Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* Same premium styles as before – glass, rotate, etc. */
    body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(to bottom right, #1e1b4b, #0f172a); color: white; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    .song-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(234,179,8,0.2); }
    #player.playing .album-art { animation: spin 20s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top bar same as before -->
  <header class="fixed top-0 w-full glass z-50 h-16 flex items-center px-6 justify-between">
    <div class="flex items-center gap-3">
      <span class="text-3xl font-bold text-yellow-400">WaveHut</span>
    </div>
    <div class="flex items-center gap-6">
      <button onclick="document.getElementById('upload-input').click()" class="bg-yellow-500 text-black px-5 py-2 rounded-full font-bold">Upload</button>
      <input type="file" id="upload-input" accept="audio/*" class="hidden" onchange="handleUpload(event)">
    </div>
  </header>

  <main class="flex-1 pt-20 pb-32 px-6 overflow-y-auto">
    <h1 class="text-5xl font-bold text-center mb-10">Your Music Library</h1>
    <div id="song-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
    <p id="status" class="text-center mt-10 text-xl text-yellow-300">Upload some songs to start playing 🔥</p>
  </main>

  <!-- Player -->
  <footer id="player" class="fixed bottom-0 w-full glass h-24 flex items-center px-6 z-50">
    <div class="flex items-center gap-4 flex-1">
      <div class="w-16 h-16 rounded-xl overflow-hidden album-art bg-gray-800">
        <img id="cover" src="https://picsum.photos/200" class="w-full h-full object-cover">
      </div>
      <div class="min-w-0">
        <div id="title" class="font-bold truncate">No song selected</div>
        <div id="artist" class="text-sm text-gray-400 truncate">Upload to play</div>
      </div>
    </div>

    <div class="flex flex-col items-center flex-1">
      <div class="flex gap-8 text-3xl mb-2">
        <button onclick="prev()"><i class="fas fa-backward-step"></i></button>
        <button id="playBtn" onclick="togglePlay()" class="text-yellow-400"><i class="fas fa-play-circle"></i></button>
        <button onclick="next()"><i class="fas fa-forward-step"></i></button>
      </div>
      <div class="w-full flex items-center gap-3 text-sm">
        <span id="currTime">0:00</span>
        <div class="flex-1 h-1 bg-gray-600 rounded-full">
          <div id="progress" class="h-full w-0 bg-yellow-400 rounded-full"></div>
        </div>
        <span id="dur">0:00</span>
      </div>
    </div>
  </footer>

  <audio id="audio"></audio>

  <script>
    let songs = JSON.parse(localStorage.getItem('mySongs')) || [];
    let currentIndex = -1;
    const audio = document.getElementById('audio');
    let isPlaying = false;

    function saveSongs() {
      localStorage.setItem('mySongs', JSON.stringify(songs));
      renderSongs();
    }

    function handleUpload(e) {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('audio/')) {
        alert("Sirf audio file upload karo bhai!");
        return;
      }

      const url = URL.createObjectURL(file);
      const newSong = {
        id: Date.now(),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: "You",
        src: url,
        cover: "https://picsum.photos/200?random=" + Date.now()
      };

      songs.unshift(newSong);
      saveSongs();
      document.getElementById('status').textContent = `"${newSong.title}" uploaded! Tap to play.`;
      playSong(0); // Auto play first uploaded
    }

    function renderSongs() {
      const grid = document.getElementById('song-grid');
      grid.innerHTML = '';
      if (songs.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-xl text-gray-400">No songs yet – Upload some MP3s!</p>';
        return;
      }

      songs.forEach((song, index) => {
        const card = document.createElement('div');
        card.className = 'glass rounded-2xl overflow-hidden cursor-pointer hover:scale-105 transition';
        card.innerHTML = `
          <img src="${song.cover}" class="w-full aspect-square object-cover">
          <div class="p-4">
            <div class="font-bold truncate">${song.title}</div>
            <div class="text-sm text-gray-300">${song.artist}</div>
          </div>
        `;
        card.onclick = () => playSong(index);
        grid.appendChild(card);
      });
    }

    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[index];

      audio.src = song.src;
      document.getElementById('cover').src = song.cover;
      document.getElementById('title').textContent = song.title;
      document.getElementById('artist').textContent = song.artist;

      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }).catch(err => {
        console.error("Play error:", err);
        alert("Play nahi ho raha – console kholo (F12) aur error batao, ya song dubara upload try karo.");
      });
    }

    function togglePlay() {
      if (currentIndex === -1) {
        if (songs.length > 0) playSong(0);
        else alert("Pehle song upload karo!");
        return;
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-play-circle"></i>';
        document.getElementById('player').classList.remove('playing');
      } else {
        audio.play();
        isPlaying = true;
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }
    }

    function next() {
      if (currentIndex < songs.length - 1) playSong(currentIndex + 1);
    }

    function prev() {
      if (currentIndex > 0) playSong(currentIndex - 1);
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progress').style.width = pct + '%';
      document.getElementById('currTime').textContent = formatTime(audio.currentTime);
      document.getElementById('dur').textContent = formatTime(audio.duration);
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Init
    renderSongs();
    if (songs.length > 0) playSong(0); // Auto start if songs exist

    console.log("WaveHut Fixed Version Loaded – Upload kar ke try karo!");
  </script>
</body>
</html>
