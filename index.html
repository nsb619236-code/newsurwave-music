<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Boss - Upload & Play</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0b0c0f;
            color: #f0f3f8;
            line-height: 1.5;
            scroll-behavior: smooth;
            padding-bottom: 80px;
        }

        /* custom scroll */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1a1c22; }
        ::-webkit-scrollbar-thumb { background: #e43d3d; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff5e5e; }

        /* typography */
        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        h2 {
            font-size: 2.4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(145deg, #fff, #c0c4d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* layout */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* buttons */
        .btn-primary {
            background: #e11d1d;
            border: none;
            color: white;
            padding: 0.9rem 2.2rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 22px -8px rgba(225, 29, 29, 0.3);
        }
        .btn-primary:hover {
            background: #ff2b2b;
            transform: scale(1.04);
            box-shadow: 0 18px 28px -6px #e11d1d80;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .btn-outline:hover {
            border-color: #e43d3d;
            background: rgba(228, 61, 61, 0.08);
        }

        /* header */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: rgba(11, 12, 15, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(130deg, #ffffff, #f0b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .logo i {
            color: #e43d3d;
            -webkit-text-fill-color: initial;
            background: none;
            margin-right: 6px;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-links a {
            color: #e0e4f0;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
            cursor: pointer;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: white;
            border-bottom-color: #e43d3d;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #e43d3d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Upload Button */
        .upload-btn {
            background: #e43d3d;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .upload-btn:hover {
            background: #ff2b2b;
            transform: scale(1.02);
        }

        /* hero */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
            padding: 3rem 0 5rem 0;
            flex-wrap: wrap;
        }
        .hero-content {
            flex: 1 1 400px;
        }
        .hero-content .badge {
            background: rgba(228, 61, 61, 0.18);
            color: #ffa3a3;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 1.4rem;
            border: 1px solid rgba(228, 61, 61, 0.3);
            backdrop-filter: blur(4px);
        }
        .hero-content h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #ffffff, #d6dae8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-content h1 span {
            background: linear-gradient(145deg, #ff8787, #e11d1d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }
        .hero-desc {
            font-size: 1.2rem;
            color: #b0b7cc;
            margin-bottom: 2.5rem;
            max-width: 550px;
        }
        .hero-buttons {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        /* Upload Section */
        .upload-section {
            background: #13151d;
            border-radius: 30px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #2a2d38;
            display: none;
        }

        .upload-section.active {
            display: block;
        }

        .upload-section h3 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #e43d3d;
        }

        .upload-area {
            border: 2px dashed #e43d3d;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: rgba(228, 61, 61, 0.1);
        }

        .upload-area i {
            font-size: 3rem;
            color: #e43d3d;
            margin-bottom: 1rem;
        }

        .upload-area h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .upload-area p {
            color: #9299b0;
            font-size: 0.9rem;
        }

        .upload-form {
            margin-top: 1.5rem;
        }

        .upload-form input,
        .upload-form select {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #0b0c0f;
            border: 1px solid #2a2d38;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }

        .upload-form input:focus,
        .upload-form select:focus {
            outline: none;
            border-color: #e43d3d;
        }

        .upload-form button {
            width: 100%;
            padding: 1rem;
            background: #e43d3d;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-form button:hover {
            background: #ff2b2b;
        }

        /* featured section */
        .featured {
            padding: 3rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .section-header h2 {
            font-size: 2rem;
            margin-bottom: 0;
        }
        .section-header a {
            color: #e43d3d;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
        }
        .music-card {
            background: #13151d;
            border-radius: 20px;
            padding: 1rem;
            transition: 0.2s ease;
            border: 1px solid #2a2d38;
            cursor: pointer;
            position: relative;
        }
        .music-card:hover {
            background: #1b1e2a;
            transform: translateY(-5px);
            border-color: #e43d3d60;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(145deg, #333842, #181b24);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #dd8585;
            margin-bottom: 0.8rem;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .play-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #e43d3d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }
        .music-card:hover .play-btn,
        .music-card:active .play-btn {
            opacity: 1;
        }
        .music-card h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }
        .music-card p {
            color: #9299b0;
            font-size: 0.85rem;
        }
        .upload-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e43d3d;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dc3545;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
            z-index: 10;
        }
        .music-card:hover .delete-btn,
        .music-card:active .delete-btn {
            opacity: 1;
        }

        /* Player Bar */
        .player-bar {
            background: #13151d;
            border-top: 1px solid #2a2d38;
            padding: 0.8rem 1rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 40%;
        }
        .now-playing-img {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #e43d3d, #8b3d3d);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background-size: cover;
            background-position: center;
        }
        .now-playing-info h4 {
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }
        .now-playing-info p {
            font-size: 0.8rem;
            color: #9299b0;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .player-controls i {
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
        }
        .player-controls .fa-play-circle {
            font-size: 2.2rem;
            color: #e43d3d;
        }
        .progress-container {
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            height: 5px;
            background: #2a2d38;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: #e43d3d;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #13151d;
            padding: 2rem;
            border-radius: 30px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #2a2d38;
        }
        .modal-content h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #e43d3d;
        }
        .modal-content input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #0b0c0f;
            border: 1px solid #2a2d38;
            border-radius: 10px;
            color: white;
        }
        .modal-content button {
            width: 100%;
            padding: 1rem;
            background: #e43d3d;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-footer {
            text-align: center;
            margin-top: 1rem;
            color: #9299b0;
        }
        .modal-footer span {
            color: #e43d3d;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #e43d3d;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            display: none;
            z-index: 2001;
            font-size: 0.95rem;
            box-shadow: 0 5px 20px rgba(228,61,61,0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.8rem 1rem;
            }
            .logo {
                font-size: 1.4rem;
            }
            .nav-links {
                display: none;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .container {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-crown"></i> Music Boss
        </div>
        <div class="nav-links">
            <a class="active" onclick="showSection('home')">Home</a>
            <a onclick="showSection('uploads')">My Uploads</a>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="upload-btn" onclick="toggleUpload()">
                <i class="fas fa-upload"></i> Upload
            </button>
            <div class="user-profile" onclick="toggleAuth()">
                <div class="avatar" id="userAvatar">G</div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <!-- Hero Section -->
        <div class="hero">
            <div class="hero-content">
                <span class="badge"><i class="fas fa-bolt"></i> UPLOAD & PLAY</span>
                <h1>Upload your music. <br><span>Be the Boss.</span></h1>
                <p class="hero-desc">Upload songs with posters, play them anytime. Your personal music library.</p>
                <div class="hero-buttons">
                    <button class="btn-primary" onclick="playFeatured()"><i class="fas fa-play"></i> PLAY NOW</button>
                    <button class="btn-outline" onclick="toggleUpload()"><i class="fas fa-upload"></i> UPLOAD SONG</button>
                </div>
            </div>
        </div>

        <!-- Upload Section -->
        <div class="upload-section" id="uploadSection">
            <h3><i class="fas fa-cloud-upload-alt"></i> Upload New Song</h3>
            
            <!-- Hidden Inputs -->
            <input type="file" id="audioFile" accept="audio/*" style="display: none;" onchange="handleAudioSelect(event)">
            <input type="file" id="posterFile" accept="image/*" style="display: none;" onchange="handlePosterSelect(event)">
            
            <!-- Audio Upload Area -->
            <div class="upload-area" onclick="document.getElementById('audioFile').click()">
                <i class="fas fa-music"></i>
                <h4>Select Audio File</h4>
                <p id="audioFileName">MP3, WAV, M4A supported</p>
            </div>

            <!-- Poster Upload Area -->
            <div class="upload-area" onclick="document.getElementById('posterFile').click()">
                <i class="fas fa-image"></i>
                <h4>Select Poster Image</h4>
                <p id="posterFileName">JPG, PNG, GIF supported</p>
            </div>

            <!-- Upload Form -->
            <div class="upload-form">
                <input type="text" id="songTitle" placeholder="Song Title" value="">
                <input type="text" id="songArtist" placeholder="Artist Name" value="">
                <select id="songGenre">
                    <option value="Pop">Pop</option>
                    <option value="Rock">Rock</option>
                    <option value="Hip Hop">Hip Hop</option>
                    <option value="Bollywood">Bollywood</option>
                    <option value="Classical">Classical</option>
                </select>
                <button onclick="uploadSong()"><i class="fas fa-cloud-upload-alt"></i> Upload Now</button>
            </div>
        </div>

        <!-- My Uploads Section -->
        <div class="featured" id="uploadsSection">
            <div class="section-header">
                <h2><i class="fas fa-cloud-upload-alt"></i> My Uploads</h2>
                <span class="view-all" onclick="showUploads()">View All</span>
            </div>
            <div class="card-grid" id="myUploads"></div>
        </div>

        <!-- Recently Added -->
        <div class="featured">
            <div class="section-header">
                <h2>🔥 Recently Added</h2>
