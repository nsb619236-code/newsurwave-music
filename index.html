<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>WaveHut • Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <meta name="theme-color" content="#0f172a"/>
  <link rel="manifest" href="data:application/manifest+json,{
    'name': 'WaveHut',
    'short_name': 'WaveHut',
    'start_url': '.',
    'display': 'standalone',
    'background_color': '#0f172a',
    'theme_color': '#0f172a',
    'icons': [{'src': 'https://picsum.photos/192','sizes': '192x192','type': 'image/png'}]
  }"/>

  <style>
    html, body { height: 100%; overscroll-behavior: none; }
    body { 
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    #sidebar { transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
    }
    .song-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .song-card:active { transform: scale(0.97); }
    #player { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    input[type="range"] { accent-color: #eab308; }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-950 to-black text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Bar -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur-lg border-b border-slate-800/50">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-3">
        <button id="menu-btn" class="text-2xl md:hidden">
          <i class="fas fa-bars"></i>
        </button>
        <div class="text-2xl font-bold tracking-tight">
          <span class="text-yellow-400">Wave</span>Hut
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button class="text-xl"><i class="fas fa-moon"></i></button>
        <div class="text-sm font-medium">Guest</div>
        <button class="bg-yellow-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-2 active:scale-95">
          <i class="fas fa-cloud-upload-alt text-sm"></i> Upload
        </button>
      </div>
    </div>
  </header>

  <div class="flex flex-1 pt-14">

    <!-- Sidebar (collapsible on mobile) -->
    <aside id="sidebar" class="w-72 bg-slate-900/95 border-r border-slate-800 fixed md:static h-[calc(100%-3.5rem)] overflow-y-auto z-40 md:translate-x-0">
      <div class="p-5">
        <h3 class="uppercase text-xs tracking-wider text-slate-500 mb-4 font-semibold">Music Category</h3>
        <div class="space-y-1.5">
          <div class="px-4 py-3 rounded-xl hover:bg-slate-800 cursor-pointer flex items-center gap-3 active:bg-slate-700">
            <span class="text-xl">🎻</span> Classic
          </div>
          <div class="px-4 py-3 rounded-xl hover:bg-slate-800 cursor-pointer flex items-center gap-3 active:bg-slate-700">
            <span class="text-xl">🎷</span> Jazz
          </div>
          <!-- more categories... -->
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-28">
      <div class="p-5 md:p-8">

        <!-- Hero Banner -->
        <div class="relative rounded-3xl overflow-hidden h-80 md:h-96 bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 mb-8">
          <div class="absolute inset-0 bg-black/40"></div>
          <div class="relative z-10 p-8 md:p-12 flex flex-col h-full justify-end">
            <div class="text-sm inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-4 py-1 rounded-full mb-4">
              <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
              Since 2013
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold leading-tight tracking-tighter mb-3">
              Improve your<br>Music Taste
            </h1>
            <p class="text-slate-300 mb-6 max-w-md">We've guided millions of global users on their digital journey</p>
            <button onclick="playRandom()" class="w-fit bg-white text-black px-8 py-4 rounded-full font-bold flex items-center gap-3 hover:bg-slate-200 active:scale-95 transition">
              <i class="fas fa-play"></i> Start Listening
            </button>
          </div>
        </div>

        <!-- Popular Section -->
        <div class="mb-8">
          <div class="flex justify-between items-center mb-5">
            <h2 class="text-2xl font-bold">Popular Right Now</h2>
            <button class="text-yellow-400 text-sm font-medium flex items-center gap-1.5">
              See All <i class="fas fa-arrow-right"></i>
            </button>
          </div>
          <div id="popular-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <!-- Songs populated by JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Player (fixed) -->
  <footer id="player" class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-700 h-24 md:h-28 z-50 flex items-center px-4 md:px-8">
    <div class="flex items-center gap-3 w-44 md:w-72 flex-shrink-0">
      <div class="w-14 h-14 md:w-16 md:h-16 rounded-2xl overflow-hidden bg-slate-800 ring-1 ring-slate-700">
        <img id="player-cover" src="https://picsum.photos/id/1015/300" class="w-full h-full object-cover" alt="cover">
      </div>
      <div class="min-w-0">
        <div id="player-title" class="font-semibold text-base truncate">Select a song</div>
        <div id="player-artist" class="text-slate-400 text-sm truncate">—</div>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center gap-1.5 md:gap-2 mx-4 md:mx-12">
      <div class="flex items-center gap-5 md:gap-10 text-slate-300 text-xl md:text-2xl">
        <button id="shuffle-btn" class="hover:text-white active:scale-95"><i class="fas fa-random"></i></button>
        <button id="prev-btn" class="hover:text-white active:scale-95"><i class="fas fa-backward-step"></i></button>
        
        <button id="play-btn" class="w-14 h-14 md:w-16 md:h-16 bg-yellow-400 rounded-full flex items-center justify-center text-slate-950 shadow-xl active:scale-95 transition">
          <i id="play-icon" class="fas fa-play text-2xl md:text-3xl"></i>
        </button>
        
        <button id="next-btn" class="hover:text-white active:scale-95"><i class="fas fa-forward-step"></i></button>
        <button id="repeat-btn" class="hover:text-white active:scale-95"><i class="fas fa-repeat"></i></button>
      </div>

      <div class="w-full flex items-center gap-2 text-xs text-slate-400">
        <span id="current-time">0:00</span>
        <div id="progress-container" class="flex-1 h-1.5 bg-slate-700 rounded-full cursor-pointer relative">
          <div id="progress" class="absolute h-full w-0 bg-yellow-400 rounded-full"></div>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-6 w-72 justify-end">
      <canvas id="visualizer" width="100" height="32" class="opacity-80"></canvas>
      <div class="flex items-center gap-3">
        <i class="fas fa-volume-low"></i>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" class="w-28">
      </div>
    </div>
  </footer>

  <audio id="audio" preload="auto"></audio>

  <script>
    // ─── SAMPLE SONGS (working public mp3 links) ────────────────────────
    const songs = [
      { id:1, title:"SoundHelix 1", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", cover:"https://picsum.photos/id/1015/300" },
      { id:2, title:"SoundHelix 2", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", cover:"https://picsum.photos/id/237/300" },
      { id:3, title:"SoundHelix 3", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", cover:"https://picsum.photos/id/1005/300" },
      { id:4, title:"SoundHelix 4", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", cover:"https://picsum.photos/id/870/300" },
      { id:5, title:"SoundHelix 5", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", cover:"https://picsum.photos/id/180/300" },
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let audio = document.getElementById("audio");
    let visualizerCtx = document.getElementById("visualizer")?.getContext("2d");

    function renderSongs() {
      const grid = document.getElementById("popular-grid");
      grid.innerHTML = "";
      songs.forEach(s => {
        const card = document.createElement("div");
        card.className = "song-card bg-slate-800/60 rounded-2xl overflow-hidden cursor-pointer active:scale-95";
        card.innerHTML = `
          <div class="relative">
            <img src="${s.cover}" class="w-full aspect-square object-cover">
            <button class="absolute bottom-3 right-3 w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg">
              <i class="fas fa-play text-slate-900 ml-0.5"></i>
            </button>
          </div>
          <div class="p-3">
            <div class="font-semibold truncate">${s.title}</div>
            <div class="text-sm text-slate-400 truncate">${s.artist}</div>
          </div>
        `;
        card.addEventListener("click", () => playSong(s.id));
        grid.appendChild(card);
      });
    }

    function playSong(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      currentIndex = songs.indexOf(song);
      audio.src = song.src;
      document.getElementById("player-cover").src = song.cover;
      document.getElementById("player-title").textContent = song.title;
      document.getElementById("player-artist").textContent = song.artist;

      audio.play().catch(e => {
        console.error("Playback failed:", e);
        alert("Autoplay blocked or network issue. Tap play again.");
      });
      isPlaying = true;
      document.getElementById("play-icon").classList.replace("fa-play", "fa-pause");
    }

    function togglePlay() {
      if (!audio.src) return playSong(songs[0].id);
      if (audio.paused) {
        audio.play();
        isPlaying = true;
        document.getElementById("play-icon").classList.replace("fa-play", "fa-pause");
      } else {
        audio.pause();
        isPlaying = false;
        document.getElementById("play-icon").classList.replace("fa-pause", "fa-play");
      }
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % songs.length;
      playSong(songs[currentIndex].id);
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      playSong(songs[currentIndex].id);
    }

    function updateProgress() {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      document.getElementById("progress").style.width = percent + "%";
      document.getElementById("current-time").textContent = formatTime(audio.currentTime);
      document.getElementById("duration").textContent = formatTime(audio.duration);
    }

    function formatTime(s) {
      if (!s) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2,'0')}`;
    }

    function playRandom() {
      const rand = Math.floor(Math.random() * songs.length);
      playSong(songs[rand].id);
    }

    // Event Listeners
    document.getElementById("play-btn").onclick = togglePlay;
    document.getElementById("next-btn").onclick = nextSong;
    document.getElementById("prev-btn").onclick = prevSong;
    document.getElementById("progress-container").onclick = e => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    };
    document.getElementById("volume").oninput = e => audio.volume = e.target.value;

    audio.ontimeupdate = updateProgress;
    audio.onended = nextSong;

    // Mobile menu toggle
    document.getElementById("menu-btn")?.addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
    });

    // Init
    renderSongs();

    // Optional: simple visualizer (bars)
    if (visualizerCtx) {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(audio);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      const buffer = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(buffer);
        visualizerCtx.clearRect(0,0,100,32);
        const barWidth = 100 / buffer.length;
        for (let i = 0; i < buffer.length; i++) {
          const height = (buffer[i] / 255) * 32;
          visualizerCtx.fillStyle = "#eab308";
          visualizerCtx.fillRect(i * barWidth, 32 - height, barWidth-1, height);
        }
      }
      draw();
    }

    console.log("WaveHut upgraded ✓ Mobile scrolling smooth | Controls working");
  </script>
</body>
</html>
