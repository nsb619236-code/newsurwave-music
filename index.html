<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Content Creator Platform</title>
<!-- Font Awesome & Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background-color: #121212;
    color: #fff;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(135deg, #4caf50, #2c7be5);
    padding: 15px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 2rem;
  }

  /* Buttons */
  #actionBtns {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 50px;
    background-color: #1ed760;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover {
    background-color: #17b34a;
  }

  /* Sections */
section {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}

.hidden {
  display: none;
}

/* Signup & Login Forms */
form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #222;
  padding: 15px;
  border-radius: 10px;
}
input {
  padding: 8px;
  border-radius: 5px;
  border: none;
}
input[type="submit"] {
  background-color: #4caf50;
  color: #fff;
  cursor: pointer;
}
input[type="submit"]:hover {
  background-color: #3a9c44;
}

/* Upload Form */
#uploadForm {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
</style>
</head>
<body>

<header>
  <h1>Content Creator Platform</h1>
</header>

<div id="actionBtns">
  <button id="signupBtn">Signup</button>
  <button id="loginBtn">Login</button>
  <button id="uploadContentBtn">Upload Content</button>
  <button id="viewLibraryBtn">My Library</button>
</div>

<!-- Signup Form -->
<div id="signupDiv" class="hidden">
  <h2>Signup</h2>
  <form id="signupForm">
    <input type="text" placeholder="Full Name" id="signupName" required />
    <input type="email" placeholder="Email" id="signupEmail" required />
    <input type="tel" placeholder="Phone Number" id="signupPhone" required />
    <input type="password" placeholder="Password" id="signupPassword" required />
    <input type="submit" value="Create Account" />
  </form>
</div>

<!-- Login Form -->
<div id="loginDiv" class="hidden">
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" placeholder="Email" id="loginEmail" required />
    <input type="password" placeholder="Password" id="loginPassword" required />
    <input type="submit" value="Login" />
  </form>
</div>

<!-- Upload Content Form -->
<div id="uploadDiv" class="hidden">
  <h2>Upload Your Content</h2>
  <form id="uploadForm">
    <input type="text" placeholder="Song Title" id="songTitle" required />
    <input type="text" placeholder="Artist Name" id="artistName" required />
    <input type="file" accept="audio/*" id="audioFile" required />
    <input type="file" accept="image/*" id="posterFile" required />
    <input type="submit" value="Upload" />
  </form>
  <div id="uploadedContent"></div>
</div>

<!-- My Library & Earnings -->
<div id="libraryDiv" class="hidden">
  <h2>My Content & Earnings</h2>
  <div id="contentList"></div>
  <h3>Earnings Dashboard</h3>
  <p>Total Earnings: <strong>$0</strong></p>
</div>

<script>
  // State variables
  let currentUser = null; // store user data after signup/login
  let userLibrary = []; // store uploaded songs

  // Button handlers
  document.getElementById('signupBtn').onclick = () => {
    toggleDivs('signupDiv');
  };
  document.getElementById('loginBtn').onclick = () => {
    toggleDivs('loginDiv');
  };
  document.getElementById('uploadContentBtn').onclick = () => {
    if (!currentUser) {
      alert('Please login first to upload content.');
      toggleDivs('loginDiv');
    } else {
      toggleDivs('uploadDiv');
    }
  };
  document.getElementById('viewLibraryBtn').onclick = () => {
    if (!currentUser) {
      alert('Please login first to view your library.');
      toggleDivs('loginDiv');
    } else {
      showLibrary();
    }
  };

  // Toggle visibility of sections
  function toggleDivs(divId) {
    document.querySelectorAll('div[id$="Div"]').forEach(div => {
      div.classList.add('hidden');
    });
    document.getElementById(divId).classList.remove('hidden');
  }

  // Signup form
document.getElementById('signupForm').onsubmit = (e) => {
  e.preventDefault();
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const phone = document.getElementById('signupPhone').value;
  const password = document.getElementById('signupPassword').value;
  // Save user info (simulate signup)
  currentUser = { name, email, phone };
  alert('Signup successful! Welcome, ' + name);
  toggleDivs('libraryDiv');
  showLibrary();
};

// Login form
document.getElementById('loginForm').onsubmit = (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  if (email && password) {
    // For demo, login always success
    currentUser = { name: 'Demo User', email };
    alert('Login successful! Welcome back.');
    toggleDivs('libraryDiv');
    showLibrary();
  } else {
    alert('Invalid credentials!');
  }
};

// Upload form
document.getElementById('uploadForm').onsubmit = (e) => {
  e.preventDefault();
  const title = document.getElementById('songTitle').value;
  const artist = document.getElementById('artistName').value;
  const audioFile = document.getElementById('audioFile').files[0];
  const posterFile = document.getElementById('posterFile').files[0];

  if (audioFile && posterFile) {
    // For demo, just simulate upload
    const readerAudio = new FileReader();
    readerAudio.onload = () => {
      const readerImage = new FileReader();
      readerImage.onload = () => {
        const newContent = {
          title,
          artist,
          audioSrc: readerAudio.result,
          posterSrc: readerImage.result
        };
        userLibrary.push(newContent);
        alert('Content uploaded successfully!');
        showLibrary();
        document.getElementById('uploadForm').reset();
        toggleDivs('libraryDiv');
      };
      readerImage.readAsDataURL(posterFile);
    };
    readerAudio.readAsDataURL(audioFile);
  } else {
    alert('Please select both audio and poster files.');
  }
};

// Display library
function showLibrary() {
  toggleDivs('libraryDiv');
  const listDiv = document.getElementById('contentList');
  listDiv.innerHTML = '';
  if (userLibrary.length === 0) {
    listDiv.innerHTML = '<p>No content uploaded yet.</p>';
  } else {
    userLibrary.forEach((item, index) => {
      const div = document.createElement('div');
      div.style.border = '1px solid #444';
      div.style.padding = '10px';
      div.style.marginBottom = '10px';
      div.innerHTML = `
        <h4>${item.title} by ${item.artist}</h4>
        <img src="${item.posterSrc}" style="width:100px; border-radius:8px; margin-right:10px; vertical-align:middle;" />
        <audio controls src="${item.audioSrc}"></audio>
      `;
      listDiv.appendChild(div);
    });
  }
}
</script>

</body>
</html>
