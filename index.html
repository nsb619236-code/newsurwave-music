<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurWave Music</title>
    <meta name="description" content="Stream your favorite music on SurWave">
    <meta name="keywords" content="music, streaming, audio, songs, playlist">

    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --bg-base: #000000;
            --bg-surface: #121212;
            --bg-highlight: #282828;
            --bg-elevated: #242424;
            --primary: #1ed760;
            --primary-hover: #1fdf64;
            --text-base: #ffffff;
            --text-subdued: #a7a7a7;
        }
    }

    @layer base {
        body {
            @apply bg-[var(--bg-base)] text-[var(--text-base)] font-sans antialiased overflow-hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #555; 
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #888; 
        }
    }

    @layer components {
        .btn-primary {
            @apply bg-[var(--primary)] text-black font-bold py-3 px-8 rounded-full hover:scale-105 hover:bg-[var(--primary-hover)] transition-transform duration-200;
        }
        .btn-icon {
            @apply text-[var(--text-subdued)] hover:text-white transition-colors duration-200 cursor-pointer;
        }
        .card-surface {
            @apply bg-[var(--bg-surface)] hover:bg-[var(--bg-highlight)] transition-colors duration-300 rounded-lg p-4 cursor-pointer;
        }
        .sidebar-link {
            @apply flex items-center gap-4 text-[var(--text-subdued)] hover:text-white font-medium transition-colors duration-200 py-2 cursor-pointer;
        }
        .sidebar-link.active {
            @apply text-white;
        }
    }

    @layer utilities {
        .text-shadow {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Load Components -->
    <script type="text/babel" src="data/mockData.js"></script>
    <script type="text/babel" src="components/Sidebar.js"></script>
    <script type="text/babel" src="components/TopBar.js"></script>
    <script type="text/babel" src="components/SongCard.js"></script>
    <script type="text/babel" src="components/MainContent.js"></script>
    <script type="text/babel" src="components/Player.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
