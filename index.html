<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        h2 { color: #38bdf8; }
        textarea {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: white;
            resize: none;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #7dd3fc; }
        #status { margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
        audio { width: 100%; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Suno AI Music</h2>
    <p>Apne gaane ka description likhein:</p>
    
    <textarea id="prompt" rows="4" placeholder="Example: A happy Bollywood pop song about friendship with upbeat drums..."></textarea>
    
    <button onclick="generateMusic()">Gaana Banayein</button>

    <div id="status">Taiyaar ho? Prompt likh kar click karein.</div>
    
    <audio id="audioPlayer" controls>
        Your browser does not support the audio element.
    </audio>
</div>

<script>
    function generateMusic() {
        const prompt = document.getElementById('prompt').value;
        const status = document.getElementById('status');
        const audio = document.getElementById('audioPlayer');

        if(!prompt) {
            alert("Kripya kuch likhein!");
            return;
        }

        status.innerText = "Suno AI gaana bana raha hai... Kripya intezaar karein.";
        
        // Note: Asli generation ke liye yahan API call karni hogi.
        // Filhaal hum ek dummy delay dikha rahe hain.
        setTimeout(() => {
            status.innerHTML = "✅ Gaana taiyaar hai!";
            audio.style.display = "block";
            // Yahan aapka generated song link aayega
            audio.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; 
        }, 3000);
    }
</script>

</body>
</html>
