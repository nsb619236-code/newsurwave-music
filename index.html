<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MP3 Song Generator | Suno AI Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .generator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .input-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .style-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .style-btn {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .style-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .style-btn:hover {
            border-color: #667eea;
        }

        .duration-selector {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .duration-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .duration-option.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .output-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .output-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .song-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .song-item:hover {
            transform: translateX(5px);
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .song-meta {
            font-size: 0.9em;
            color: #666;
        }

        .song-actions {
            display: flex;
            gap: 10px;
        }

        .play-btn, .download-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-btn {
            background: #667eea;
            color: white;
        }

        .play-btn:hover {
            background: #5a6fd8;
        }

        .download-btn {
            background: #28a745;
            color: white;
        }

        .download-btn:hover {
            background: #218838;
        }

        .audio-player {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .audio-player audio {
            width: 100%;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .feature-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 768px) {
            .generator-grid {
                grid-template-columns: 1fr;
            }
            
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .style-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 AI MP3 Song Generator</h1>
        <p class="subtitle">Suno AI Style - Create Amazing Songs with AI</p>

        <div class="generator-grid">
            <div class="input-section">
                <h2>🎤 Song Details</h2>
                
                <div class="form-group">
                    <label>Song Title</label>
                    <input type="text" id="songTitle" placeholder="Enter song title...">
                </div>

                <div class="form-group">
                    <label>Lyrics / Description</label>
                    <textarea id="lyrics" placeholder="Enter lyrics or describe what you want..."></textarea>
                </div>

                <div class="form-group">
                    <label>Music Style</label>
                    <select id="musicStyle">
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="hiphop">Hip Hop</option>
                        <option value="electronic">Electronic</option>
                        <option value="classical">Classical</option>
                        <option value="jazz">Jazz</option>
                        <option value="rnb">R&B</option>
                        <option value="country">Country</option>
                        <option value="folk">Folk</option>
                        <option value="metal">Metal</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mood</label>
                    <div class="style-options">
                        <button class="style-btn active" onclick="setMood('happy')">😊 Happy</button>
                        <button class="style-btn" onclick="setMood('sad')">😢 Sad</button>
                        <button class="style-btn" onclick="setMood('energetic')">⚡ Energetic</button>
                        <button class="style-btn" onclick="setMood('calm')">😌 Calm</button>
                        <button class="style-btn" onclick="setMood('romantic')">❤️ Romantic</button>
                        <button class="style-btn" onclick="setMood('dark')">🌑 Dark</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Duration</label>
                    <div class="duration-selector">
                        <div class="duration-option active" onclick="setDuration(30)">30 sec</div>
                        <div class="duration-option" onclick="setDuration(60)">1 min</div>
                        <div class="duration-option" onclick="setDuration(120)">2 min</div>
                        <div class="duration-option" onclick="setDuration(180)">3 min</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Voice Type</label>
                    <select id="voiceType">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="duet">Duet</option>
                        <option value="choir">Choir</option>
                        <option value="instrumental">Instrumental</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tempo</label>
                    <input type="range" id="tempo" min="60" max="200" value="120" step="1">
                    <span id="tempoValue">120 BPM</span>
                </div>

                <div class="form-group">
                    <label>Key</label>
                    <select id="key">
                        <option value="C">C Major</option>
                        <option value="Cm">C Minor</option>
                        <option value="D">D Major</option>
                        <option value="Dm">D Minor</option>
                        <option value="E">E Major</option>
                        <option value="Em">E Minor</option>
                        <option value="F">F Major</option>
                        <option value="Fm">F Minor</option>
                        <option value="G">G Major</option>
                        <option value="Gm">G Minor</option>
                        <option value="A">A Major</option>
                        <option value="Am">A Minor</option>
                        <option value="B">B Major</option>
                        <option value="Bm">B Minor</option>
                    </select>
                </div>
            </div>

            <div class="output-section">
                <h2>🎵 Generated Songs</h2>
                
                <button class="generate-btn" onclick="generateSong()" id="generateBtn">
                    Generate Song
                </button>

                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="audio-player" id="audioPlayer" style="display: none;">
                    <audio id="mainAudio" controls></audio>
                </div>

                <div class="song-list" id="songList">
                    <!-- Songs will be displayed here -->
                </div>
            </div>
        </div>

        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon">🎤</div>
                <div class="feature-title">AI Vocals</div>
                <div class="feature-desc">Realistic AI singing voices</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎸</div>
                <div class="feature-title">Multiple Styles</div>
                <div class="feature-desc">10+ music genres</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎹</div>
                <div class="feature-title">Custom Tempo</div>
                <div class="feature-desc">Adjust BPM and key</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📥</div>
                <div class="feature-title">Free Download</div>
                <div class="feature-desc">Download as MP3</div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentMood = 'happy';
        let currentDuration = 30;
        let songs = [];
        let currentAudio = null;

        // Load saved songs from localStorage
        function loadSongs() {
            const savedSongs = localStorage.getItem('generatedSongs');
            if (savedSongs) {
                songs = JSON.parse(savedSongs);
                displaySongs();
            }
        }

        // Set mood
        function setMood(mood) {
            currentMood = mood;
            document.querySelectorAll('.style-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Set duration
        function setDuration(duration) {
            currentDuration = duration;
            document.querySelectorAll('.duration-option').forEach(opt => {
                opt.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Update tempo display
        document.getElementById('tempo').addEventListener('input', function() {
            document.getElementById('tempoValue').textContent = this.value + ' BPM';
        });

        // Generate song
        async function generateSong() {
            const generateBtn = document.getElementById('generateBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            // Get input values
            const title = document.getElementById('songTitle').value || 'Untitled Song';
            const lyrics = document.getElementById('lyrics').value || 'AI generated song';
            const style = document.getElementById('musicStyle').value;
            const voice = document.getElementById('voiceType').value;
            const tempo = document.getElementById('tempo').value;
            const key = document.getElementById('key').value;
            
            // Disable button and show progress
            generateBtn.disabled = true;
            progressBar.style.display = 'block';
            
            // Simulate generation progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Create song object
                    const song = {
                        id: Date.now(),
                        title: title,
                        style: style,
                        mood: currentMood,
                        duration: currentDuration,
                        voice: voice,
                        tempo: tempo,
                        key: key,
                        lyrics: lyrics,
                        date: new Date().toLocaleString(),
                        audioUrl: generateAudioFile(title, style, currentMood)
                    };
                    
                    // Add to songs array
                    songs.unshift(song);
                    
                    // Save to localStorage
                    localStorage.setItem('generatedSongs', JSON.stringify(songs));
                    
                    // Display songs
                    displaySongs();
                    
                    // Reset UI
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                        generateBtn.disabled = false;
                    }, 500);
                }
                progressFill.style.width = progress + '%';
            }, 200);
        }

            if (songs.length === 0) {
