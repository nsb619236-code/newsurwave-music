<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>WaveHut • Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <meta name="theme-color" content="#0f172a"/>
  <style>
    html, body { height: 100%; overscroll-behavior: none; }
    body { -webkit-tap-highlight-color: transparent; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    #sidebar { transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
    @media (max-width: 768px) { #sidebar { transform: translateX(-100%); } #sidebar.open { transform: translateX(0); } }
    .song-card { transition: all 0.2s ease; }
    .song-card:active { transform: scale(0.97); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    #player { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    input[type="range"] { accent-color: #eab308; }
    .tab-active { color: #eab308; border-bottom: 3px solid #eab308; }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-950 to-black text-slate-100 min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-lg border-b border-slate-800/50">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-3">
        <button id="menu-btn" class="text-2xl md:hidden"><i class="fas fa-bars"></i></button>
        <div class="text-2xl font-bold tracking-tight"><span class="text-yellow-400">Wave</span>Hut</div>
      </div>
      <div class="flex items-center gap-4">
        <button id="theme-toggle" class="text-xl"><i class="fas fa-moon"></i></button>
        <div id="user-name" class="text-sm font-medium cursor-pointer" onclick="showLogin()">Guest</div>
        <button onclick="document.getElementById('upload-input').click()" class="bg-yellow-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center gap-2 active:scale-95">
          <i class="fas fa-cloud-upload-alt"></i> Upload
        </button>
        <input type="file" id="upload-input" accept="audio/*" class="hidden" onchange="handleUpload(event)">
      </div>
    </div>
  </header>

  <div class="flex flex-1 pt-14">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-slate-900/95 border-r border-slate-800 fixed md:static h-[calc(100%-3.5rem)] overflow-y-auto z-40 md:translate-x-0">
      <div class="p-5 space-y-6">
        <div>
          <h3 class="uppercase text-xs tracking-wider text-slate-500 mb-3 font-semibold">Navigation</h3>
          <div class="space-y-1">
            <div onclick="switchTab('discover')" class="tab px-4 py-3 rounded-xl hover:bg-slate-800 cursor-pointer flex items-center gap-3 active:bg-slate-700 tab-active"><i class="fas fa-home w-5"></i> Discover</div>
            <div onclick="switchTab('library')" class="tab px-4 py-3 rounded-xl hover:bg-slate-800 cursor-pointer flex items-center gap-3 active:bg-slate-700"><i class="fas fa-music w-5"></i> My Library</div>
            <div onclick="switchTab('playlists')" class="tab px-4 py-3 rounded-xl hover:bg-slate-800 cursor-pointer flex items-center gap-3 active:bg-slate-700"><i class="fas fa-list w-5"></i> Playlists</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-32">
      <div class="p-5 md:p-8">

        <!-- Login Modal (simple) -->
        <div id="login-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
          <div class="bg-slate-900 p-8 rounded-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Welcome to WaveHut</h2>
            <input id="username-input" type="text" placeholder="Enter your name" class="w-full p-4 bg-slate-800 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-yellow-400">
            <button onclick="login()" class="w-full bg-yellow-500 text-slate-900 py-4 rounded-xl font-bold active:scale-95">Continue</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="mt-4 w-full text-slate-400">Cancel</button>
          </div>
        </div>

        <!-- Discover Tab -->
        <div id="discover" class="tab-content">
          <div class="relative rounded-3xl overflow-hidden h-80 bg-gradient-to-br from-purple-950 to-indigo-950 mb-10">
            <div class="absolute inset-0 bg-black/40"></div>
            <div class="relative z-10 p-8 flex flex-col justify-end h-full">
              <h1 class="text-5xl font-extrabold mb-4">Improve Your Music Taste</h1>
              <p class="text-slate-300 mb-6">Join millions exploring great sounds</p>
              <button onclick="playRandom()" class="w-fit bg-white text-black px-8 py-4 rounded-full font-bold flex items-center gap-3 active:scale-95"><i class="fas fa-play"></i> Start Now</button>
            </div>
          </div>

          <h2 class="text-3xl font-bold mb-6">Popular Right Now</h2>
          <div id="popular-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-5"></div>
        </div>

        <!-- Library Tab -->
        <div id="library" class="tab-content hidden">
          <h2 class="text-3xl font-bold mb-6">My Library</h2>
          <div id="library-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-5"></div>
        </div>

        <!-- Playlists Tab -->
        <div id="playlists" class="tab-content hidden">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold">My Playlists</h2>
            <button onclick="createPlaylist()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-full flex items-center gap-2"><i class="fas fa-plus"></i> New Playlist</button>
          </div>
          <div id="playlists-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Player -->
  <footer id="player" class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-700 h-24 flex items-center px-4 md:px-8 z-50">
    <div class="flex items-center gap-4 flex-1 min-w-0">
      <img id="player-cover" src="https://picsum.photos/80" class="w-14 h-14 rounded-xl object-cover">
      <div class="min-w-0">
        <div id="player-title" class="font-semibold truncate">Select a song</div>
        <div id="player-artist" class="text-slate-400 text-sm truncate">—</div>
      </div>
    </div>

    <div class="flex flex-col items-center flex-1 mx-6">
      <div class="flex gap-6 md:gap-10 text-2xl text-slate-300 mb-2">
        <button id="shuffle" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
        <button onclick="prevSong()"><i class="fas fa-backward-step"></i></button>
        <button id="play-pause" onclick="togglePlay()" class="text-4xl text-yellow-400"><i class="fas fa-play-circle"></i></button>
        <button onclick="nextSong()"><i class="fas fa-forward-step"></i></button>
        <button id="repeat" onclick="toggleRepeat()"><i class="fas fa-repeat"></i></button>
      </div>
      <div class="w-full flex items-center gap-3 text-xs text-slate-400">
        <span id="current-time">0:00</span>
        <div id="progress-bar" class="flex-1 h-1.5 bg-slate-700 rounded-full cursor-pointer relative">
          <div id="progress-fill" class="absolute h-full w-0 bg-yellow-400 rounded-full"></div>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-4">
      <canvas id="viz" width="100" height="30"></canvas>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" class="w-32">
    </div>
  </footer>

  <audio id="audio"></audio>

  <script>
    // ─── Data ────────────────────────────────────────────────────────────
    let songs = [
      {id:1,title:"Energetic Rock",artist:"SoundHelix",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",cover:"https://picsum.photos/id/1015/300"},
      {id:2,title:"Dreamy Ambient",artist:"SoundHelix",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",cover:"https://picsum.photos/id/237/300"},
      {id:3,title:"Chill Beats",artist:"SoundHelix",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",cover:"https://picsum.photos/id/1005/300"},
      {id:4,title:"Upbeat Pop",artist:"SoundHelix",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",cover:"https://picsum.photos/id/870/300"},
      {id:5,title:"Epic Journey",artist:"SoundHelix",src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",cover:"https://picsum.photos/id/180/300"}
    ];

    let myLibrary = JSON.parse(localStorage.getItem('myLibrary')) || [];
    let playlists = JSON.parse(localStorage.getItem('playlists')) || [];
    let currentUser = localStorage.getItem('username') || 'Guest';
    let currentIndex = 0;
    let isPlaying = false;
    let shuffle = false;
    let repeat = false;

    const audio = document.getElementById('audio');

    // ─── Functions ───────────────────────────────────────────────────────
    function saveData() {
      localStorage.setItem('myLibrary', JSON.stringify(myLibrary));
      localStorage.setItem('playlists', JSON.stringify(playlists));
    }

    function handleUpload(e) {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('audio/')) return alert('Only audio files allowed!');
      
      const url = URL.createObjectURL(file);
      const newSong = {
        id: Date.now(),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: currentUser || 'You',
        src: url,
        cover: 'https://picsum.photos/300?random=' + Date.now(),
        uploaded: true
      };
      
      myLibrary.push(newSong);
      songs.push(newSong); // also add to global for search/play
      saveData();
      renderLibrary();
      alert('Song uploaded! Check My Library.');
    }

    function renderSongs(containerId, songList) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      songList.forEach(s => {
        const card = document.createElement('div');
        card.className = 'song-card bg-slate-800/60 rounded-2xl overflow-hidden cursor-pointer';
        card.innerHTML = `
          <div class="relative">
            <img src="${s.cover}" class="w-full aspect-square object-cover">
            <div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 bg-black/40 transition">
              <button onclick="playSong(${s.id}); event.stopPropagation()" class="w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center"><i class="fas fa-play text-slate-900 ml-1"></i></button>
            </div>
          </div>
          <div class="p-3">
            <div class="font-semibold truncate">${s.title}</div>
            <div class="text-sm text-slate-400 truncate">${s.artist}</div>
          </div>
        `;
        card.onclick = () => playSong(s.id);
        grid.appendChild(card);
      });
    }

    function renderLibrary() {
      renderSongs('library-grid', myLibrary);
    }

    function renderPlaylists() {
      const grid = document.getElementById('playlists-grid');
      grid.innerHTML = '';
      playlists.forEach(pl => {
        const div = document.createElement('div');
        div.className = 'bg-slate-800/60 rounded-2xl p-4 cursor-pointer hover:bg-slate-700';
        div.innerHTML = `
          <div class="font-bold mb-1">${pl.name}</div>
          <div class="text-sm text-slate-400">${pl.songs.length} songs</div>
        `;
        div.onclick = () => playPlaylist(pl);
        grid.appendChild(div);
      });
    }

    function playSong(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;
      
      currentIndex = songs.indexOf(song);
      audio.src = song.src;
      document.getElementById('player-cover').src = song.cover;
      document.getElementById('player-title').textContent = song.title;
      document.getElementById('player-artist').textContent = song.artist;
      
      audio.play().catch(() => alert('Tap play again (browser policy)'));
      isPlaying = true;
      document.getElementById('play-pause').innerHTML = '<i class="fas fa-pause-circle"></i>';
    }

    function togglePlay() {
      if (!audio.src) return playSong(songs[0].id);
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('play-pause').innerHTML = '<i class="fas fa-play-circle"></i>';
      } else {
        audio.play();
        isPlaying = true;
        document.getElementById('play-pause').innerHTML = '<i class="fas fa-pause-circle"></i>';
      }
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % songs.length;
      playSong(songs[currentIndex].id);
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      playSong(songs[currentIndex].id);
    }

    function playRandom() {
      const rand = Math.floor(Math.random() * songs.length);
      playSong(songs[rand].id);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tab).classList.remove('hidden');
      
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('tab-active'));
      event.target?.classList.add('tab-active');
      
      if (tab === 'library') renderLibrary();
      if (tab === 'playlists') renderPlaylists();
    }

    function showLogin() {
      document.getElementById('login-modal').classList.remove('hidden');
    }

    function login() {
      const name = document.getElementById('username-input').value.trim() || 'User';
      localStorage.setItem('username', name);
      currentUser = name;
      document.getElementById('user-name').textContent = name;
      document.getElementById('login-modal').classList.add('hidden');
    }

    function createPlaylist() {
      if (currentUser === 'Guest') return alert('Login first!');
      const name = prompt('Playlist name?');
      if (!name) return;
      playlists.push({name, songs: []});
      saveData();
      renderPlaylists();
    }

    function playPlaylist(pl) {
      if (pl.songs.length === 0) return alert('Add songs first (coming soon)!');
      // For now play first song
      const firstId = pl.songs[0];
      playSong(firstId);
    }

    function toggleShuffle() { shuffle = !shuffle; document.getElementById('shuffle').style.color = shuffle ? '#eab308' : ''; }
    function toggleRepeat() { repeat = !repeat; document.getElementById('repeat').style.color = repeat ? '#eab308' : ''; }

    // Progress & Time
    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('current-time').textContent = formatTime(audio.currentTime);
      document.getElementById('duration').textContent = formatTime(audio.duration);
    };

    audio.onended = () => {
      if (repeat) playSong(songs[currentIndex].id);
      else nextSong();
    };

    document.getElementById('progress-bar').onclick = e => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    };

    document.getElementById('volume').oninput = e => audio.volume = e.target.value;

    function formatTime(sec) {
      if (!sec) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2,'0')}`;
    }

    // Init
    document.getElementById('user-name').textContent = currentUser;
    renderSongs('popular-grid', songs);
    switchTab('discover');
    document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');

    console.log('WaveHut Pro Loaded ✓ Upload + Playlists + Account working');
  </script>
</body>
</html>
