<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss - Direct Working</title>
<style>
body{background:#000;color:gold;font-family:Arial;padding:20px;text-align:center;}
button{background:gold;color:#000;border:none;padding:15px;margin:10px;border-radius:30px;font-size:18px;width:200px;cursor:pointer;}
input{background:#111;color:#fff;border:2px solid gold;padding:12px;margin:10px;border-radius:25px;width:80%;font-size:16px;}
.card{background:#111;border:2px solid gold;border-radius:20px;padding:20px;margin:20px;display:inline-block;width:250px;}
</style>
</head>
<body>

<h1 style="font-size:50px;">👑 MUSIC BOSS</h1>
<p style="font-size:20px;">गाने सुनो • पैसे कमाओ</p>

<button onclick="showHome()">Home</button>
<button onclick="showUpload()">Upload</button>
<button onclick="showRadio()">Radio</button>
<button onclick="showEarnings()">Earnings</button>

<div id="content"></div>

<script>
let songs = JSON.parse(localStorage.getItem('songs') || '[]');
let user = localStorage.getItem('user') || null;

function showHome(){
let html = '<h2 style="color:gold;">🔥 Trending Songs</h2>';
songs.forEach(s => {
html += `<div class="card">
<h2>🎵 ${s.title}</h2>
<p>${s.artist}</p>
<button onclick="playSong('${s.url}')">Play</button>
</div>`;
});
document.getElementById('content').innerHTML = html;
}

function showUpload(){
if(!user){
alert('Login first!');
showLogin();
return;
}
let html = `
<h2 style="color:gold;">📤 Upload Song</h2>
<input type="file" id="audio" accept="audio/*">
<input type="text" id="title" placeholder="Song Title">
<input type="text" id="artist" placeholder="Artist">
<button onclick="uploadSong()">Upload</button>
`;
document.getElementById('content').innerHTML = html;
}

function uploadSong(){
let file = document.getElementById('audio').files[0];
let title = document.getElementById('title').value;
let artist = document.getElementById('artist').value;
if(!file || !title || !artist){
alert('Fill all fields');
return;
}
let url = URL.createObjectURL(file);
songs.push({title, artist, url});
localStorage.setItem('songs', JSON.stringify(songs));
alert('Uploaded!');
showHome();
}

function showRadio(){
let html = '<h2 style="color:gold;">📻 Live Radio</h2>';
let stations = ['Bollywood', 'English Pop', 'Punjabi', 'K-Pop'];
stations.forEach(s => {
html += `<div class="card">
<h2>📻 ${s}</h2>
<p>Live 24/7</p>
<button onclick="playRadio('${s}')">Listen</button>
</div>`;
});
document.getElementById('content').innerHTML = html;
}

function playRadio(name){
alert('🎵 Playing ' + name + ' Radio');
}

function showEarnings(){
if(!user){
alert('Login first');
showLogin();
return;
}
let html = `
<h2 style="color:gold;">💰 Your Earnings</h2>
<div class="card">
<h3>Total: $0.00</h3>
<p>Plays: 0</p>
</div>
`;
document.getElementById('content').innerHTML = html;
}

function showLogin(){
let html = `
<h2 style="color:gold;">Login</h2>
<input id="email" placeholder="Email" value="demo">
<input id="pass" placeholder="Password" value="123">
<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>
`;
document.getElementById('content').innerHTML = html;
}

function login(){
let e = document.getElementById('email').value;
let p = document.getElementById('password').value;
user = e;
localStorage.setItem('user', e);
alert('Login success!');
showHome();
}

function signup(){
let e = document.getElementById('email').value;
user = e;
localStorage.setItem('user', e);
alert('Account created!');
showHome();
}

function playSong(url){
let audio = new Audio(url);
audio.play();
alert('Playing song!');
}

// Default songs
if(songs.length === 0){
songs = [
{title:'Blinding Lights', artist:'Weeknd', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{title:'Levitating', artist:'Dua Lipa', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
];
localStorage.setItem('songs', JSON.stringify(songs));
}

showHome();
</script>
</body>
</html>
