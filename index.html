<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Boss - Dark Green Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0A1F0A;  /* Dark green background */
            color: #E0F0E0;
            padding: 20px;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* ===== DARK GREEN THEME ===== */
        :root {
            --bg-primary: #0A1F0A;
            --bg-secondary: #0F2B0F;
            --bg-card: #143814;
            --bg-hover: #1E4A1E;
            --text-primary: #E0F0E0;
            --text-secondary: #A0C0A0;
            --border-color: #2A5A2A;
            --success: #2E8B57;
            --warning: #FFA500;
            --danger: #DC143C;
            --gold: #FFD700;  /* Only for logo */
        }

        /* ===== HEADER WITH GOLDEN LOGO ===== */
        .header {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            color: var(--gold);  /* Golden logo only */
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
            margin-bottom: 10px;
        }

        .logo i {
            color: var(--gold);
            margin-right: 10px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* ===== NAVIGATION ===== */
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 40px;
            cursor: pointer;
            flex: 1;
            min-width: 90px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: var(--bg-hover);
            border-color: var(--success);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        /* ===== USER SECTION ===== */
        .user-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }

        .balance {
            background: var(--bg-primary);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            color: var(--gold);  /* Golden text for balance */
            font-weight: bold;
        }

        /* ===== SECTION TITLES ===== */
        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin: 30px 0 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--success);
        }

        /* ===== CARDS GRID ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .music-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .music-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,100,0,0.3);
            border-color: var(--success);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: var(--bg-primary);
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--border-color);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-artist {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .play-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
        }

        .play-btn:hover {
            background: #3A9B5A;
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #FF3B5C;
        }

        /* ===== RADIO GRID ===== */
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .radio-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 25px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .radio-card:hover {
            transform: scale(1.02);
            border-color: var(--success);
        }

        .live-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .radio-card h2 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .radio-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .radio-card p {
            color: var(--text-secondary);
        }

        /* ===== UPLOAD SECTION ===== */
        .upload-section {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
        }

        .upload-area {
            background: var(--bg-primary);
            border: 2px dashed var(--success);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: var(--bg-hover);
            border-color: var(--gold);  /* Golden border on hover */
        }

        .upload-area i {
            font-size: 48px;
            color: var(--success);
            margin-bottom: 10px;
        }

        .file-list {
            background: var(--bg-primary);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .remove-file {
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        /* ===== INPUTS ===== */
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-primary);
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--success);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        /* ===== BUTTONS ===== */
        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #3A9B5A;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46,139,86,0.3);
        }

        /* ===== EARNINGS DASHBOARD ===== */
        .earnings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .earning-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
        }

        .earning-card h3 {
            font-size: 32px;
            color: var(--success);
            margin-bottom: 5px;
        }

        .earning-card p {
            color: var(--text-secondary);
        }

        .progress-container {
            background: var(--bg-primary);
            border-radius: 30px;
            padding: 20px;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--border-color);
            border-radius: 5px;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 5px;
            transition: width 0.3s;
        }

        /* ===== PLAYER BAR ===== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 2px solid var(--success);
            padding: 15px 25px;
            display: none;
            z-index: 1000;
        }

        .player-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 250px;
        }

        .player-img {
            width: 60px;
            height: 60px;
            background: var(--success);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background-size: cover;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .control-btn:hover {
            background: var(--success);
        }

        .control-btn i {
            font-size: 20px;
            color: white;
        }

        .play-btn-large {
            width: 60px;
            height: 60px;
            background: var(--success);
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h2 {
            color: var(--success);
            margin-bottom: 20px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            display: none;
            z-index: 3000;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- HEADER WITH GOLDEN LOGO -->
<div class="header">
    <div class="logo">
        <i class="fas fa-crown"></i> MUSIC BOSS
    </div>
    <div class="tagline">
        🎵 गाने सुनो • पैसे कमाओ • Listen & Earn
    </div>
</div>

<!-- NAVIGATION -->
<div class="nav">
    <button class="nav-btn active" onclick="showPage('home')"><i class="fas fa-home"></i> Home</button>
    <button class="nav-btn" onclick="showPage('upload')"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
    <button class="nav-btn" onclick="showPage('radio')"><i class="fas fa-broadcast-tower"></i> Radio</button>
    <button class="nav-btn" onclick="showPage('earnings')"><i class="fas fa-chart-line"></i> Earnings</button>
    <button class="nav-btn" onclick="showPage('library')"><i class="fas fa-books"></i> Library</button>
</div>

<!-- USER SECTION -->
<div class="user-section">
    <div class="user-info">
        <div class="avatar" id="userAvatar" onclick="showAuth()">G</div>
        <div>
            <div id="userName" style="font-weight:600;">Guest User</div>
            <div style="color: var(--text-secondary); font-size:13px;">Click avatar to login</div>
        </div>
    </div>
    <div class="balance" id="balanceDisplay">$0.00</div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent"></div>

<!-- PLAYER BAR -->
<div class="player-bar" id="playerBar">
    <div class="player-content">
        <div class="player-info">
            <div class="player-img" id="playerImg">🎵</div>
            <div>
                <h4 id="playerTitle">Not Playing</h4>
                <p id="playerArtist" style="color: var(--text-secondary);">-</p>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-btn" onclick="prevSong()">
                <i class="fas fa-step-backward"></i>
            </div>
            <div class="control-btn play-btn-large" onclick="playPause()">
                <i class="fas fa-play" id="playIcon"></i>
            </div>
            <div class="control-btn" onclick="nextSong()">
                <i class="fas fa-step-forward"></i>
            </div>
        </div>
    </div>
</div>

<!-- AUTH MODAL -->
<div class="modal" id="authModal">
    <div class="modal-content">
        <h2 id="authTitle">Login</h2>
        <input type="email" id="email" placeholder="Email" value="demo@music.com">
        <input type="password" id="password" placeholder="Password" value="123456">
        <button class="action-btn" onclick="handleAuth()" id="authBtn">Login</button>
        <button class="action-btn" style="background: transparent; border:1px solid var(--border-color);" onclick="toggleAuth()" id="toggleAuth">Sign Up</button>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ========== GLOBAL VARIABLES ==========
let currentUser = null;
let songs = [];
let currentSong = null;
let isPlaying = false;
let audio = new Audio();
let currentRadio = null;
let radioInterval = null;
let earnings = 0;
let plays = 0;
let hours = 0;
let audioFiles = [];
let imageFiles = [];

// ========== SAMPLE SONGS ==========
const sampleSongs = [
    {id:1, title:'Blinding Lights', artist:'The Weeknd', emoji:'🎤', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
    {id:2, title:'Levitating', artist:'Dua Lipa', emoji:'✨', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
    {id:3, title:'Peaches', artist:'Justin Bieber', emoji:'🍑', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'},
    {id:4, title:'Stay', artist:'Kid Laroi', emoji:'⭐', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'},
];

// ========== RADIO STATIONS ==========
const radioStations = [
    {id:1, name:'Bollywood Hits', country:'India', emoji:'🇮🇳', listeners:'2.5M'},
    {id:2, name:'English Pop', country:'USA', emoji:'🇺🇸', listeners:'5M'},
    {id:3, name:'Punjabi Beats', country:'India', emoji:'🇮🇳', listeners:'1.8M'},
    {id:4, name:'K-Pop', country:'Korea', emoji:'🇰🇷', listeners:'3.2M'},
    {id:5, name:'Latin Hits', country:'Spain', emoji:'🇪🇸', listeners:'4M'},
    {id:6, name:'Arabic Hits', country:'UAE', emoji:'🇦🇪', listeners:'2.8M'},
    {id:7, name:'Japanese Pop', country:'Japan', emoji:'🇯🇵', listeners:'2.1M'},
    {id:8, name:'French Café', country:'France', emoji:'🇫🇷', listeners:'1.2M'},
];

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    checkUser();
    showHome();
});

function loadData() {
    let savedSongs = localStorage.getItem('songs');
    if(savedSongs) {
        try {
            songs = JSON.parse(savedSongs);
        } catch(e) {
            songs = [];
        }
    } else {
        songs = [];
    }
    
    if(songs.length === 0) {
        songs = [...sampleSongs];
        saveSongs();
    }
    
    let savedEarnings = localStorage.getItem('earnings');
    let savedPlays = localStorage.getItem('plays');
    let savedHours = localStorage.getItem('hours');
    
    earnings = savedEarnings ? parseFloat(savedEarnings) : 0;
    plays = savedPlays ? parseInt(savedPlays) : 0;
