<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#000;color:#fff;padding:10px;}
.header{background:#1DB954;padding:20px;border-radius:10px;text-align:center;margin-bottom:15px;}
.header h1{font-size:30px;}
.nav{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap;}
.nav-btn{background:#1DB954;color:#000;border:none;padding:10px;border-radius:20px;font-weight:bold;cursor:pointer;flex:1;font-size:14px;}
.nav-btn.sec{background:#333;color:#fff;}
.user{background:#111;padding:10px;border-radius:30px;margin-bottom:15px;display:flex;justify-content:space-between;}
.avatar{width:35px;height:35px;background:#1DB954;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.section-title{font-size:18px;margin:15px 0 10px;color:#1DB954;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:15px;}
.music-card{background:#181818;padding:10px;border-radius:8px;cursor:pointer;}
.card-img{width:100%;aspect-ratio:1;background:#1DB954;border-radius:6px;margin-bottom:5px;display:flex;align-items:center;justify-content:center;font-size:25px;}
.card-title{font-size:13px;font-weight:bold;}
.card-artist{font-size:11px;color:#b3b3b3;}
.radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:15px;}
.radio-card{background:linear-gradient(135deg,#1DB954,#0f8f3f);padding:12px;border-radius:8px;cursor:pointer;position:relative;}
.live-badge{position:absolute;top:3px;right:3px;background:red;color:#fff;padding:2px 4px;border-radius:8px;font-size:9px;}
.upload-box{background:#181818;border:2px dashed #1DB954;border-radius:8px;padding:15px;text-align:center;margin:8px 0;cursor:pointer;}
.file-list{background:#111;border-radius:5px;padding:8px;margin:5px 0;max-height:150px;overflow-y:auto;}
.file-item{display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #333;font-size:12px;}
.remove-file{color:red;cursor:pointer;}
input,select{width:100%;padding:10px;margin:5px 0;background:#111;border:1px solid #333;border-radius:20px;color:#fff;}
button{background:#1DB954;color:#000;border:none;padding:12px;border-radius:20px;font-weight:bold;cursor:pointer;width:100%;margin:5px 0;}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:#181818;padding:10px;border-top:2px solid #1DB954;display:none;}
.player-info{display:flex;align-items:center;gap:10px;margin-bottom:5px;}
.player-img{width:40px;height:40px;background:#1DB954;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:20px;}
.player-controls i{font-size:20px;color:#b3b3b3;cursor:pointer;}
.player-controls .fa-play-circle{color:#1DB954;font-size:28px;}
.progress-bar{width:100%;height:3px;background:#333;border-radius:2px;margin:5px 0;cursor:pointer;}
.progress{width:0%;height:100%;background:#1DB954;border-radius:2px;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:#121212;padding:20px;border-radius:15px;width:90%;max-width:320px;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1DB954;color:#000;padding:8px 16px;border-radius:30px;display:none;z-index:2000;font-size:14px;}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="header">
<h1>🎵 MUSIC BOSS</h1>
<p>Upload • Radio • Earn</p>
</div>

<div class="nav">
<button class="nav-btn" onclick="showHome()">Home</button>
<button class="nav-btn sec" onclick="showUpload()">Upload</button>
<button class="nav-btn sec" onclick="showRadio()">Radio</button>
<button class="nav-btn sec" onclick="showEarnings()">Earnings</button>
<button class="nav-btn sec" onclick="showLibrary()">Library</button>
</div>

<div class="user">
<span id="userName">Guest</span>
<div class="avatar" id="userAvatar" onclick="showAuth()">G</div>
</div>

<div id="mainContent"></div>

<div class="player-bar" id="playerBar">
<div class="player-info">
<div class="player-img" id="playerImg">🎵</div>
<div>
<h4 id="playerTitle">Not playing</h4>
<p id="playerArtist" style="color:#b3b3b3;font-size:12px;">-</p>
</div>
</div>
<div class="progress-bar" onclick="seekTo(event)">
<div class="progress" id="progress"></div>
</div>
<div class="player-controls">
<i class="fas fa-step-backward" onclick="prevSong()"></i>
<i class="fas fa-play-circle" id="playBtn" onclick="playPause()"></i>
<i class="fas fa-step-forward" onclick="nextSong()"></i>
</div>
</div>

<div class="modal" id="authModal">
<div class="modal-content">
<h2 id="authTitle">Login</h2>
<input type="email" id="email" placeholder="Email" value="demo">
<input type="password" id="password" placeholder="Password" value="123">
<button onclick="handleAuth()" id="authBtn">Login</button>
<button class="sec" onclick="toggleAuth()" id="toggleAuth">Sign Up</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Data
let user=null;
let songs=[];
let current=null;
let playing=false;
let audio=new Audio();
let radio=null;
let radioInt=null;
let earnings=0;
let plays=0;
let audioFiles=[];
let imageFiles=[];

// Sample songs
const demoSongs=[
{id:1,title:'Blinding Lights',artist:'The Weeknd',emoji:'🎤'},
{id:2,title:'Levitating',artist:'Dua Lipa',emoji:'✨'},
{id:3,title:'Peaches',artist:'JB',emoji:'🍑'},
{id:4,title:'Stay',artist:'Kid Laroi',emoji:'⭐'},
];

// Radio stations
const radios=[
{id:1,name:'Bollywood',country:'India',emoji:'🇮🇳'},
{id:2,name:'English Pop',country:'USA',emoji:'🇺🇸'},
{id:3,name:'Punjabi',country:'India',emoji:'🇮🇳'},
{id:4,name:'K-Pop',country:'Korea',emoji:'🇰🇷'},
{id:5,name:'Latin',country:'Spain',emoji:'🇪🇸'},
{id:6,name:'Arabic',country:'UAE',emoji:'🇦🇪'},
];

// Start
document.addEventListener('DOMContentLoaded',()=>{
loadData();
checkUser();
showHome();
});

function loadData(){
let saved=JSON.parse(localStorage.getItem('songs')||'[]');
songs=[...demoSongs,...saved];
}

function checkUser(){
let saved=localStorage.getItem('user');
if(saved){
let users=JSON.parse(localStorage.getItem('users')||'[]');
user=users.find(u=>u.email===saved);
if(user){
document.getElementById('userName').innerText=user.name||user.email;
document.getElementById('userAvatar').innerText=(user.name||user.email)[0];
loadEarnings();
}
}
}

function showAuth(){
document.getElementById('authModal').classList.add('active');
}

function toggleAuth(){
let t=document.getElementById('authTitle');
if(t.innerText==='Login'){
t.innerText='Sign Up';
document.getElementById('authBtn').innerText='Sign Up';
document.getElementById('toggleAuth').innerText='Back to Login';
}else{
t.innerText='Login';
document.getElementById('authBtn').innerText='Login';
document.getElementById('toggleAuth').innerText='Sign Up';
}
}

function handleAuth(){
let email=document.getElementById('email').value;
let pass=document.getElementById('password').value;
let title=document.getElementById('authTitle').innerText;
if(!email||!pass){toast('Fill all');return;}
let users=JSON.parse(localStorage.getItem('users')||'[]');
if(title==='Sign Up'){
if(users.find(u=>u.email===email)){toast('Exists');return;}
let newUser={email:email,pass:pass,name:email};
users.push(newUser);
localStorage.setItem('users',JSON.stringify(users));
user=newUser;
localStorage.setItem('user',email);
toast('Account created!');
}else{
let u=users.find(u=>u.email===email&&u.pass===pass);
if(u){user=u;localStorage.setItem('user',email);toast('Login success!');}
else{toast('Wrong');return;}
}
document.getElementById('authModal').classList.remove('active');
document.getElementById('userName').innerText=user.name||user.email;
document.getElementById('userAvatar').innerText=(user.name||user.email)[0];
loadEarnings();
showHome();
}

function showHome(){
let html=`
<div class="section-title">🔥 Trending</div>
<div class="card-grid" id="trending"></div>
<div class="section-title">📻 Live Radio</div>
<div class="radio-grid" id="radioHome"></div>
`;
document.getElementById('mainContent').innerHTML=html;
let t='';
demoSongs.slice(0,4).forEach(s=>{t+=`<div class="music-card" onclick="playSong(${s.id})"><div class="card-img">${s.emoji}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div></div>`;});
document.getElementById('trending').innerHTML=t;
let r='';
radios.slice(0,4).forEach(s=>{r+=`<div class="radio-card" onclick="playRadio(${s.id})"><span class="live-badge">LIVE</span><h2 style="font-size:30px;">${s.emoji}</h2><h3>${s.name}</h3><p>${s.country}</p></div>`;});
document.getElementById('radioHome').innerHTML=r;
}

function showUpload(){
if(!user){toast('Login first');showAuth();return;}
audioFiles=[];imageFiles=[];
let html=`
<div style="background:#121212;padding:15px;border-radius:10px;margin:10px 0;">
<h2 style="color:#1DB954;">📤 Upload Multiple</h2>
<div class="upload-box" onclick="document.getElementById('audio').click()"><i class="fas fa-music"></i><h3>Select Audio Files</h3><p>MP3 files</p></div>
<input type="file" id="audio" accept="audio/*" multiple style="display:none;" onchange="handleAudio()">
<div id="audioList" class="file-list"></div>
<div class="upload-box" onclick="document.getElementById('images').click()"><i class="fas fa-image"></i><h3>Select Cover Images</h3><p>JPG, PNG</p></div>
<input type="file" id="images" accept="image/*" multiple style="display:none;" onchange="handleImages()">
<div id="imageList" class="file-list"></div>
<input type="text" id="artistName" placeholder="Artist Name (for all)">
<button onclick="uploadAll()">Upload All Songs</button>
</div>
<div class="section-title">Your Uploads</div>
<div class="card-grid" id="userUploads"></div>
`;
document.getElementById('mainContent').innerHTML=html;
showUserUploads();
}

function handleAudio(){
let files=document.getElementById('audio').files;
audioFiles=Array.from(files);
let h='<h4>Audio Files:</h4>';
audioFiles.forEach((f,i)=>{h+=`<div class="file-item"><span>${f.name}</span><span class="remove-file" onclick="removeAudio(${i})">✖</span></div>`;});
document.getElementById('audioList').innerHTML=h;
}

function handleImages(){
let files=document.getElementById('images').files;
imageFiles=Array.from(files);
let h='<h4>Images:</h4>';
imageFiles.forEach((f,i)=>{h+=`<div class="file-item"><span>${f.name}</span><span class="remove-file" onclick="removeImage(${i})">✖</span></div>`;});
document.getElementById('imageList').innerHTML=h;
}

function removeAudio(i){audioFiles.splice(i,1);handleAudio();}
function removeImage(i){imageFiles.splice(i,1);handleImages();}

function uploadAll(){
if(!user){toast('Login');return;}
if(audioFiles.length===0){toast('Select audio files');return;}
let artist=document.getElementById('artistName').value;
if(!artist){toast('Enter artist name');return;}
let uploaded=JSON.parse(localStorage.getItem('songs')||'[]');
audioFiles.forEach((file,i)=>{
let title=prompt('Title for '+file.name,file.name.split('.')[0]);
let img=imageFiles[i]?URL.createObjectURL(imageFiles[i]):null;
let song={
id:Date.now()+i,
title:title||file.name,
artist:artist,
emoji:'🎵',
poster:img,
url:URL.createObjectURL(file),
uploadedBy:user.email,
plays:0
};
uploaded.push(song);
});
localStorage.setItem('songs',JSON.stringify(uploaded));
songs=[...demoSongs,...uploaded];
toast(audioFiles.length+' songs uploaded!');
showUpload();
}

function showUserUploads(){
let all=JSON.parse(localStorage.getItem('songs')||'[]');
let userSongs=all.filter(s=>s.uploadedBy===user?.email);
let h='';
userSongs.forEach(s=>{
h+=`<div class="music-card"><div class="card-img" style="${s.poster?'background-image:url('+s.poster+');background-size:cover;':''}">${!s.poster?(s.emoji):''}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div><button style="background:#ff4444;padding:3px;margin-top:5px;" onclick="deleteSong(${s.id})">Delete</button></div>`;
});
document.getElementById('userUploads').innerHTML=h||'<p>No uploads</p>';
}

function deleteSong(id){
if(!confirm('Delete?'))return;
let all=JSON.parse(localStorage.getItem('songs')||'[]');
all=all.filter(s=>s.id!==id);
localStorage.setItem('songs',JSON.stringify(all));
songs=[...demoSongs,...all];
toast('Deleted');
showUpload();
}

function showRadio(){
let html='<div class="section-title">📻 All Stations</div><div class="radio-grid" id="allRadio"></div>';
document.getElementById('mainContent').innerHTML=html;
let r='';
radios.forEach(s=>{r+=`<div class="radio-card" onclick="playRadio(${s.id})"><span class="live-badge">LIVE</span><h2 style="font-size:35px;">${s.emoji}</h2><h3>${s.name}</h3><p>${s.country}</p></div>`;});
document.getElementById('allRadio').innerHTML=r;
}

function playRadio(id){
let r=radios.find(r=>r.id===id);
if(!r)return;
if(radio){clearInterval(radioInt);}
radio=r;
document.getElementById('playerBar').style.display='block';
document.getElementById('playerTitle').innerText=r.name;
document.getElementById('playerArtist').innerText=r.country+' Radio';
document.getElementById('playerImg').innerHTML=r.emoji;
document.getElementById('playBtn').className='fas fa-pause-circle';
playing=true;
let p=0;
radioInt=setInterval(()=>{p=(p+0.1)%100;document.getElementById('progress').style.width=p+'%';},1000);
toast('📻 '+r.name);
}

function stopRadio(){
if(radio){clearInterval(radioInt);radio=null;playing=false;document.getElementById('playBtn').className='fas fa-play-circle';}
}

function showEarnings(){
if(!user){toast('Login');showAuth();return;}
loadEarnings();
let all=JSON.parse(localStorage.getItem('songs')||'[]');
let userSongs=all.filter(s=>s.uploadedBy===user.email);
let html=`
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0;">
<div style="background:#1DB954;padding:15px;border-radius:8px;text-align:center;color:#000;"><h3>$${earnings.toFixed(2)}</h3><p>Earnings</p></div>
<div style="background:#1DB954;padding:15px;border-radius:8px;text-align:center;color:#000;"><h3>${plays}</h3><p>Plays</p></div>
<div style="background:#1DB954;padding:15px;border-radius:8px;text-align:center;color:#000;"><h3>${userSongs.length}</h3><p>Songs</p></div>
</div>
<div class="section-title">Your Songs</div>
<div class="card-grid" id="earnSongs"></div>
`;
document.getElementById('mainContent').innerHTML=html;
let h='';
userSongs.forEach(s=>{h+=`<div class="music-card"><div class="card-img">${s.emoji}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div><p style="color:#1DB954;">$${(Math.random()*5).toFixed(2)}</p></div>`;});
document.getElementById('earnSongs').innerHTML=h||'<p>No songs</p>';
}

function showLibrary(){
if(!user){toast('Login');showAuth();return;}
let all=JSON.parse(localStorage.getItem('songs')||'[]');
let userSongs=all.filter(s=>s.uploadedBy===user.email);
let html='<div class="section-title">📚 Your Library</div><div class="card-grid" id="libSongs"></div>';
document.getElementById('mainContent').innerHTML=html;
let h='';
userSongs.forEach(s=>{h+=`<div class="music-card" onclick="playSong(${s.id})"><div class="card-img">${s.emoji}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div></div>`;});
document.getElementById('libSongs').innerHTML=h||'<p>Empty library</p>';
}

function playSong(id){
if(radio)stopRadio();
let s=songs.find(s=>s.id===id);
if(!s)return;
current=s;
document.getElementById('playerBar').style.display='block';
document.getElementById('playerTitle').innerText=s.title;
document.getElementById('playerArtist').innerText=s.artist;
document.getElementById('playerImg').innerHTML=s.emoji;
if(s.url){
audio.src=s.url;
audio.play();
playing=true;
document.getElementById('playBtn').className='fas fa-pause-circle';
if(s.uploadedBy===user?.email){plays++;earnings+=0.01;localStorage.setItem('earnings_'+user.email,JSON.stringify({plays,earnings}));}
}else{
playing=true;
document.getElementById('playBtn').className='fas fa-pause-circle';
let p=0;
let i=setInterval(()=>{if(!playing||radio){clearInterval(i);return;}p+=0.5;if(p<=100){document.getElementById('progress').style.width=p+'%';}else{clearInterval(i);nextSong();}},1000);
}
toast('▶️ '+s.title);
}

function playPause(){
if(radio){
if(playing){clearInterval(radioInt);document.getElementById('playBtn').className='fas fa-play-circle';}
else{playRadio(radio.id);}
playing=!playing;
return;
}
if(!current){if(songs.length>0)playSong(songs[0].id);return;}
if(playing){audio.pause();document.getElementById('playBtn').className='fas fa-play-circle';}
else{audio.play();document.getElementById('playBtn').className='fas fa-pause-circle';}
playing=!playing;
}

function nextSong(){
if(radio)return;
if(!current||songs.length===0)return;
let i=songs.findIndex(s=>s.id===current.id);
let n=(i+1)%songs.length;
playSong(songs[n].id);
}

function prevSong(){
if(radio)return;
if(!current||songs.length===0)return;
let i=songs.findIndex(s=>s.id===current.id);
let p=(i-1+songs.length)%songs.length;
playSong(songs[p].id);
}

function seekTo(e){
if(!audio.duration||radio)return;
let bar=e.currentTarget;
let pos=(e.clientX-bar.getBoundingClientRect().left)/bar.offsetWidth;
audio.currentTime=pos*audio.duration;
}

audio.ontimeupdate=function(){
if(audio.duration&&!radio){
let p=(audio.currentTime/audio.duration)*100;
document.getElementById('progress').style.width=p+'%';
}
};

function loadEarnings(){
let d=JSON.parse(localStorage.getItem('earnings_'+user?.email)||'{"plays":0,"earnings":0}');
plays=d.plays;earnings=d.earnings;
}

function toast(m){
let t=document.getElementById('toast');
t.style.display='block';
t.innerText=m;
setTimeout(()=>{t.style.display='none';},2000);
}
</script>
</body>
</html>
