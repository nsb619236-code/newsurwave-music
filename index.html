<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Boss - Earn With Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0f1e;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ===== PREMIUM DARK THEME ===== */
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc66;
            --primary-light: #88ffaa;
            --secondary: #ff3366;
            --accent: #ffaa00;
            --dark-1: #0a0f1e;
            --dark-2: #141b2b;
            --dark-3: #1e2740;
            --card-bg: rgba(20, 27, 43, 0.95);
            --text-light: #ffffff;
            --text-muted: #a0b0d0;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff3366;
            --border: rgba(0, 255, 136, 0.2);
            --shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
            --shadow-hover: 0 15px 40px rgba(0, 255, 136, 0.2);
            --gradient: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px rgba(0, 255, 136, 0.5); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.8); }
            100% { box-shadow: 0 0 5px rgba(0, 255, 136, 0.5); }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, rgba(0,255,136,0.1) 0%, rgba(0,204,255,0.1) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .logo i {
            font-size: 2.8rem;
            color: var(--primary);
            -webkit-text-fill-color: var(--primary);
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .tagline-container {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tagline {
            padding: 0.8rem 1.5rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary);
            backdrop-filter: blur(5px);
            animation: glow 3s ease-in-out infinite;
        }

        .tagline i {
            margin-right: 8px;
            color: var(--accent);
        }

        .lang-tagline {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .lang-tagline span {
            padding: 0.3rem 1rem;
            background: var(--dark-3);
            border-radius: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* ===== NAVIGATION ===== */
        .nav-bar {
            background: var(--dark-2);
            padding: 0.8rem 2rem;
            position: sticky;
            top: 85px;
            z-index: 900;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .nav-menu {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-item {
            padding: 0.8rem 2rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.2), transparent);
            transition: 0.5s;
        }

        .nav-item:hover::before {
            left: 100%;
        }

        .nav-item:hover {
            background: var(--primary);
            color: var(--dark-1);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            background: var(--primary);
            color: var(--dark-1);
        }

        /* ===== USER SECTION ===== */
        .user-section {
            background: var(--dark-2);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
        }

        .user-info {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border: 3px solid var(--primary);
            box-shadow: 0 0 20px var(--primary);
        }

        .user-stats {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
            min-width: 100px;
            padding: 0.8rem;
            background: var(--dark-3);
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .balance-card {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 1.5rem 3rem;
            border-radius: 20px;
            color: var(--dark-1);
            font-weight: bold;
            text-align: center;
            box-shadow: var(--shadow);
            animation: glow 3s ease-in-out infinite;
        }

        .balance-amount {
            font-size: 2.5rem;
            font-weight: 800;
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        /* ===== SECTION TITLES ===== */
        .section-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 2rem 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--primary);
        }

        .section-title i {
            font-size: 2.2rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }

        /* ===== CARDS GRID ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .music-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.2s);
        }

        .music-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .music-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,255,136,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: 0.5s;
        }

        .music-card:hover::before {
            opacity: 1;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 15px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .play-overlay {
            position: absolute;
            bottom: -50px;
            right: 10px;
            width: 45px;
            height: 45px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            box-shadow: 0 0 20px var(--primary);
        }

        .music-card:hover .play-overlay {
            bottom: 10px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .card-artist {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .earnings-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: var(--dark-1);
            padding: 0.3rem 0.8rem;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* ===== RADIO GRID ===== */
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .radio-card {
            background: linear-gradient(135deg, var(--dark-3), var(--dark-2));
            border-radius: 25px;
            padding: 2rem;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .radio-card:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .live-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        .radio-card h2 {
            font-size: 4rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .radio-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .listener-count {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* ===== EARNINGS DASHBOARD ===== */
        .earnings-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .earning-card {
            background: linear-gradient(135deg, var(--dark-3), var(--dark-2));
            border-radius: 25px;
            padding: 2rem;
            border: 1px solid var(--border);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .earning-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .earning-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .earning-value {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .earning-label {
            color: var(--text-muted);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .earning-trend {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.3rem 0.8rem;
            background: rgba(0,255,136,0.1);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--primary);
        }

        /* ===== RULES SECTION ===== */
        .rules-section {
            background: var(--dark-2);
            border-radius: 30px;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid var(--border);
        }

        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .rule-card {
            background: var(--dark-3);
            border-radius: 20px;
            padding: 1.5rem;
            border-left: 5px solid var(--primary);
        }

        .rule-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rule-desc {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .rule-highlight {
            color: var(--accent);
            font-weight: bold;
        }

        /* ===== EARNING STRUCTURE ===== */
        .structure-chart {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin: 2rem 0;
        }

        .structure-item {
            text-align: center;
            position: relative;
        }

        .structure-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            position: relative;
            animation: glow 3s ease-in-out infinite;
        }

        .circle-1 {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--dark-1);
        }

        .circle-2 {
            background: linear-gradient(135deg, var(--accent), #ff6600);
            color: var(--dark-1);
        }

        .circle-3 {
            background: linear-gradient(135deg, var(--secondary), #ff0066);
            color: var(--dark-1);
        }

        .circle-4 {
            background: linear-gradient(135deg, #00ccff, #0066ff);
            color: var(--dark-1);
        }

        .structure-label {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 150px;
        }

        /* ===== UPLOAD SECTION ===== */
        .upload-section {
            background: var(--dark-2);
            border-radius: 30px;
            padding: 2rem;
            margin: 2rem 0;
        }

        .upload-area {
            background: var(--dark-3);
            border: 2px dashed var(--primary);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin: 1rem 0;
        }

        .upload-area:hover {
            background: var(--dark-1);
            border-color: var(--accent);
        }

        .upload-area i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .file-list {
            background: var(--dark-3);
            border-radius: 15px;
            padding: 1rem;
            margin: 1rem 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .remove-file {
            color: var(--danger);
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* ===== PLAYER BAR ===== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20, 27, 43, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-top: 2px solid var(--primary);
            display: none;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        .player-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            min-width: 250px;
        }

        .player-img {
            width: 70px;
            height: 70px;
            background: var(--gradient);
            border-radius: 15px;
            display: flex;
            align-ite
