<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Boss - Complete Music Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0A0F0A;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ===== SPOTIFY-LIKE DARK GREEN THEME ===== */
        :root {
            --bg-primary: #0A0F0A;
            --bg-secondary: #121812;
            --bg-card: #1A241A;
            --bg-hover: #2A3A2A;
            --text-primary: #FFFFFF;
            --text-secondary: #B0C0B0;
            --accent-green: #1DB954;
            --accent-gold: #FFD700;
            --danger: #FF4444;
            --border: #2A3A2A;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--accent-gold);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--accent-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .balance {
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* ===== SIDEBAR & MAIN LAYOUT ===== */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
        }

        .sidebar-item:hover {
            background: var(--bg-hover);
            color: white;
        }

        .sidebar-item.active {
            background: var(--accent-green);
            color: black;
            font-weight: 600;
        }

        .sidebar-item i {
            width: 24px;
        }

        .main-content {
            flex: 1;
            min-height: 600px;
        }

        /* ===== SECTION TITLES ===== */
        .section-title {
            font-size: 28px;
            font-weight: 700;
            margin: 30px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-green);
        }

        /* ===== CARDS GRID ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .music-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
            position: relative;
        }

        .music-card:hover {
            background: var(--bg-hover);
            transform: translateY(-5px);
            border-color: var(--accent-green);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--bg-hover), var(--bg-primary));
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .play-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 45px;
            height: 45px;
            background: var(--accent-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .music-card:hover .play-overlay {
            opacity: 1;
            bottom: 15px;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-artist {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .play-btn, .delete-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-btn {
            background: var(--accent-green);
            color: black;
        }

        .play-btn:hover {
            background: #1ed760;
        }

        .delete-btn {
            background: var(--danger);
            color: white;
        }

        .delete-btn:hover {
            background: #ff6666;
        }

        /* ===== RADIO GRID ===== */
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .radio-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            text-align: center;
        }

        .radio-card:hover {
            transform: scale(1.02);
            border-color: var(--accent-green);
        }

        .live-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .radio-card h2 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .radio-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .listeners {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===== UPLOAD SECTION ===== */
        .upload-section {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 30px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--accent-green);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: var(--bg-hover);
            border-color: var(--accent-gold);
        }

        .upload-area i {
            font-size: 48px;
            color: var(--accent-green);
            margin-bottom: 15px;
        }

        .file-list {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .remove-file {
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
        }

        /* ===== EARNINGS DASHBOARD ===== */
        .earnings-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .earning-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .earning-card h3 {
            font-size: 36px;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        .earning-card p {
            color: var(--text-secondary);
        }

        .progress-container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* ===== PLAYER BAR ===== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 2px solid var(--accent-green);
            padding: 15px 30px;
            display: none;
            z-index: 1000;
        }

        .player-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 300px;
        }

        .player-img {
            width: 60px;
            height: 60px;
            background: var(--accent-green);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background-size: cover;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .control-btn:hover {
            background: var(--accent-green);
        }

        .control-btn i {
            font-size: 20px;
        }

        .play-btn-large {
            width: 60px;
            height: 60px;
            background: var(--accent-green);
        }

        .play-btn-large i {
            font-size: 28px;
        }

        /* ===== LIBRARY VIEW ===== */
        .library-filters {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .filter-chip {
            background: var(--bg-card);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .filter-chip.active {
            background: var(--accent-green);
            color: black;
            font-weight: 600;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-green);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: white;
        }

        .modal-content button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--accent-green);
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-green);
            color: black;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: none;
            z-index: 3000;
        }

        /* ===== INPUTS ===== */
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: white;
        }

        .action-btn {
            background: var(--accent-green);
            color: black;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

            </div>

    </div>
</div>

<!-- AUTH MODAL -->
<div class="modal" id="authModal">

        <button style="background: transparent; border: 1px solid var(--border); color: white;" onclick="toggleAuth()" id="toggleAuth">Create Account</button>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
