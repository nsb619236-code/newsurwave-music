<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Music Hut Beat • Full Features</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
    .glass { background: rgba(30,41,59,0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
    .card { transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    .card:hover { transform: translateY(-12px) scale(1.04); box-shadow: 0 30px 60px -15px rgba(234,179,8,0.4); }
    .playing .album { animation: spin 20s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .nav-active { color: #eab308; border-left: 4px solid #eab308; background: rgba(234,179,8,0.15); }
    .heart-liked { color: #ef4444 !important; }
    main { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  </style>
</head>
<body class="flex flex-col">

  <!-- Header -->
  <header class="fixed top-0 w-full glass z-50 h-16 flex items-center px-4 md:px-8 justify-between border-b border-white/10">
    <div class="flex items-center gap-3">
      <button id="menu-btn" class="lg:hidden text-2xl"><i class="fas fa-bars"></i></button>
      <span class="text-2xl font-bold tracking-tighter text-yellow-400">Music Hut Beat</span>
    </div>
    <div class="flex items-center gap-4 md:gap-6">
      <button onclick="toggleTheme()" class="text-xl"><i class="fas fa-moon"></i></button>
      <button onclick="document.getElementById('upload-multi').click()" class="bg-gradient-to-r from-yellow-500 to-amber-500 text-black px-5 py-2.5 rounded-full font-medium flex items-center gap-2 shadow-md">
        <i class="fas fa-cloud-upload-alt"></i> <span class="hidden md:inline">Upload</span>
      </button>
      <input type="file" id="upload-multi" accept="audio/*" multiple class="hidden" onchange="addMultipleSongs(event)">
    </div>
  </header>

  <div class="flex flex-1 pt-16">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 glass border-r border-white/10 h-full overflow-y-auto fixed lg:static z-40 -translate-x-full lg:translate-x-0 transition-transform">
      <div class="p-4 space-y-2">
        <div onclick="setView('library')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer nav-active">
          <i class="fas fa-music"></i> Library
        </div>
        <div onclick="setView('favorites')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
          <i class="fas fa-heart"></i> Favorites
        </div>
        <div onclick="setView('playlists')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
          <i class="fas fa-list"></i> Playlists
        </div>
        <div onclick="setView('recent')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
          <i class="fas fa-history"></i> Recent
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-32 px-4 md:px-8" style="height: calc(100vh - 64px);">
      <!-- Library -->
      <div id="library-view" class="view">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mt-8 mb-6">
          <h1 class="text-4xl md:text-5xl font-bold">Your Library</h1>
          <input id="search-lib" onkeyup="filterView('library')" placeholder="Search..." class="w-full md:w-72 bg-white/10 px-4 py-2.5 rounded-full border border-white/20 focus:border-yellow-400 outline-none">
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6 pb-20" id="library-songs"></div>
      </div>

      <!-- Favorites -->
      <div id="favorites-view" class="view hidden">
        <h1 class="text-4xl md:text-5xl font-bold mt-8 mb-6">Favorites ❤️</h1>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6 pb-20" id="favorites-songs"></div>
      </div>

      <!-- Playlists -->
      <div id="playlists-view" class="view hidden">
        <div class="flex justify-between items-center mt-8 mb-6">
          <h1 class="text-4xl md:text-5xl font-bold">Playlists</h1>
          <button onclick="createPlaylist()" class="bg-white/10 hover:bg-white/20 px-6 py-3 rounded-full flex items-center gap-2">
            <i class="fas fa-plus"></i> New
          </button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 pb-20" id="playlists-list"></div>
      </div>

      <!-- Recent -->
      <div id="recent-view" class="view hidden">
        <h1 class="text-4xl md:text-5xl font-bold mt-8 mb-6">Recently Played</h1>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6 pb-20" id="recent-songs"></div>
      </div>
    </main>
  </div>

  <!-- Player -->
  <footer id="player" class="fixed bottom-0 w-full glass h-20 md:h-24 flex items-center px-4 md:px-8 z-50 border-t border-white/10">
    <div class="flex items-center gap-3 md:gap-4 w-48 md:w-64 flex-shrink-0">
      <div class="album w-12 h-12 md:w-14 md:h-14 rounded-xl overflow-hidden shadow-lg">
        <img id="cover" src="https://picsum.photos/200?random=1" class="w-full h-full object-cover">
      </div>
      <div class="min-w-0 flex-1">
        <div id="title" class="font-medium truncate text-sm md:text-base">No song selected</div>
        <div id="artist" class="text-xs text-gray-400 truncate">Upload to start</div>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center gap-1 md:gap-2 mx-4 md:mx-8">
      <div class="flex items-center gap-4 md:gap-8 text-xl md:text-2xl text-gray-300">
        <button id="shuffle" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
        <button onclick="prev()"><i class="fas fa-backward-step"></i></button>
        <button id="playpause" onclick="togglePlay()" class="text-yellow-400 text-4xl md:text-5xl"><i class="fas fa-play-circle"></i></button>
        <button onclick="next()"><i class="fas fa-forward-step"></i></button>
        <button id="repeat" onclick="toggleRepeat()"><i class="fas fa-redo"></i></button>
      </div>
      <div class="w-full flex items-center gap-2 text-xs text-gray-400">
        <span id="curr">0:00</span>
        <div class="flex-1 h-1.5 bg-gray-700 rounded-full cursor-pointer" onclick="seek(event)">
          <div id="prog" class="h-full w-0 bg-yellow-400 rounded-full transition-all duration-150"></div>
        </div>
        <span id="total">0:00</span>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-4">
      <canvas id="viz" width="100" height="32" class="opacity-80"></canvas>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" class="w-24 accent-yellow-400">
    </div>
  </footer>

  <audio id="audio"></audio>

  <script>
    let songs = JSON.parse(localStorage.getItem('mhb_songs')) || [];
    let favorites = JSON.parse(localStorage.getItem('mhb_fav')) || [];
    let playlists = JSON.parse(localStorage.getItem('mhb_pl')) || [];
    let recent = JSON.parse(localStorage.getItem('mhb_recent')) || [];
    let currentIdx = -1;
    let isPlay = false;
    let shuffle = false;
    let repeat = 0;
    let currentPlId = null;
    const audio = document.getElementById('audio');
    let vizCtx;

    function saveAll() {
      localStorage.setItem('mhb_songs', JSON.stringify(songs));
      localStorage.setItem('mhb_fav', JSON.stringify(favorites));
      localStorage.setItem('mhb_pl', JSON.stringify(playlists));
      localStorage.setItem('mhb_recent', JSON.stringify(recent));
      renderAllViews();
    }

    function addMultipleSongs(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      let added = 0;
      files.forEach(file => {
        if (!file.type.startsWith('audio/')) return;
        const url = URL.createObjectURL(file);
        const song = {
          id: Date.now() + added,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "You",
          src: url,
          cover: `https://picsum.photos/seed/${Date.now()+added}/300`,
          duration: "0:00" // update later if needed
        };
        songs.unshift(song);
        added++;
      });

      if (added > 0) {
        saveAll();
        alert(`${added} song${added > 1 ? 's' : ''} added!`);
        if (currentIdx === -1 && songs.length) playIdx(0);
      }
    }

    function renderAllViews() {
      renderSongs('library-songs', songs, true);
      renderSongs('favorites-songs', favorites);
      renderSongs('recent-songs', recent);
      renderPlaylists();
    }

    function renderSongs(id, list, showDelete = false) {
      const grid = document.getElementById(id);
      grid.innerHTML = list.length ? '' : '<p class="col-span-full text-center py-16 text-gray-400 text-xl">Empty — add some music!</p>';

      list.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'card glass rounded-2xl overflow-hidden cursor-pointer relative group';
        card.innerHTML = `
          <img src="${s.cover}" class="w-full aspect-square object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition flex flex-col justify-end p-4">
            <div class="font-medium truncate">${s.title}</div>
            <div class="text-xs text-gray-300">${s.artist}</div>
          </div>
          <button onclick="event.stopPropagation(); toggleFavorite(${s.id})" class="absolute top-3 left-3 text-2xl ${favorites.some(f => f.id === s.id) ? 'heart-liked' : 'text-white/50'}">
            <i class="fas fa-heart"></i>
          </button>
          ${showDelete ? `<button onclick="event.stopPropagation(); deleteSong(${s.id})" class="absolute top-3 right-3 text-red-400 text-xl opacity-0 group-hover:opacity-100 transition">
            <i class="fas fa-trash"></i>
          </button>` : ''}
          <button onclick="event.stopPropagation(); playIdx(${songs.indexOf(s)})" class="absolute bottom-4 right-4 w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg">
            <i class="fas fa-play text-black ml-0.5"></i>
          </button>
        `;
        card.onclick = () => playIdx(songs.indexOf(s));
        grid.appendChild(card);
      });
    }

    function renderPlaylists() {
      const container = document.getElementById('playlists-list');
      container.innerHTML = "";
      playlists.forEach(pl => {
        const div = document.createElement('div');
        div.className = "glass rounded-2xl p-5 cursor-pointer hover:ring-2 hover:ring-yellow-400";
        div.innerHTML = `<div class="font-bold text-xl">${pl.name}</div><div class="text-sm text-gray-400 mt-1">${pl.songs.length} songs</div>`;
        div.onclick = () => showPlaylistDetail(pl.id);
        container.appendChild(div);
      });
    }

    function deleteSong(id) {
      if (!confirm("Delete song?")) return;
      songs = songs.filter(s => s.id !== id);
      favorites = favorites.filter(s => s.id !== id);
      playlists.forEach(pl => pl.songs = pl.songs.filter(sid => sid !== id));
      recent = recent.filter(s => s.id !== id);
      saveAll();
      if (currentIdx >= songs.length) {
        currentIdx = songs.length - 1;
        if (currentIdx >= 0) playIdx(currentIdx);
        else audio.pause();
      }
    }

    function toggleFavorite(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;
      const idx = favorites.findIndex(f => f.id === id);
      if (idx > -1) favorites.splice(idx, 1);
      else favorites.push(song);
      saveAll();
      renderAllViews();
    }

    function createPlaylist() {
      const name = prompt("Playlist name?");
      if (!name) return;
      playlists.push({id: Date.now(), name, songs: []});
      saveAll();
      renderPlaylists();
    }

    function showPlaylistDetail(id) {
      currentPlId = id;
      const pl = playlists.find(p => p.id === id);
      if (!pl) return;
      alert(`Playlist: ${pl.name}\nSongs: ${pl.songs.length}\n\n(Full modal UI coming in next upgrade)`);
      // Can expand to modal later
    }

    function playIdx(idx) {
      if (idx < 0 || idx >= songs.length) return;
      currentIdx = idx;
      const s = songs[idx];

      audio.src = s.src;
      document.getElementById('cover').src = s.cover;
      document.getElementById('title').textContent = s.title;
      document.getElementById('artist').textContent = s.artist;

      audio.play().then(() => {
        isPlay = true;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
        initViz();
      }).catch(() => alert("Tap play again"));

      // Add to recent
      recent = recent.filter(r => r.id !== s.id);
      recent.unshift(s);
      if (recent.length > 10) recent.pop();
      saveAll();
    }

    function togglePlay() {
      if (currentIdx < 0) return songs.length && playIdx(0);
      if (isPlay) {
        audio.pause();
        isPlay = false;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-play-circle"></i>';
        document.getElementById('player').classList.remove('playing');
      } else {
        audio.play();
        isPlay = true;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }
    }

    function next() {
      let nextIdx = currentIdx + 1;
      if (shuffle) nextIdx = Math.floor(Math.random() * songs.length);
      if (nextIdx >= songs.length) nextIdx = repeat === 2 ? 0 : currentIdx;
      playIdx(nextIdx);
    }

    function prev() {
      let prevIdx = currentIdx - 1;
      if (shuffle) prevIdx = Math.floor(Math.random() * songs.length);
      if (prevIdx < 0) prevIdx = repeat === 2 ? songs.length - 1 : currentIdx;
      playIdx(prevIdx);
    }

    function toggleShuffle() {
      shuffle = !shuffle;
      document.getElementById('shuffle').style.color = shuffle ? '#eab308' : '';
    }

    function toggleRepeat() {
      repeat = (repeat + 1) % 3;
      document.getElementById('repeat').style.color = repeat ? '#eab308' : '';
    }

    function seek(e) {
      const bar = e.currentTarget;
      const pos = e.offsetX / bar.offsetWidth;
      audio.currentTime = pos * audio.duration;
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('prog').style.width = pct + '%';
      document.getElementById('curr').textContent = formatTime(audio.currentTime);
      document.getElementById('total').textContent = formatTime(audio.duration);
    };

    audio.onended = next;

    function formatTime(t) {
      if (!t) return '0:00';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function initViz() {
      if (vizCtx) return;
      const canvas = document.getElementById('viz');
      vizCtx = canvas.getContext('2d');
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audio);
      const anal = ctx.createAnalyser();
      anal.fftSize = 32;
      src.connect(anal);
      anal.connect(ctx.destination);
      const buf = new Uint8Array(anal.frequencyBinCount);

      function draw() {
        requestAnimationFrame(draw);
        anal.getByteFrequencyData(buf);
        vizCtx.clearRect(0,0,canvas.width,canvas.height);
        const w = canvas.width / buf.length;
        for (let i = 0; i < buf.length; i++) {
          const h = (buf[i] / 255) * canvas.height * 0.8;
          vizCtx.fillStyle = '#eab308';
          vizCtx.fillRect(i * w, canvas.height - h, w - 1, h);
        }
      }
      draw();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }

    function setView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(view + '-view').classList.remove('hidden');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
      document.querySelector(`[onclick="setView('${view}')"]`)?.classList.add('nav-active');
      document.getElementById('sidebar').classList.add('-translate-x-full');
    }

    // Init
    renderAllViews();
    document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('vol').oninput = e => audio.volume = e.target.value;

    if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');

    if (songs.length > 0 && currentIdx === -1) playIdx(0);

    console.log("Full Features Loaded – Multiple upload, favorites, playlists, recent, heart like, delete, smooth scroll 🔥");
  </script>
</body>
</html>
