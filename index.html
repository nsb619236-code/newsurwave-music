<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Boss - Premium Music Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* ===== PREMIUM GLASS MORPHISM ===== */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #FFD700;
            -webkit-text-fill-color: #FFD700;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance {
            color: #FFD700;
            font-weight: 600;
            font-size: 18px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* ===== MAIN LAYOUT ===== */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 20px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            color: #94a3b8;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 5px;
        }

        .sidebar-item:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #FFD700;
        }

        .sidebar-item.active {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #0f172a;
            font-weight: 600;
        }

        .sidebar-item i {
            width: 24px;
            font-size: 20px;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(255, 215, 0, 0.2);
            margin: 15px 0;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
            position: relative;
        }

        .hero h1 span {
            color: #FFD700;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
            max-width: 600px;
            position: relative;
        }

        .hero-stats {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            position: relative;
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat h3 {
            font-size: 28px;
            color: #FFD700;
        }

        /* ===== SECTION TITLES ===== */
        .section-title {
            font-size: 28px;
            font-weight: 700;
            margin: 40px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #FFD700;
            font-size: 28px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #FFD700, transparent);
        }

        /* ===== CARDS GRID ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .music-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .music-card:hover {
            transform: translateY(-8px);
            border-color: #FFD700;
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.2);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .play-overlay {
            position: absolute;
            bottom: -50px;
            right: 10px;
            width: 45px;
            height: 45px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .music-card:hover .play-overlay {
            bottom: 10px;
        }

        .play-overlay i {
            color: #0f172a;
            font-size: 20px;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .card-artist {
            color: #94a3b8;
            font-size: 14px;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FFD700;
            color: #0f172a;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-gold, .btn-red {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-gold {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #0f172a;
        }

        .btn-gold:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-red {
            background: #ef4444;
            color: white;
        }

        .btn-red:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        /* ===== RADIO GRID ===== */
        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .radio-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            padding: 25px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            text-align: center;
        }

        .radio-card:hover {
            transform: scale(1.02);
            border-color: #FFD700;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .live-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .radio-card h2 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .radio-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .radio-card p {
            color: #94a3b8;
            font-size: 13px;
        }

        /* ===== UPLOAD SECTION ===== */
        .upload-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
        }

        .upload-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #94a3b8;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #0f172a;
            font-weight: 600;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .upload-area {
            background: rgba(15, 23, 42, 0.8);
            border: 2px dashed rgba(255, 215, 0, 0.5);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.05);
        }

        .upload-area i {
            font-size: 48px;
            color: #FFD700;
            margin-bottom: 15px;
        }

        .file-list {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .remove-file {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }

        /* ===== EARNINGS DASHBOARD ===== */
        .earnings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .earning-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
        }

        .earning-card h3 {
            font-size: 36px;
            color: #FFD700;
            margin-bottom: 5px;
        }

        .progress-container {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            padding: 25px;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 5px;
            margin: 15px 0;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 5px;
            position: relative;
        }

        /* ===== PLAYER BAR ===== */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 2px solid #FFD700;
            padding: 15px 30px;
            display: none;
            z-index: 1000;
        }

        .player-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 250px;
        }

        .player-img {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background-size: cover;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .control-btn:hover {
            background: #FFD700;
            color: #0f172a;
        }

        .play-btn-large {
            width: 55px;
            height: 55px;
            background: #FFD700;
        }

        .play-btn-large i {
            color: #0f172a;
            font-size: 24px;
        }

        .player-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 400px;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid #FFD700;
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
        }

        .modal-content h2 {
            color: #FFD700;
            margin-bottom: 25px;
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
        }

        button {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #0f172a;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .sec-btn {
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #0f172a;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: none;
            z-index: 3000;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-content">
        <div class="logo">
            <i class="fas fa-crown"></i> MUSIC BOSS
        </div>
        <div class="user-menu">
            <span class="balance" id="balanceDisplay">$0.00</span>
            <div class="avatar" id="userAvatar" onclick="showAuth()">G</div>
        </div>
    </div>
</div>

<!-- MAIN CONTAINER -->
<div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-item active" onclick="showPage('home')">
            <i class="fas fa-home"></i> Home
        </div>
        <div class="sidebar-item" onclick="showPage('search')">
            <i class="fas fa-search"></i> Search
        </div>
        <div class="sidebar-item" onclick="showPage('library')">
            <i class="fas fa-books"></i> Your
