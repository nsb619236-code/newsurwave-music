<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss - Working Version</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#000;color:#fff;padding:15px;padding-bottom:100px;}
.header{background:#1DB954;padding:20px;border-radius:15px;text-align:center;margin-bottom:15px;}
.header h1{font-size:32px;}
.nav{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
.nav-btn{background:#1DB954;color:#000;border:none;padding:12px;border-radius:25px;font-weight:bold;cursor:pointer;flex:1;}
.nav-btn.sec{background:#333;color:#fff;}
.user{background:#121212;padding:12px;border-radius:30px;margin-bottom:15px;display:flex;justify-content:space-between;}
.avatar{width:35px;height:35px;background:#1DB954;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;}
.section-title{font-size:20px;margin:20px 0 10px;color:#1DB954;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.music-card{background:#181818;padding:12px;border-radius:10px;cursor:pointer;}
.music-card:hover{background:#282828;}
.card-img{width:100%;aspect-ratio:1;background:#1DB954;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:30px;}
.card-title{font-size:14px;font-weight:bold;}
.card-artist{font-size:12px;color:#b3b3b3;}
.radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
.radio-card{background:linear-gradient(135deg,#1DB954,#0f8f3f);padding:15px;border-radius:10px;cursor:pointer;position:relative;}
.live-badge{position:absolute;top:5px;right:5px;background:red;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px;}
.earnings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.earning-card{background:#1DB954;padding:15px;border-radius:10px;text-align:center;color:#000;}
.earning-card h3{font-size:24px;}
.upload-box{background:#181818;border:2px dashed #1DB954;border-radius:10px;padding:20px;text-align:center;margin:10px 0;cursor:pointer;}
input,select{width:100%;padding:12px;margin:5px 0;background:#181818;border:1px solid #333;border-radius:25px;color:#fff;}
button{background:#1DB954;color:#000;border:none;padding:12px;border-radius:25px;font-weight:bold;cursor:pointer;width:100%;margin:5px 0;}
button.sec{background:#333;color:#fff;}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:#181818;padding:12px;border-top:2px solid #1DB954;display:none;}
.player-info{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.player-img{width:45px;height:45px;background:#1DB954;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:20px;}
.player-controls i{font-size:24px;color:#b3b3b3;cursor:pointer;}
.player-controls .fa-play-circle{color:#1DB954;font-size:32px;}
.progress-bar{width:100%;height:4px;background:#333;border-radius:2px;margin:5px 0;cursor:pointer;}
.progress{width:0%;height:100%;background:#1DB954;border-radius:2px;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:#121212;padding:25px;border-radius:20px;width:90%;max-width:350px;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1DB954;color:#000;padding:10px 20px;border-radius:50px;display:none;z-index:2000;}
.delete-btn{background:#ff4444;color:#fff;border:none;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;margin-top:5px;}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="header">
<h1>🎵 MUSIC BOSS</h1>
<p>Upload • Radio • Earn</p>
</div>

<div class="nav">
<button class="nav-btn" onclick="showHome()">Home</button>
<button class="nav-btn sec" onclick="showUpload()">Upload</button>
<button class="nav-btn sec" onclick="showRadio()">Radio</button>
<button class="nav-btn sec" onclick="showEarnings()">Earnings</button>
<button class="nav-btn sec" onclick="showLibrary()">Library</button>
</div>

<div class="user" id="userInfo">
<span id="userName">Guest User</span>
<div class="avatar" id="userAvatar" onclick="showAuth()">G</div>
</div>

<div id="mainContent"></div>

<div class="player-bar" id="playerBar">
<div class="player-info">
<div class="player-img" id="playerImg">🎵</div>
<div>
<h4 id="playerTitle">Not Playing</h4>
<p style="color:#b3b3b3;" id="playerArtist">-</p>
</div>
</div>
<div class="progress-bar" onclick="seekTo(event)">
<div class="progress" id="progress"></div>
</div>
<div class="player-controls">
<i class="fas fa-step-backward" onclick="prevSong()"></i>
<i class="fas fa-play-circle" id="playBtn" onclick="playPause()"></i>
<i class="fas fa-step-forward" onclick="nextSong()"></i>
</div>
</div>

<div class="modal" id="authModal">
<div class="modal-content">
<h2 id="authTitle">Login</h2>
<input type="email" id="email" placeholder="Email" value="demo@music.com">
<input type="password" id="password" placeholder="Password" value="123456">
<button onclick="handleAuth()" id="authBtn">Login</button>
<button class="sec" onclick="toggleAuth()" id="toggleAuth">Create Account</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let user=null;
let songs=[];
let current=null;
let playing=false;
let audio=new Audio();
let radio=null;
let radioInterval=null;
let earnings=0;
let plays=0;

const radios=[
{id:1,name:'Bollywood Hits',country:'India',listeners:'2.5M',emoji:'🇮🇳'},
{id:2,name:'English Pop',country:'USA',listeners:'5M',emoji:'🇺🇸'},
{id:3,name:'Punjabi Beats',country:'India',listeners:'1.8M',emoji:'🇮🇳'},
{id:4,name:'K-Pop',country:'Korea',listeners:'3.2M',emoji:'🇰🇷'},
{id:5,name:'Latin Hits',country:'Spain',listeners:'4M',emoji:'🇪🇸'}
];

const demoSongs=[
{id:1,title:'Blinding Lights',artist:'The Weeknd',emoji:'🎤',plays:1.2},
{id:2,title:'Levitating',artist:'Dua Lipa',emoji:'✨',plays:0.8},
{id:3,title:'Peaches',artist:'Justin Bieber',emoji:'🍑',plays:0.6},
{id:4,title:'Stay',artist:'Kid Laroi',emoji:'⭐',plays:0.9}
];

document.addEventListener('DOMContentLoaded',()=>{
loadData();
checkUser();
showHome();
});

function loadData(){
let saved=JSON.parse(localStorage.getItem('songs')||'[]');
songs=[...demoSongs,...saved];
}

function checkUser(){
let saved=localStorage.getItem('user');
if(saved){
let users=JSON.parse(localStorage.getItem('users')||'[]');
user=users.find(u=>u.email===saved);
if(user){
document.getElementById('userName').innerText=user.name||user.email;
document.getElementById('userAvatar').innerText=(user.name||user.email)[0].toUpperCase();
loadEarnings();
}
}
}

function showAuth(){
document.getElementById('authModal').classList.add('active');
}

function toggleAuth(){
let t=document.getElementById('authTitle');
let b=document.getElementById('authBtn');
let tg=document.getElementById('toggleAuth');
if(t.innerText==='Login'){
t.innerText='Sign Up';
b.innerText='Sign Up';
tg.innerText='Back to Login';
}else{
t.innerText='Login';
b.innerText='Login';
tg.innerText='Create Account';
}
}

function handleAuth(){
let email=document.getElementById('email').value;
let pass=document.getElementById('password').value;
let title=document.getElementById('authTitle').innerText;
if(!email||!pass){toast('Fill all fields');return;}
let users=JSON.parse(localStorage.getItem('users')||'[]');
if(title==='Sign Up'){
if(users.find(u=>u.email===email)){toast('User exists');return;}
let newUser={email:email,pass:pass,name:email.split('@')[0]};
users.push(newUser);
localStorage.setItem('users',JSON.stringify(users));
user=newUser;
localStorage.setItem('user',email);
toast('Account created!');
}else{
let u=users.find(u=>u.email===email&&u.pass===pass);
if(u){
user=u;
localStorage.setItem('user',email);
toast('Login success!');
}else{toast('Wrong credentials');return;}
}
document.getElementById('authModal').classList.remove('active');
document.getElementById('userName').innerText=user.name||user.email;
document.getElementById('userAvatar').innerText=(user.name||user.email)[0].toUpperCase();
loadEarnings();
showHome();
}

function showHome(){
let html=`
<div class="section-title">🔥 Trending</div>
<div class="card-grid" id="trendingGrid"></div>
<div class="section-title">📻 Live Radio</div>
<div class="radio-grid" id="radioGrid"></div>
<div class="section-title">💰 Earnings</div>
<div class="earnings-grid" id="earningsGrid"></div>
`;
document.getElementById('mainContent').innerHTML=html;
let t='';
demoSongs.slice(0,3).forEach(s=>{t+=card(s);});
document.getElementById('trendingGrid').innerHTML=t;
let r='';
radios.slice(0,3).forEach(s=>{r+=`<div class="radio-card" onclick="playRadio(${s.id})"><span class="live-badge">LIVE</span><h2>${s.emoji}</h2><h3>${s.name}</h3><p>${s.country}</p></div>`;});
document.getElementById('radioGrid').innerHTML=r;
updateEarnings();
}

function card(s){
return `<div class="music-card" onclick="playSong(${s.id})"><div class="card-img">${s.emoji||'🎵'}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div></div>`;
}

function showUpload(){
if(!user){toast('Login first');showAuth();return;}
let html=`
<div style="background:#121212;padding:20px;border-radius:15px;margin:15px 0;">
<h2 style="color:#1DB954;">📤 Upload Song</h2>
<input type="file" id="audio" accept="audio/*" style="display:none;" onchange="updateAudio()">
<div class="upload-box" onclick="document.getElementById('audio').click()">
<i class="fas fa-music"></i>
<h3>Select Audio</h3>
<p id="audioName">MP3, WAV</p>
</div>
<input type="text" id="title" placeholder="Song Title">
<input type="text" id="artist" placeholder="Artist Name">
<button onclick="uploadSong()">Upload Now</button>
</div>
<div class="section-title">Your Uploads</div>
<div class="card-grid" id="userGrid"></div>
`;
document.getElementById('mainContent').innerHTML=html;
showUserUploads();
}

function updateAudio(){
let f=document.getElementById('audio').files[0];
document.getElementById('audioName').innerText=f?'✅ '+f.name:'MP3, WAV';
}

function uploadSong(){
let f=document.getElementById('audio').files[0];
let t=document.getElementById('title').value;
let a=document.getElementById('artist').value;
if(!f){toast('Select audio');return;}
if(!t||!a){toast('Enter title & artist');return;}
let n={id:Date.now(),title:t,artist:a,emoji:'🎵',url:URL.createObjectURL(f),uploadedBy:user.email,plays:0};
let up=JSON.parse(localStorage.getItem('songs')||'[]');
up.push(n);
localStorage.setItem('songs',JSON.stringify(up));
songs.push(n);
toast('✅ Uploaded!');
showUpload();
}

function showUserUploads(){
let up=JSON.parse(localStorage.getItem('songs')||'[]');
let us=up.filter(s=>s.uploadedBy===user?.email);
let h='';
us.forEach(s=>{h+=`<div class="music-card"><div class="card-img">${s.emoji||'🎵'}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div><button class="delete-btn" onclick="deleteSong(${s.id})">Delete</button></div>`;});
document.getElementById('userGrid').innerHTML=h||'<p>No uploads</p>';
}

function deleteSong(id){
if(!confirm('Delete?'))return;
let up=JSON.parse(localStorage.getItem('songs')||'[]');
up=up.filter(s=>s.id!==id);
localStorage.setItem('songs',JSON.stringify(up));
songs=songs.filter(s=>s.id!==id);
toast('Deleted');
showUpload();
}

function showRadio(){
let html='<div class="section-title">📻 All Stations</div><div class="radio-grid" id="allRadio"></div>';
document.getElementById('mainContent').innerHTML=html;
let r='';
radios.forEach(s=>{r+=`<div class="radio-card" onclick="playRadio(${s.id})"><span class="live-badge">LIVE</span><h2 style="font-size:40px;">${s.emoji}</h2><h3>${s.name}</h3><p>${s.country}</p></div>`;});
document.getElementById('allRadio').innerHTML=r;
}

function playRadio(id){
let s=radios.find(r=>r.id===id);
if(!s)return;
if(radio){clearInterval(radioInterval);}
radio=s;
document.getElementById('playerBar').style.display='block';
document.getElementById('playerTitle').innerText=s.name;
document.getElementById('playerArtist').innerText=s.country+' • Live';
document.getElementById('playerImg').innerHTML=s.emoji;
document.getElementById('playBtn').className='fas fa-pause-circle';
playing=true;
let p=0;
radioInterval=setInterval(()=>{p=(p+0.1)%100;document.getElementById('progress').style.width=p+'%';},1000);
toast('📻 '+s.name);
}

function stopRadio(){
if(radio){clearInterval(radioInterval);radio=null;playing=false;document.getElementById('playBtn').className='fas fa-play-circle';}
}

function showEarnings(){
if(!user){toast('Login first');showAuth();return;}
loadEarnings();
let up=JSON.parse(localStorage.getItem('songs')||'[]');
let us=up.filter(s=>s.uploadedBy===user.email);
let html=`
<div class="earnings-grid">
<div class="earning-card"><h3>$${earnings.toFixed(2)}</h3><p>Total</p></div>
<div class="earning-card"><h3>${plays}</h3><p>Plays</p></div>
<div class="earning-card"><h3>${us.length}</h3><p>Songs</p></div>
</div>
<div class="section-title">Your Songs</div>
<div class="card-grid" id="earnGrid"></div>
`;
document.getElementById('mainContent').innerHTML=html;
let h='';
us.forEach(s=>{let p=Math.floor(Math.random()*100);h+=`<div class="music-card"><div class="card-img">${s.emoji||'🎵'}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div><p style="color:#1DB954;">$${(p*0.01).toFixed(2)}</p></div>`;});
document.getElementById('earnGrid').innerHTML=h||'<p>No songs</p>';
}

function showLibrary(){
if(!user){toast('Login first');showAuth();return;}
let up=JSON.parse(localStorage.getItem('songs')||'[]');
let us=up.filter(s=>s.uploadedBy===user.email);
let html=`<div class="section-title">📚 Your Library</div><div class="card-grid" id="libGrid"></div>`;
document.getElementById('mainContent').innerHTML=html;
let h='';
us.forEach(s=>{h+=`<div class="music-card" onclick="playSong(${s.id})"><div class="card-img">${s.emoji||'🎵'}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div></div>`;});
document.getElementById('libGrid').innerHTML=h||'<p>Empty library</p>';
}

function playSong(id){
if(radio)stopRadio();
let s=songs.find(s=>s.id===id);
if(!s)return;
current=s;
document.getElementById('playerBar').style.display='block';
document.getElementById('playerTitle').innerText=s.title;
document.getElementById('playerArtist').innerText=s.artist;
document.getElementById('playerImg').innerHTML=s.emoji||'🎵';
if(s.url){
audio.src=s.url;
audio.play();
playing=true;
document.getElementById('playBtn').className='fas fa-pause-circle';
if(s.uploadedBy===user?.email){plays++;earnings+=0.01;localStorage.setItem('earnings_'+user.email,JSON.stringify({plays,earnings}));}
}else{
playing=true;
document.getElementById('playBtn').className='fas fa-pause-circle';
let p=0;
let i=setInterval(()=>{if(!playing||radio){clearInterval(i);return;}p+=0.5;if(p<=100){document.getElementById('progress').style.width=p+'%';}else{clearInterval(i);nextSong();}},1000);
}
toast('▶️ '+s.title);
}

function playPause(){
if(radio){
if(playing){
clearInterval(radioInterval);
document.getElementById('playBtn').className='fas fa-play-circle';
}else{playRadio(radio.id);}
playing=!playing;
return;
}
if(!current){if(songs.length>0)playSong(songs[0].id);return;}
if(playing){
audio.pause();
document.getElementById('playBtn').className='fas fa-play-circle';
}else{
audio.play();
document.getElementById('playBtn').className='fas fa-pause-circle';
}
playing=!playing;
}

function nextSong(){
if(radio)return;
if(!current||songs.length===0)return;
let i=songs.findIndex(s=>s.id===current.id);
let n=(i+1)%songs.length;
playSong(songs[n].id);
}

function prevSong(){
if(radio)return;
if(!current||songs.length===0)return;
let i=songs.findIndex(s=>s.id===current.id);
let p=(i-1+songs.length)%songs.length;
playSong(songs[p].id);
}

function seekTo(e){
if(!audio.duration||radio)return;
let bar=e.currentTarget;
let pos=(e.clientX-bar.getBoundingClientRect().left)/bar.offsetWidth;
audio.currentTime=pos*audio.duration;
}

audio.ontimeupdate=function(){
if(audio.duration&&!radio){
let p=(audio.currentTime/audio.duration)*100;
document.getElementById('progress').style.width=p+'%';
}
};

function loadEarnings(){
let d=JSON.parse(localStorage.getItem('earnings_'+user?.email)||'{"plays":0,"earnings":0}');
plays=d.plays;
earnings=d.earnings;
}

function updateEarnings(){
if(!user){document.getElementById('earningsGrid').innerHTML='<div class="earning-card"><h3>Login</h3><p>to earn</p></div>';return;}
loadEarnings();
document.getElementById('earningsGrid').innerHTML=`<div class="earning-card"><h3>$${earnings.toFixed(2)}</h3><p>Earnings</p></div><div class="earning-card"><h3>${plays}</h3><p>Plays</p></div>`;
}

function toast(m){
let t=document.getElementById('toast');
t.style.display='block';
t.innerText=m;
setTimeout(()=>{t.style.display='none';},2000);
}
</script>
</body>
</html>
