<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Boss - Premium Music Streaming</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #e43d3d;
            --primary-dark: #c92a2a;
            --dark: #0a0c0f;
            --dark-light: #1a1e26;
            --text: #ffffff;
            --text-gray: #a0a8c0;
            --success: #28a745;
            --warning: #ffc107;
        }

        body {
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-light); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* Navbar */
        .navbar {
            background: rgba(10, 12, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--primary);
            -webkit-text-fill-color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .search-box {
            background: var(--dark-light);
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 250px;
        }

        .search-box i {
            color: var(--text-gray);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Upload Button */
        .upload-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            margin-left: 1rem;
        }

        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(228, 61, 61, 0.4);
        }

        /* Main Container */
        .container {
            display: flex;
            height: calc(100vh - 80px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.3);
            padding: 2rem 1rem;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-title {
            color: var(--text-gray);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            padding-left: 1rem;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0.8rem 1rem;
            color: var(--text-gray);
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            cursor: pointer;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: var(--primary);
            color: white;
        }

        .sidebar-item i {
            width: 20px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary), #6b2b2b);
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            max-width: 500px;
        }

        .hero-btn {
            background: white;
            color: var(--primary);
            border: none;
            padding: 1rem 2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .hero-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Upload Section */
        .upload-section {
            background: var(--dark-light);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 2px dashed var(--primary);
            display: none;
        }

        .upload-section.active {
            display: block;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(228, 61, 61, 0.1);
        }

        .upload-area i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .upload-area h3 {
            margin-bottom: 0.5rem;
        }

        .upload-area p {
            color: var(--text-gray);
        }

        .upload-form {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .upload-form input,
        .upload-form select {
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1rem;
            color: white;
            outline: none;
        }

        .upload-form input:focus,
        .upload-form select:focus {
            border-color: var(--primary);
        }

        .upload-form button {
            grid-column: span 2;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-form button:hover {
            background: var(--primary-dark);
        }

        /* My Uploads Section */
        .my-uploads-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .my-uploads-header h2 {
            font-size: 1.8rem;
        }

        .upload-count {
            background: var(--primary);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-size: 1.8rem;
        }

        .view-all {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
        }

        /* Cards Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .music-card {
            background: var(--dark-light);
            border-radius: 12px;
            padding: 1rem;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .music-card:hover {
            background: #2a2f3a;
            transform: translateY(-5px);
        }

        .music-card.uploaded {
            border: 2px solid var(--primary);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #3a3f4b, #1a1e26);
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-size: 3rem;
        }

        .play-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            cursor: pointer;
        }

        .music-card:hover .play-btn {
            opacity: 1;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .card-artist {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .upload-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(220, 53, 69, 0.9);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
            z-index: 10;
        }

        .music-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #dc3545;
            transform: scale(1.1);
        }

        /* Player Bar */
        .player-bar {
            background: var(--dark-light);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 2rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 300px;
        }

        .now-playing-img {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #8b3d3d);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .now-playing-info h4 {
            margin-bottom: 0.2rem;
        }

        .now-playing-info p {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            max-width: 600px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .control-buttons i {
            font-size: 1.2rem;
            color: var(--text-gray);
            cursor: pointer;
            transition: 0.3s;
        }

        .control-buttons i:hover {
            color: var(--primary);
        }

        .control-buttons .fa-play-circle {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            position: relative;
            transition: width 0.1s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 200px;
        }

        .volume-slider {
            width: 100px;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            cursor: pointer;
        }

        .volume-level {
            width: 70%;
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--dark-light);
            padding: 2rem;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .modal-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .modal-footer {
            text-align: center;
            margin-top: 1rem;
            color: var(--text-gray);
        }

        .modal-footer span {
            color: var(--primary);
            cursor: pointer;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            display: none;
            z-index: 3000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 80px;
            }
            .sidebar-item span {
                display: none;
            }
            .sidebar-item i {
                margin: 0 auto;
            }
        }
    </style>
</head>
