<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Music Hut Beat • Multi Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
    .glass { background: rgba(30,41,59,0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.09); }
    .card { transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    .card:hover { transform: translateY(-10px) scale(1.04); box-shadow: 0 25px 50px -12px rgba(234,179,8,0.35); }
    .playing .album { animation: spin 24s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .progress { height: 5px; background: linear-gradient(to right, #eab308 var(--progress,0%), #4b5563 var(--progress,0%)); }
    .nav-active { color: #eab308; border-left: 4px solid #eab308; background: rgba(234,179,8,0.12); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="fixed top-0 w-full glass z-50 h-16 flex items-center px-4 md:px-8 justify-between">
    <div class="flex items-center gap-3">
      <button id="menu-btn" class="lg:hidden text-2xl"><i class="fas fa-bars"></i></button>
      <span class="text-2xl font-bold tracking-tighter text-yellow-400">Music Hut Beat</span>
    </div>
    <div class="flex items-center gap-4 md:gap-6">
      <button onclick="toggleTheme()" class="text-xl"><i class="fas fa-moon"></i></button>
      <button onclick="document.getElementById('upload-multi').click()" class="bg-gradient-to-r from-yellow-500 to-amber-500 text-black px-5 py-2.5 rounded-full font-medium flex items-center gap-2 shadow-md">
        <i class="fas fa-cloud-upload-alt"></i> <span class="hidden md:inline">Upload Songs</span>
      </button>
      <input type="file" id="upload-multi" accept="audio/*" multiple class="hidden" onchange="addMultipleSongs(event)">
    </div>
  </header>

  <div class="flex flex-1 pt-16">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 glass border-r border-white/10 h-[calc(100vh-4rem)] overflow-y-auto fixed lg:static z-40 -translate-x-full lg:translate-x-0 transition-transform">
      <div class="p-4 space-y-2">
        <div onclick="setView('discover')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer nav-active">
          <i class="fas fa-compass"></i> Discover
        </div>
        <div onclick="setView('library')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
          <i class="fas fa-music"></i> Library
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto pb-32 px-4 md:px-8">
      <div id="library-view" class="view">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 my-8">
          <h1 class="text-4xl md:text-5xl font-bold">Your Library</h1>
          <input id="search-lib" onkeyup="filterLibrary()" placeholder="Search songs..." class="w-full md:w-72 bg-white/10 px-4 py-2.5 rounded-full border border-white/20 focus:border-yellow-400 outline-none">
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-6" id="library-songs"></div>
      </div>
    </main>
  </div>

  <!-- Player -->
  <footer id="player" class="fixed bottom-0 w-full glass h-20 md:h-24 flex items-center px-4 md:px-8 z-50 border-t border-white/10">
    <div class="flex items-center gap-3 md:gap-4 w-48 md:w-64 flex-shrink-0">
      <div class="album w-12 h-12 md:w-14 md:h-14 rounded-xl overflow-hidden shadow-lg">
        <img id="cover" src="https://picsum.photos/200?random=1" class="w-full h-full object-cover">
      </div>
      <div class="min-w-0 flex-1">
        <div id="title" class="font-medium truncate text-sm md:text-base">No song selected</div>
        <div id="artist" class="text-xs text-gray-400 truncate">Upload songs to start</div>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center gap-1 md:gap-2 mx-4 md:mx-8">
      <div class="flex items-center gap-4 md:gap-8 text-xl md:text-2xl text-gray-300">
        <button id="shuffle" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
        <button onclick="prev()"><i class="fas fa-backward-step"></i></button>
        <button id="playpause" onclick="togglePlay()" class="text-yellow-400 text-4xl md:text-5xl"><i class="fas fa-play-circle"></i></button>
        <button onclick="next()"><i class="fas fa-forward-step"></i></button>
        <button id="repeat" onclick="toggleRepeat()"><i class="fas fa-redo"></i></button>
      </div>
      <div class="w-full flex items-center gap-2 text-xs text-gray-400">
        <span id="curr">0:00</span>
        <div class="flex-1 h-1.5 bg-gray-700 rounded-full cursor-pointer" onclick="seek(event)">
          <div id="prog" class="h-full w-0 bg-yellow-400 rounded-full transition-all duration-150"></div>
        </div>
        <span id="total">0:00</span>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-4">
      <canvas id="viz" width="100" height="32" class="opacity-80"></canvas>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" class="w-24 accent-yellow-400">
    </div>
  </footer>

  <audio id="audio"></audio>

  <script>
    let songs = JSON.parse(localStorage.getItem('mhb_songs')) || [];
    let currentIdx = -1;
    let isPlay = false;
    let shuffle = false;
    let repeat = 0; // 0 off, 1 one, 2 all
    const audio = document.getElementById('audio');
    let vizCtx;

    function save() { localStorage.setItem('mhb_songs', JSON.stringify(songs)); renderLibrary(); }

    function addMultipleSongs(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      let added = 0;
      files.forEach(file => {
        if (!file.type.startsWith('audio/')) return;
        
        const url = URL.createObjectURL(file);
        const song = {
          id: Date.now() + added,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "You",
          src: url,
          cover: `https://picsum.photos/seed/${Date.now()+added}/300`
        };
        songs.unshift(song);
        added++;
      });

      if (added > 0) {
        save();
        alert(`${added} song(s) added successfully!`);
        if (currentIdx === -1 && songs.length > 0) playIdx(0);
      } else {
        alert("No valid audio files selected.");
      }
    }

    function renderLibrary() {
      const grid = document.getElementById('library-songs');
      grid.innerHTML = songs.length ? '' : '<p class="col-span-full text-center py-16 text-gray-400 text-xl">No songs yet — upload multiple MP3s!</p>';

      const searchTerm = document.getElementById('search-lib').value.toLowerCase();
      const filtered = songs.filter(s => 
        s.title.toLowerCase().includes(searchTerm) || s.artist.toLowerCase().includes(searchTerm)
      );

      filtered.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'card glass rounded-2xl overflow-hidden cursor-pointer relative group';
        card.innerHTML = `
          <img src="${s.cover}" class="w-full aspect-square object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition flex flex-col justify-end p-4">
            <div class="font-medium truncate">${s.title}</div>
            <div class="text-xs text-gray-300">${s.artist}</div>
          </div>
          <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition">
            <button onclick="event.stopPropagation(); deleteSong(${s.id})" class="bg-red-500/80 hover:bg-red-600 text-white p-2 rounded-full">
              <i class="fas fa-trash text-sm"></i>
            </button>
          </div>
          <button onclick="event.stopPropagation(); playIdx(${songs.indexOf(s)})" class="absolute bottom-4 right-4 w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg">
            <i class="fas fa-play text-black ml-0.5"></i>
          </button>
        `;
        card.onclick = () => playIdx(songs.indexOf(s));
        grid.appendChild(card);
      });
    }

    function deleteSong(id) {
      if (!confirm("Delete this song?")) return;
      songs = songs.filter(s => s.id !== id);
      save();
      if (currentIdx >= songs.length) {
        currentIdx = songs.length - 1;
        if (currentIdx >= 0) playIdx(currentIdx);
        else audio.pause();
      }
    }

    function filterLibrary() { renderLibrary(); }

    function playIdx(idx) {
      if (idx < 0 || idx >= songs.length) return;
      currentIdx = idx;
      const s = songs[idx];

      audio.src = s.src;
      document.getElementById('cover').src = s.cover;
      document.getElementById('title').textContent = s.title;
      document.getElementById('artist').textContent = s.artist;

      audio.play().then(() => {
        isPlay = true;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
        initViz();
      }).catch(() => alert("Tap play again"));
    }

    function togglePlay() {
      if (currentIdx < 0) return songs.length && playIdx(0);
      if (isPlay) {
        audio.pause();
        isPlay = false;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-play-circle"></i>';
        document.getElementById('player').classList.remove('playing');
      } else {
        audio.play();
        isPlay = true;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }
    }

    function next() {
      let nextIdx = currentIdx + 1;
      if (shuffle) nextIdx = Math.floor(Math.random() * songs.length);
      if (nextIdx >= songs.length) nextIdx = repeat === 2 ? 0 : currentIdx;
      playIdx(nextIdx);
    }

    function prev() {
      let prevIdx = currentIdx - 1;
      if (shuffle) prevIdx = Math.floor(Math.random() * songs.length);
      if (prevIdx < 0) prevIdx = repeat === 2 ? songs.length - 1 : currentIdx;
      playIdx(prevIdx);
    }

    function toggleShuffle() {
      shuffle = !shuffle;
      document.getElementById('shuffle').style.color = shuffle ? '#eab308' : '';
    }

    function toggleRepeat() {
      repeat = (repeat + 1) % 3;
      document.getElementById('repeat').style.color = repeat ? '#eab308' : '';
    }

    function seek(e) {
      const bar = e.currentTarget;
      const pos = e.offsetX / bar.offsetWidth;
      audio.currentTime = pos * audio.duration;
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('prog').style.width = pct + '%';
      document.getElementById('curr').textContent = formatTime(audio.currentTime);
      document.getElementById('total').textContent = formatTime(audio.duration);
    };

    audio.onended = next;

    function formatTime(t) {
      if (!t) return '0:00';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function initViz() {
      if (vizCtx) return;
      const canvas = document.getElementById('viz');
      vizCtx = canvas.getContext('2d');
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audio);
      const anal = ctx.createAnalyser();
      anal.fftSize = 32;
      src.connect(anal);
      anal.connect(ctx.destination);
      const buf = new Uint8Array(anal.frequencyBinCount);

      function draw() {
        requestAnimationFrame(draw);
        anal.getByteFrequencyData(buf);
        vizCtx.clearRect(0,0,canvas.width,canvas.height);
        const w = canvas.width / buf.length;
        for (let i = 0; i < buf.length; i++) {
          const h = (buf[i] / 255) * canvas.height * 0.8;
          vizCtx.fillStyle = '#eab308';
          vizCtx.fillRect(i * w, canvas.height - h, w - 1, h);
        }
      }
      draw();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }

    function setView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(view + '-view').classList.remove('hidden');
      document.getElementById('sidebar').classList.add('-translate-x-full');
    }

    // Init
    renderLibrary();
    document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('vol').oninput = e => audio.volume = e.target.value;

    if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');

    if (songs.length > 0 && currentIdx === -1) playIdx(0);

    console.log("Modern Multi-Upload Music Hut Beat Ready! Ek saath kitne bhi gaane daal sakte ho 🎶");
  </script>
</body>
</html>
