<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss</title>
<style>
body{background:#0A1F0A;color:white;font-family:Arial;padding:20px;text-align:center;}
.gold{color:#FFD700;}
button{background:#1DB954;color:black;border:none;padding:15px;margin:5px;border-radius:25px;font-size:16px;cursor:pointer;width:200px;}
.card{background:#143814;border:1px solid #2A5A2A;border-radius:15px;padding:20px;margin:20px auto;width:90%;max-width:400px;}
input{background:#0A1F0A;border:1px solid #1DB954;color:white;padding:12px;margin:5px;border-radius:25px;width:90%;}
</style>
</head>
<body>

<h1 class="gold">👑 MUSIC BOSS</h1>
<p>गाने सुनो • पैसे कमाओ</p>

<button onclick="showHome()">Home</button>
<button onclick="showUpload()">Upload</button>
<button onclick="showRadio()">Radio</button>
<button onclick="showEarnings()">Earnings</button>

<div id="content"></div>

<script>
let user = localStorage.getItem('user') || null;
let songs = JSON.parse(localStorage.getItem('songs') || '[]');
let earnings = parseFloat(localStorage.getItem('earnings') || '0');
let plays = parseInt(localStorage.getItem('plays') || '0');

if(songs.length === 0){
songs = [
{id:1, title:'Blinding Lights', artist:'The Weeknd', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{id:2, title:'Levitating', artist:'Dua Lipa', url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
];
localStorage.setItem('songs', JSON.stringify(songs));
}

function showHome(){
let html = '<h2 class="gold">🔥 Songs</h2>';
songs.forEach(s => {
html += `<div class="card">
<h3>${s.title}</h3>
<p>${s.artist}</p>
<button onclick="playSong(${s.id})">▶️ Play</button>
<button onclick="deleteSong(${s.id})" style="background:#DC143C;color:white;">🗑️ Delete</button>
</div>`;
});
document.getElementById('content').innerHTML = html;
}

function playSong(id){
let song = songs.find(s => s.id === id);
let audio = new Audio(song.url);
audio.play();
if(song.user){
plays++;
earnings += 0.45;
localStorage.setItem('plays', plays);
localStorage.setItem('earnings', earnings);
}
alert('🎵 Playing: '+song.title);
}

function deleteSong(id){
if(confirm('Delete?')){
songs = songs.filter(s => s.id !== id);
localStorage.setItem('songs', JSON.stringify(songs));
showHome();
}
}

function showUpload(){
if(!user){
user = prompt('Enter name for login:') || 'Guest';
localStorage.setItem('user', user);
}
let html = `
<h2 class="gold">📤 Upload Song</h2>
<div class="card">
<input type="file" id="audio" accept="audio/*">
<input type="text" id="title" placeholder="Song Title">
<input type="text" id="artist" placeholder="Artist">
<button onclick="uploadSong()">Upload</button>
</div>
<h2 class="gold">Your Uploads</h2>
<div id="uploads"></div>
`;
document.getElementById('content').innerHTML = html;
showUploads();
}

function uploadSong(){
let file = document.getElementById('audio').files[0];
let title = document.getElementById('title').value;
let artist = document.getElementById('artist').value;
if(!file || !title || !artist){alert('Fill all');return;}
let url = URL.createObjectURL(file);
let newSong = {id:Date.now(), title, artist, url, user};
songs.push(newSong);
localStorage.setItem('songs', JSON.stringify(songs));
alert('Uploaded!');
showUpload();
}

function showUploads(){
let userSongs = songs.filter(s => s.user === user);
let html = '';
userSongs.forEach(s => {
html += `<div class="card"><h3>${s.title}</h3><p>${s.artist}</p></div>`;
});
document.getElementById('uploads').innerHTML = html || '<p>No uploads</p>';
}

function showRadio(){
let html = '<h2 class="gold">📻 Radio</h2>';
let stations = ['Bollywood', 'English', 'Punjabi', 'K-Pop'];
stations.forEach(s => {
html += `<div class="card" onclick="playRadio('${s}')">
<h3>${s} Radio</h3>
<p>🔴 LIVE</p>
</div>`;
});
document.getElementById('content').innerHTML = html;
}

function playRadio(name){
alert('📻 Playing '+name+' Radio');
}

function showEarnings(){
if(!user){alert('Login first');return;}
let progress = (plays/500)*100;
let html = `
<h2 class="gold">💰 Earnings</h2>
<div class="card">
<h3>Total: $${earnings.toFixed(2)}</h3>
<p>Plays: ${plays}</p>
<p>500 Hours: ${progress.toFixed(1)}%</p>
<div style="background:#333;height:10px;border-radius:5px;">
<div style="width:${progress}%;height:100%;background:#FFD700;border-radius:5px;"></div>
</div>
</div>
`;
document.getElementById('content').innerHTML = html;
}

showHome();
</script>
</body>
</html>
