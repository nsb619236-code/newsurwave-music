<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Boss - Premium Dark Green</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{
background:#0A0F0C;  /* Dark green-black background */
color:#fff;
padding:15px;
padding-bottom:100px;
}

/* Premium Dark Green Theme */
:root{
--primary:#00DC82;  /* Bright neon green */
--primary-dark:#00A85A;
--primary-light:#4AE8A0;
--bg-dark:#0A1F14;  /* Dark green */
--bg-card:#0E2A1A;  /* Card background */
--bg-hover:#143E24;  /* Hover state */
--text-light:#E8F3EC;
--text-muted:#9BB8A8;
}

.header{
background:linear-gradient(135deg,#00DC82,#006B42);
padding:30px 20px;
border-radius:24px;
text-align:center;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,220,130,0.3);
position:relative;
overflow:hidden;
}
.header::before{
content:'';
position:absolute;
top:-50%;
right:-50%;
width:200%;
height:200%;
background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);
animation:rotate 20s linear infinite;
}
@keyframes rotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.header h1{font-size:42px;font-weight:800;position:relative;}
.header p{font-size:16px;opacity:0.9;position:relative;}

.nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.nav-btn{
background:var(--bg-card);
color:var(--text-light);
border:1px solid rgba(0,220,130,0.3);
padding:12px 20px;
border-radius:40px;
font-weight:600;
cursor:pointer;
flex:1;
min-width:90px;
font-size:14px;
transition:0.3s;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
.nav-btn:hover{
background:var(--primary);
color:#000;
transform:translateY(-2px);
box-shadow:0 6px 15px rgba(0,220,130,0.4);
border-color:var(--primary);
}
.nav-btn.sec{background:var(--bg-dark);}
.nav-btn.sec:hover{background:var(--primary);color:#000;}

.user{
background:var(--bg-card);
padding:15px 20px;
border-radius:60px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid rgba(0,220,130,0.2);
backdrop-filter:blur(10px);
}
.avatar{
width:45px;height:45px;
background:linear-gradient(135deg,var(--primary),var(--primary-dark));
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,220,130,0.3);
}

.section-title{
font-size:24px;
margin:25px 0 15px;
color:var(--primary);
display:flex;
align-items:center;
gap:10px;
font-weight:700;
}
.section-title i{font-size:26px;}

/* Cards Grid */
.card-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:15px;
margin-bottom:25px;
}
.music-card{
background:var(--bg-card);
padding:16px;
border-radius:16px;
cursor:pointer;
transition:0.3s;
position:relative;
border:1px solid rgba(0,220,130,0.1);
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.music-card:hover{
background:var(--bg-hover);
transform:translateY(-8px);
border-color:var(--primary);
box-shadow:0 15px 30px rgba(0,220,130,0.2);
}
.card-img{
width:100%;
aspect-ratio:1;
background:linear-gradient(135deg,#1A472A,#0A2F1A);
border-radius:12px;
margin-bottom:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
background-size:cover;
background-position:center;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
}
.music-card:hover .card-img{transform:scale(1.02);}
.card-title{font-size:15px;font-weight:600;margin-bottom:4px;color:var(--text-light);}
.card-artist{font-size:13px;color:var(--text-muted);}
.badge{
position:absolute;
top:10px;right:10px;
background:var(--primary);
color:#000;
padding:4px 10px;
border-radius:30px;
font-size:10px;
font-weight:bold;
box-shadow:0 2px 5px rgba(0,0,0,0.3);
}

/* Radio Grid */
.radio-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}
.radio-card{
background:linear-gradient(135deg,#0E3A24,#052010);
border-radius:20px;
padding:20px;
cursor:pointer;
transition:0.4s;
position:relative;
border:1px solid var(--primary);
box-shadow:0 10px 20px rgba(0,0,0,0.5);
overflow:hidden;
}
.radio-card::before{
content:'';
position:absolute;
top:0;left:-100%;
width:100%;height:100%;
background:linear-gradient(90deg,transparent,rgba(0,220,130,0.2),transparent);
transition:0.5s;
}
.radio-card:hover::before{left:100%;}
.radio-card:hover{transform:scale(1.02);box-shadow:0 15px 30px rgba(0,220,130,0.3);}
.live-badge{
position:absolute;
top:10px;right:10px;
background:#FF3B3B;
color:#fff;
padding:4px 12px;
border-radius:30px;
font-size:11px;
font-weight:bold;
animation:pulse 1.5s infinite;
box-shadow:0 2px 10px rgba(255,59,59,0.5);
}
@keyframes pulse{
0%{opacity:1;transform:scale(1);}
50%{opacity:0.8;transform:scale(1.05);}
100%{opacity:1;transform:scale(1);}
}
.radio-card h2{font-size:48px;margin-bottom:10px;filter:drop-shadow(0 5px 10px rgba(0,0,0,0.5));}
.radio-card h3{font-size:18px;margin-bottom:5px;color:#fff;}
.radio-card p{font-size:13px;opacity:0.8;}

/* Upload Section */
.upload-section{
background:var(--bg-card);
border-radius:24px;
padding:25px;
margin:20px 0;
border:1px solid rgba(0,220,130,0.2);
box-shadow:0 15px 30px rgba(0,0,0,0.5);
}
.upload-box{
background:var(--bg-dark);
border:2px dashed var(--primary);
border-radius:16px;
padding:25px;
text-align:center;
cursor:pointer;
margin:15px 0;
transition:0.3s;
}
.upload-box:hover{background:var(--bg-hover);border-color:var(--primary-light);}
.upload-box i{font-size:48px;color:var(--primary);margin-bottom:10px;}
.file-list{
background:var(--bg-dark);
border-radius:12px;
padding:12px;
margin:10px 0;
max-height:200px;
overflow-y:auto;
border:1px solid rgba(0,220,130,0.2);
}
.file-item{
display:flex;justify-content:space-between;
padding:8px;border-bottom:1px solid rgba(255,255,255,0.1);
font-size:13px;
}
.file-item:last-child{border-bottom:none;}
.remove-file{
color:#FF6B6B;cursor:pointer;font-weight:bold;font-size:16px;
transition:0.2s;
}
.remove-file:hover{color:#FF3B3B;transform:scale(1.2);}

input,select{
width:100%;
padding:14px 18px;
margin:8px 0;
background:var(--bg-dark);
border:1px solid rgba(0,220,130,0.3);
border-radius:40px;
color:#fff;
font-size:14px;
transition:0.3s;
}
input:focus,select:focus{
outline:none;
border-color:var(--primary);
box-shadow:0 0 0 3px rgba(0,220,130,0.2);
}
input::placeholder{color:var(--text-muted);}

button{
background:linear-gradient(135deg,var(--primary),var(--primary-dark));
color:#000;
border:none;
padding:15px 25px;
border-radius:40px;
font-weight:bold;
font-size:16px;
cursor:pointer;
width:100%;
margin:8px 0;
transition:0.3s;
box-shadow:0 5px 15px rgba(0,220,130,0.3);
}
button:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,220,130,0.5);
}
button.sec{
background:linear-gradient(135deg,#1A2F24,#0A1F14);
color:#fff;
box-shadow:none;
}
button.sec:hover{background:var(--bg-hover);}

/* Player Bar */
.player-bar{
position:fixed;
bottom:0;left:0;right:0;
background:rgba(10,31,20,0.95);
backdrop-filter:blur(10px);
padding:15px 20px;
border-top:2px solid var(--primary);
display:none;
z-index:100;
box-shadow:0 -10px 30px rgba(0,0,0,0.8);
}
.player-info{
display:flex;align-items:center;gap:15px;margin-bottom:8px;
}
.player-img{
width:55px;height:55px;
background:linear-gradient(135deg,var(--primary),var(--primary-dark));
border-radius:12px;
display:flex;align-items:center;justify-content:center;
font-size:28px;
background-size:cover;background-position:center;
box-shadow:0 5px 15px rgba(0,220,130,0.3);
}
.player-controls{
display:flex;align-items:center;justify-content:center;gap:30px;
}
.player-controls i{
font-size:26px;color:var(--text-muted);cursor:pointer;
transition:0.2s;
}
.player-controls i:hover{color:var(--primary);transform:scale(1.1);}
.player-controls .fa-play-circle{
color:var(--primary);font-size:42px;
filter:drop-shadow(0 0 10px rgba(0,220,130,0.5));
}
.progress-bar{
width:100%;height:5px;
background:rgba(255,255,255,0.1);
border-radius:3px;margin:8px 0;cursor:pointer;
}
.progress{
width:0%;height:100%;
background:linear-gradient(90deg,var(--primary),var(--primary-light));
border-radius:3px;position:relative;
}
.progress::after{
content:'';
position:absolute;right:-6px;top:-4px;
width:12px;height:12px;
background:var(--primary);border-radius:50%;
opacity:0;transition:0.2s;
}
.progress-bar:hover .progress::after{opacity:1;}

/* Modal */
.modal{
display:none;position:fixed;top:0;left:0;right:0;bottom:0;
background:rgba(0,20,8,0.95);
backdrop-filter:blur(5px);
z-index:1000;align-items:center;justify-content:center;
}
.modal.active{display:flex;}
.modal-content{
background:var(--bg-card);
padding:30px;border-radius:30px;
width:90%;max-width:360px;
border:1px solid var(--primary);
box-shadow:0 20px 40px rgba(0,0,0,0.8);
}
.modal-content h2{color:var(--primary);margin-bottom:20px;font-size:28px;}

/* Toast */
.toast{
position:fixed;bottom:120px;left:50%;
transform:translateX(-50%);
background:var(--primary);color:#000;
padding:12px 30px;border-radius:60px;
font-weight:bold;display:none;
z-index:2000;box-shadow:0 5px 20px rgba(0,220,130,0.5);
}

/* Delete Button */
.delete-btn{
background:#FF3B3B;color:#fff;
border:none;padding:5px 12px;
border-radius:20px;font-size:11px;
font-weight:bold;cursor:pointer;margin-top:5px;
transition:0.2s;
}
.delete-btn:hover{background:#FF1A1A;transform:scale(1.05);}

/* Earnings Cards */
.earnings-grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;margin:15px 0;
}
.earning-card{
background:linear-gradient(135deg,#0E3A24,#052010);
border-radius:20px;padding:20px;text-align:center;
border:1px solid var(--primary);
box-shadow:0 10px 20px rgba(0,0,0,0.5);
}
.earning-card h3{font-size:32px;color:var(--primary);margin-bottom:5px;}
.earning-card p{font-size:14px;color:var(--text-muted);}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="header">
<h1>🎵 MUSIC BOSS</h1>
<p>Premium • Dark Green • Live Streaming</p>
</div>

<div class="nav">
<button class="nav-btn" onclick="showHome()"><i class="fas fa-home"></i> Home</button>
<button class="nav-btn sec" onclick="showUpload()"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
<button class="nav-btn sec" onclick="showRadio()"><i class="fas fa-broadcast-tower"></i> Radio</button>
<button class="nav-btn sec" onclick="showEarnings()"><i class="fas fa-chart-line"></i> Earnings</button>
<button class="nav-btn sec" onclick="showLibrary()"><i class="fas fa-books"></i> Library</button>
</div>

<div class="user">
<span id="userName"><i class="fas fa-user"></i> Guest</span>
<div class="avatar" id="userAvatar" onclick="showAuth()">G</div>
</div>

<div id="mainContent"></div>

<div class="player-bar" id="playerBar">
<div class="player-info">
<div class="player-img" id="playerImg">🎵</div>
<div>
<h4 id="playerTitle">Not playing</h4>
<p id="playerArtist" style="color:var(--text-muted);font-size:13px;">-</p>
</div>
</div>
<div class="progress-bar" onclick="seekTo(event)">
<div class="progress" id="progress"></div>
</div>
<div class="player-controls">
<i class="fas fa-step-backward" onclick="prevSong()"></i>
<i class="fas fa-play-circle" id="playBtn" onclick="playPause()"></i>
<i class="fas fa-step-forward" onclick="nextSong()"></i>
</div>
</div>

<div class="modal" id="authModal">
<div class="modal-content">
<h2 id="authTitle">Login</h2>
<input type="email" id="email" placeholder="Email" value="demo">
<input type="password" id="password" placeholder="Password" value="123">
<button onclick="handleAuth()" id="authBtn">Login</button>
<button class="sec" onclick="toggleAuth()" id="toggleAuth">Sign Up</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Data
let user=null;
let songs=[];
let current=null;
let playing=false;
let audio=new Audio();
let radio=null;
let radioInt=null;
let earnings=0;
let plays=0;
let audioFiles=[];
let imageFiles=[];

// Sample songs with actual streaming URLs
const demoSongs=[
{id:1,title:'Blinding Lights',artist:'The Weeknd',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',emoji:'🎤'},
{id:2,title:'Levitating',artist:'Dua Lipa',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',emoji:'✨'},
{id:3,title:'Peaches',artist:'Justin Bieber',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',emoji:'🍑'},
{id:4,title:'Stay',artist:'Kid Laroi',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3',emoji:'⭐'},
{id:5,title:'Kesariya',artist:'Arijit Singh',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3',emoji:'🌅'},
{id:6,title:'Pasoori',artist:'Ali Sethi',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3',emoji:'🌙'},
{id:7,title:'Calm Down',artist:'Rema',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3',emoji:'🌊'},
{id:8,title:'Unholy',artist:'Sam Smith',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3',emoji:'😈'},
];

// Radio stations with online streams (30+ countries)
const radios=[
{id:1,name:'Bollywood Hits',country:'India',stream:'https://stream.zeno.fm/7gy0m7vzry8uv',emoji:'🇮🇳',listeners:'2.5M'},
{id:2,name:'English Pop',country:'USA',stream:'https://stream.zeno.fm/9s9f8z9zry8uv',emoji:'🇺🇸',listeners:'5M'},
{id:3,name:'Punjabi Beats',country:'India',stream:'https://stream.zeno.fm/2mhx1wvzry8uv',emoji:'🇮🇳',listeners:'1.8M'},
{id:4,name:'K-Pop',country:'Korea',stream:'https://stream.zeno.fm/5x3p1xvzry8uv',emoji:'🇰🇷',listeners:'3.2M'},
{id:5,name:'Latin Hits',country:'Spain',stream:'https://stream.zeno.fm/1qk1xwvzry8uv',emoji:'🇪🇸',listeners:'4M'},
{id:6,name:'Japanese Pop',country:'Japan',stream:'https://stream.zeno.fm/3nz2yvzry8uv',emoji:'🇯🇵',listeners:'2.1M'},
{id:7,name:'French Café',country:'France',stream:'https://stream.zeno.fm/7gy0m7vzry8uv',emoji:'🇫🇷',listeners:'1.2M'},
{id:8,name:'German Beats',country:'Germany',stream:'https://stream.zeno.fm/9s9f8z9zry8uv',emoji:'🇩🇪',listeners:'1.5M'},
{id:9,name:'Arabic Hits',country:'UAE',stream:'https://stream.zeno.fm/2mhx1wvzry8uv',emoji:'🇦🇪',listeners:'2.8M'},
{id:10,name:'UK Top 40',country:'UK',stream:'https://stream.zeno.fm/5x3p1xvzry8uv',emoji:'🇬🇧',listeners:'4.5M'},
{id:11,name:'Russian Pop',country:'Russia',stream:'https://stream.zeno.fm/1qk1xwvzry8uv',emoji:'🇷🇺',listeners:'1.9M'},
{id:12,name:'Chinese Hits',country:'China',stream:'https://stream.zeno.fm/3nz2yvzry8uv',emoji:'🇨🇳',listeners:'3.8M'},
];

// Start
document.addEventListener('DOMContentLoaded',()=>{
loadData();
checkUser();
showHome();
});

function loadData(){
let saved=JSON.parse(localStorage.getItem('songs')||'[]');
songs=[...demoSongs,...saved];
}

function checkUser(){
let saved=localStorage.getItem('user');
if(saved){
let users=JSON.parse(localStorage.getItem('users')||'[]');
user=users.find(u=>u.email===saved);
if(user){
document.getElementById('userName').innerHTML = '<i class="fas fa-user"></i> '+(user.name||user.email);
document.getElementById('userAvatar').innerText=(user.name||user.email)[0];
loadEarnings();
}
}
}

function showAuth(){
document.getElementById('authModal').classList.add('active');
}

function toggleAuth(){
let t=document.getElementById('authTitle');
if(t.innerText==='Login'){
t.innerText='Sign Up';
document.getElementById('authBtn').innerText='Sign Up';
document.getElementById('toggleAuth').innerText='Back to Login';
}else{
t.innerText='Login';
document.getElementById('authBtn').innerText='Login';
document.getElementById('toggleAuth').innerText='Sign Up';
}
}

function handleAuth(){
let email=document.getElementById('email').value;
let pass=document.getElementById('password').value;
let title=document.getElementById('authTitle').innerText;
if(!email||!pass){toast('Fill all fields');return;}
let users=JSON.parse(localStorage.getItem('users')||'[]');
if(title==='Sign Up'){
if(users.find(u=>u.email===email)){toast('User exists');return;}
let newUser={email:email,pass:pass,name:email};
users.push(newUser);
localStorage.setItem('users',JSON.stringify(users));
user=newUser;
localStorage.setItem('user',email);
toast('Account created!');
}else{
let u=users.find(u=>u.email===email&&u.pass===pass);
if(u){user=u;localStorage.setItem('user',email);toast('Login success!');}
else{toast('Wrong credentials');return;}
}
document.getElementById('authModal').classList.remove('active');
document.getElementById('userName').innerHTML = '<i class="fas fa-user"></i> '+(user.name||user.email);
document.getElementById('userAvatar').innerText=(user.name||user.email)[0];
loadEarnings();
showHome();
}

function showHome(){
let html=`
<div class="section-title"><i class="fas fa-fire"></i> Trending Now</div>
<div class="card-grid" id="trending"></div>
<div class="section-title"><i class="fas fa-broadcast-tower"></i> Live Radio</div>
<div class="radio-grid" id="radioHome"></div>
`;
document.getElementById('mainContent').innerHTML=html;
let t='';
demoSongs.slice(0,4).forEach(s=>{t+=`<div class="music-card" onclick="playSong(${s.id})"><div class="card-img">${s.emoji}</div><div class="card-title">${s.title}</div><div class="card-artist">${s.artist}</div></div>`;});
document.getElementById('trending').innerHTML=t;
let r='';
radios.slice(0,4).forEach(s=>{r+=`<div class="radio-card" onclick="playRadio(${s.id})"><span class="live-badge">LIVE</span><h2>${s.emoji}</h2><h3>${s.name}</h3><p>${s.country} • ${s.listeners}</p></div>`;});
document.getElementById('radioHome').innerHTML=r;
}

function showUpload(){
if(!user){toast('Login first');showAuth();return;}
audioFiles=[];imageFiles=[];
let html=`
<div class="upload-section">
<h2 style="color:var(--primary); margin-bottom:15px;"><i class="fas fa-cloud-upload-alt"></i> Upload Music</h2>

<div class="upload-box" onclick="document.getElementById('audio').click()">
<i class="fas fa-music"></i>
<h3>Select Audio Files</h3>
<p>MP3, WAV (Multiple)</p>
</div>
<input type="file" id="audio" accept="audio/*" multiple style="display:none;" onchange="handleAudio()">
<div id="audioList" class="file-list"></div>

<div class="upload-box" onclick="document.getElementById('images').click()">
<i class="fas fa-image"></i>
<h3>Select Poster Images</h3>
<p>JPG, PNG (Optional)</p>
</div>
<input type="file" id="images" accept="image/*" multiple style="display:none;" onchange="handleImages()">
<div id="imageList" class="file-list"></div>

<input type="text" id="artistName" placeholder="Artist Name">
<select id="genreName">
<option>Pop</option>
<option>Rock</option>
<option>Hip Hop</option>
<option>Bollywood</option>
<option>Punjabi</option>
</select>

<button onclick="uploadAll()"><i class="fas fa-upload"></i> Upload All Songs</button>
</div>

<div class="section-title"><i class="fas fa-list"></i> Your Uploads</div>
<div class="card-grid" id="userUploads"></div>
`;
document.getElementById('mainContent').innerHTML=html;
showUserUploads();
}

function handleAudio(){
let files=document.getElementById('audio').files;
audioFiles=Array.from(files);
let h='<h4>Selected Audio:</h4>';
audioFiles.forEach((f,i)=>{h+=`<div class="file-item"><span>${i+1}. ${f.name}</span><span class="remove-file" onclick="removeAudio(${i})">✖</span></div>`;});
document.getElementById('audioList').innerHTML=h;
}

function handleImages(){
let files=document.getElementById('images').files;
