<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Music Hut Beat • Modern Vibes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <meta name="theme-color" content="#0f172a"/>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; }
    .glass { background: rgba(30,41,59,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .card { transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    .card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 25px 50px -12px rgba(234,179,8,0.3); }
    .playing .album { animation: spin 24s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .progress-bar { height: 5px; background: linear-gradient(to right, #eab308 var(--progress,0%), #4b5563 var(--progress,0%)); }
    .nav-active { color: #eab308; border-left: 4px solid #eab308; background: rgba(234,179,8,0.1); }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="fixed top-0 w-full glass z-50 h-16 flex items-center px-4 md:px-8 justify-between">
    <div class="flex items-center gap-3">
      <button id="menu-btn" class="lg:hidden text-2xl"><i class="fas fa-bars"></i></button>
      <span class="text-2xl font-bold tracking-tighter text-yellow-400">Music Hut Beat</span>
    </div>
    <div class="flex items-center gap-4 md:gap-6">
      <button onclick="toggleTheme()" class="text-xl"><i class="fas fa-moon"></i></button>
      <button onclick="document.getElementById('upload').click()" class="bg-yellow-500 text-black px-4 py-2 rounded-full font-medium flex items-center gap-2">
        <i class="fas fa-upload"></i> <span class="hidden md:inline">Upload</span>
      </button>
      <input type="file" id="upload" accept="audio/*" class="hidden" onchange="addSong(event)">
    </div>
  </header>

  <div class="flex flex-1 pt-16">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 glass border-r border-white/10 h-[calc(100vh-4rem)] overflow-y-auto fixed lg:static z-40 -translate-x-full lg:translate-x-0 transition-transform">
      <div class="p-4 space-y-2">
        <div onclick="setView('discover')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer nav-active">
          <i class="fas fa-compass"></i> Discover
        </div>
        <div onclick="setView('library')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
          <i class="fas fa-music"></i> Library
        </div>
        <div onclick="setView('playlists')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer">
          <i class="fas fa-list"></i> Playlists
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-y-auto pb-32 px-4 md:px-8">
      <div id="discover-view" class="view">
        <h1 class="text-4xl md:text-5xl font-bold mt-8 mb-6 text-center md:text-left">Discover New Vibes</h1>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6" id="discover-songs"></div>
      </div>

      <div id="library-view" class="view hidden">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 my-8">
          <h1 class="text-4xl font-bold">Your Library</h1>
          <input id="search-lib" placeholder="Search in library..." class="w-full md:w-64 bg-white/10 px-4 py-2 rounded-full border border-white/20 focus:border-yellow-400 outline-none">
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6" id="library-songs"></div>
      </div>

      <div id="playlists-view" class="view hidden">
        <h1 class="text-4xl font-bold mt-8 mb-6">Playlists</h1>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6" id="playlists-list"></div>
      </div>
    </main>
  </div>

  <!-- Player -->
  <footer id="player" class="fixed bottom-0 w-full glass h-20 md:h-24 flex items-center px-4 md:px-8 z-50 border-t border-white/10">
    <div class="flex items-center gap-3 md:gap-4 w-48 md:w-64 flex-shrink-0">
      <div class="album w-12 h-12 md:w-14 md:h-14 rounded-xl overflow-hidden shadow-lg">
        <img id="cover" src="https://picsum.photos/200?random=1" class="w-full h-full object-cover">
      </div>
      <div class="min-w-0">
        <div id="title" class="font-medium truncate text-sm md:text-base">No song selected</div>
        <div id="artist" class="text-xs text-gray-400 truncate">Upload to start</div>
      </div>
    </div>

    <div class="flex-1 flex flex-col items-center gap-1 md:gap-2 mx-4 md:mx-8">
      <div class="flex items-center gap-4 md:gap-8 text-xl md:text-2xl text-gray-300">
        <button id="shuffle" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
        <button onclick="prev()"><i class="fas fa-backward-step"></i></button>
        <button id="playpause" onclick="togglePlay()" class="text-yellow-400 text-4xl md:text-5xl"><i class="fas fa-play-circle"></i></button>
        <button onclick="next()"><i class="fas fa-forward-step"></i></button>
        <button id="repeat" onclick="toggleRepeat()"><i class="fas fa-redo"></i></button>
      </div>
      <div class="w-full flex items-center gap-2 text-xs text-gray-400">
        <span id="curr">0:00</span>
        <div class="flex-1 h-1.5 bg-gray-700 rounded-full cursor-pointer" onclick="seek(event)">
          <div id="prog" class="h-full w-0 bg-yellow-400 rounded-full transition-all duration-150"></div>
        </div>
        <span id="total">0:00</span>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-4">
      <canvas id="viz" width="100" height="32" class="opacity-80"></canvas>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" class="w-24 accent-yellow-400">
    </div>
  </footer>

  <audio id="audio"></audio>

  <script>
    let songs = JSON.parse(localStorage.getItem('mhb_songs')) || [];
    let currentIdx = -1;
    let isPlay = false;
    let shuffle = false;
    let repeat = 0; // 0 off, 1 one, 2 all
    const audio = document.getElementById('audio');
    let vizCtx;

    function saveSongs() { localStorage.setItem('mhb_songs', JSON.stringify(songs)); renderAll(); }

    function addSong(e) {
      const file = e.target.files[0];
      if (!file?.type.startsWith('audio/')) return alert("Audio file only!");
      
      const url = URL.createObjectURL(file);
      const song = {
        id: Date.now(),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: "You",
        src: url,
        cover: `https://picsum.photos/seed/${Date.now()}/300`
      };
      songs.unshift(song);
      saveSongs();
      playIdx(0);
    }

    function renderAll() {
      renderSongs('discover-songs', songs);
      renderSongs('library-songs', songs);
      renderPlaylists();
    }

    function renderSongs(id, list) {
      const grid = document.getElementById(id);
      grid.innerHTML = list.length ? '' : '<p class="col-span-full text-center py-12 text-gray-400">No songs yet — upload some!</p>';
      
      list.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'card glass rounded-2xl overflow-hidden cursor-pointer relative';
        card.innerHTML = `
          <img src="${s.cover}" class="w-full aspect-square object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 hover:opacity-100 transition flex items-end p-4">
            <div>
              <div class="font-medium truncate">${s.title}</div>
              <div class="text-xs text-gray-300">${s.artist}</div>
            </div>
          </div>
          <button onclick="event.stopPropagation(); playIdx(${i})" class="absolute bottom-4 right-4 w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center shadow-lg">
            <i class="fas fa-play text-black ml-0.5"></i>
          </button>
        `;
        card.onclick = () => playIdx(i);
        grid.appendChild(card);
      });
    }

    function renderPlaylists() {
      // Placeholder for playlists UI - can expand later
      document.getElementById('playlists-list').innerHTML = '<p class="col-span-full text-center py-12 text-gray-400">Playlists coming soon...</p>';
    }

    function playIdx(idx) {
      if (idx < 0 || idx >= songs.length) return;
      currentIdx = idx;
      const s = songs[idx];
      
      audio.src = s.src;
      document.getElementById('cover').src = s.cover;
      document.getElementById('title').textContent = s.title;
      document.getElementById('artist').textContent = s.artist;
      
      audio.play().then(() => {
        isPlay = true;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
        initViz();
      }).catch(err => {
        console.error(err);
        alert("Play failed — tap again or check file");
      });
    }

    function togglePlay() {
      if (currentIdx < 0) return songs.length && playIdx(0);
      if (isPlay) {
        audio.pause();
        isPlay = false;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-play-circle"></i>';
        document.getElementById('player').classList.remove('playing');
      } else {
        audio.play();
        isPlay = true;
        document.getElementById('playpause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }
    }

    function next() {
      let nextIdx = currentIdx + 1;
      if (shuffle) nextIdx = Math.floor(Math.random() * songs.length);
      if (nextIdx >= songs.length) nextIdx = repeat === 2 ? 0 : currentIdx;
      playIdx(nextIdx);
    }

    function prev() { playIdx(currentIdx > 0 ? currentIdx - 1 : (repeat === 2 ? songs.length - 1 : currentIdx)); }

    function toggleShuffle() {
      shuffle = !shuffle;
      document.getElementById('shuffle').style.color = shuffle ? '#eab308' : '';
    }

    function toggleRepeat() {
      repeat = (repeat + 1) % 3;
      document.getElementById('repeat').style.color = repeat ? '#eab308' : '';
    }

    function seek(e) {
      const bar = e.currentTarget;
      const pos = e.offsetX / bar.offsetWidth;
      audio.currentTime = pos * audio.duration;
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('prog').style.width = pct + '%';
      document.getElementById('curr').textContent = formatTime(audio.currentTime);
      document.getElementById('total').textContent = formatTime(audio.duration);
    };

    audio.onended = next;

    function formatTime(t) {
      if (!t) return '0:00';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function initViz() {
      if (vizCtx) return;
      const canvas = document.getElementById('viz');
      vizCtx = canvas.getContext('2d');
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audio);
      const anal = ctx.createAnalyser();
      anal.fftSize = 32;
      src.connect(anal);
      anal.connect(ctx.destination);
      const buf = new Uint8Array(anal.frequencyBinCount);

      function draw() {
        requestAnimationFrame(draw);
        anal.getByteFrequencyData(buf);
        vizCtx.clearRect(0,0,canvas.width,canvas.height);
        const w = canvas.width / buf.length;
        for (let i = 0; i < buf.length; i++) {
          const h = (buf[i] / 255) * canvas.height * 0.8;
          vizCtx.fillStyle = '#eab308';
          vizCtx.fillRect(i * w, canvas.height - h, w - 1, h);
        }
      }
      draw();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    }

    function setView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(view + '-view').classList.remove('hidden');
      document.getElementById('sidebar').classList.add('-translate-x-full');
    }

    // Init
    renderAll();
    document.getElementById('menu-btn').onclick = () => document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('vol').oninput = e => audio.volume = e.target.value;

    if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');

    console.log("Modern Music Hut Beat Ready! Upload & Enjoy 🔥");
  </script>
</body>
</html>
