<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WaveHut • Your Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background: linear-gradient(to bottom right, #0f172a, #1e293b); color: white; font-family: 'Segoe UI', sans-serif; }
    .glass { background: rgba(255,255,255,0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); }
    .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(234,179,8,0.25); }
    #player.playing .album { animation: spin 18s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="fixed top-0 w-full glass z-50 h-16 flex items-center justify-between px-6">
    <div class="text-3xl font-bold tracking-tight">
      <span class="text-yellow-400">Wave</span>Hut
    </div>
    <button onclick="document.getElementById('file').click()" 
            class="bg-gradient-to-r from-yellow-400 to-amber-500 text-black px-6 py-2 rounded-full font-semibold shadow-lg flex items-center gap-2 hover:scale-105 transition">
      <i class="fas fa-cloud-upload-alt"></i> Upload Song
    </button>
    <input type="file" id="file" accept="audio/*" class="hidden" onchange="uploadSong(event)">
  </header>

  <!-- Main -->
  <main class="flex-1 pt-20 pb-32 px-6 md:px-12 overflow-y-auto">
    <h1 class="text-5xl md:text-6xl font-extrabold text-center mb-12 tracking-tight leading-tight">
      Your Personal<br><span class="text-yellow-400">Music Hub</span>
    </h1>

    <div id="songs" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>

    <div id="empty" class="text-center mt-20 text-xl text-gray-400">
      <i class="fas fa-music text-6xl mb-6 block text-yellow-400 opacity-50"></i>
      No songs yet...<br>Upload your favorite MP3s to start!
    </div>
  </main>

  <!-- Player -->
  <footer id="player" class="fixed bottom-0 w-full glass h-24 flex items-center px-6 md:px-12 z-50">
    <div class="flex items-center gap-5 flex-1 min-w-0">
      <div id="album" class="w-14 h-14 md:w-16 md:h-16 rounded-xl overflow-hidden shadow-2xl album bg-gray-800">
        <img id="cover" src="https://picsum.photos/200?random=1" class="w-full h-full object-cover">
      </div>
      <div class="min-w-0 flex-1">
        <div id="songTitle" class="font-semibold text-lg truncate">Select a song</div>
        <div id="songArtist" class="text-sm text-gray-400 truncate">Upload to play</div>
      </div>
    </div>

    <div class="flex flex-col items-center gap-2 flex-1 max-w-md mx-6">
      <div class="flex items-center gap-6 md:gap-10 text-3xl text-gray-300">
        <button onclick="prevSong()"><i class="fas fa-backward-step"></i></button>
        <button id="playPause" onclick="toggle()" class="text-yellow-400 text-5xl">
          <i class="fas fa-play-circle"></i>
        </button>
        <button onclick="nextSong()"><i class="fas fa-forward-step"></i></button>
      </div>

      <div class="w-full flex items-center gap-3 text-xs text-gray-400">
        <span id="timeCurrent">0:00</span>
        <div class="flex-1 h-1.5 bg-gray-700 rounded-full overflow-hidden">
          <div id="prog" class="h-full w-0 bg-gradient-to-r from-yellow-400 to-amber-300 transition-all duration-300"></div>
        </div>
        <span id="timeTotal">0:00</span>
      </div>
    </div>
  </footer>

  <audio id="audioPlayer"></audio>

  <script>
    let mySongs = JSON.parse(localStorage.getItem('myWaveSongs')) || [];
    let current = -1;
    const audio = document.getElementById('audioPlayer');
    let playing = false;

    function save() {
      localStorage.setItem('myWaveSongs', JSON.stringify(mySongs));
      showSongs();
    }

    function uploadSong(e) {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('audio/')) {
        alert("Only audio files (MP3, WAV etc.) allowed!");
        return;
      }

      const url = URL.createObjectURL(file);
      const song = {
        id: Date.now(),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: "Uploaded by you",
        src: url,
        cover: "https://picsum.photos/300?random=" + Date.now()
      };

      mySongs.unshift(song);
      save();
      document.getElementById('empty').style.display = 'none';
      playThis(0);
    }

    function showSongs() {
      const container = document.getElementById('songs');
      container.innerHTML = '';

      if (mySongs.length === 0) {
        document.getElementById('empty').style.display = 'block';
        return;
      }

      document.getElementById('empty').style.display = 'none';

      mySongs.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'glass rounded-2xl overflow-hidden cursor-pointer card transition-all duration-300';
        card.innerHTML = `
          <img src="${s.cover}" class="w-full aspect-square object-cover">
          <div class="p-4">
            <div class="font-semibold truncate">${s.title}</div>
            <div class="text-sm text-gray-400 truncate">${s.artist}</div>
          </div>
        `;
        card.onclick = () => playThis(i);
        container.appendChild(card);
      });
    }

    function playThis(idx) {
      if (idx < 0 || idx >= mySongs.length) return;
      current = idx;
      const s = mySongs[idx];

      audio.src = s.src;
      document.getElementById('cover').src = s.cover;
      document.getElementById('songTitle').textContent = s.title;
      document.getElementById('songArtist').textContent = s.artist;

      audio.play().then(() => {
        playing = true;
        document.getElementById('playPause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }).catch(err => {
        console.error("Play failed:", err);
        alert("Playback issue – Try another song or check console (F12). Browser may block first play.");
      });
    }

    function toggle() {
      if (current === -1) {
        if (mySongs.length > 0) playThis(0);
        else alert("Upload a song first!");
        return;
      }

      if (playing) {
        audio.pause();
        playing = false;
        document.getElementById('playPause').innerHTML = '<i class="fas fa-play-circle"></i>';
        document.getElementById('player').classList.remove('playing');
      } else {
        audio.play();
        playing = true;
        document.getElementById('playPause').innerHTML = '<i class="fas fa-pause-circle"></i>';
        document.getElementById('player').classList.add('playing');
      }
    }

    function nextSong() {
      if (current < mySongs.length - 1) playThis(current + 1);
    }

    function prevSong() {
      if (current > 0) playThis(current - 1);
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      document.getElementById('prog').style.width = percent + '%';
      document.getElementById('timeCurrent').textContent = format(audio.currentTime);
      document.getElementById('timeTotal').textContent = format(audio.duration);
    };

    function format(t) {
      if (!t) return '0:00';
      let m = Math.floor(t / 60);
      let s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // Start
    showSongs();
    if (mySongs.length > 0) playThis(0);

    console.log("WaveHut Dubara Ready! Upload kar ke enjoy karo 🎶");
  </script>
</body>
</html>
