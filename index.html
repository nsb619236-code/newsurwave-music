<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sur Wave Music</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  /* Reset & Base Styles */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Inter', sans-serif;
    background-color: #121212;
    color: #fff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header with Logo */
header {
  background: linear-gradient(135deg, #1db954, #0f5b7d);
  padding: 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 999;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.logo {
  width: 100px;
  margin-bottom: 10px;
}
.logo img {
  width: 100%;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
header h1 {
  font-size: 2rem;
  margin-bottom: 10px;
  color: #fff;
}
nav {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}
nav a {
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 1rem;
  padding: 8px 12px;
  border-radius: 20px;
  transition: background 0.3s;
}
nav a:hover {
  background: rgba(255,255,255,0.2);
}

/* Main Sections */
section {
  padding: 50px 20px;
  max-width: 1200px;
  margin: auto;
}
h2 {
  font-size: 2rem;
  margin-bottom: 30px;
  text-align: center;
  color: #1ed760;
}
p {
  font-size: 1.1rem;
  margin-bottom: 20px;
  line-height: 1.6;
}

/* Featured Posters & Albums */
#posters {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}
.poster-card {
  background: #1f1f1f;
  border-radius: 15px;
  overflow: hidden;
  width: 200px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}
.poster-card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.poster-card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}
.poster-info {
  padding: 10px;
  text-align: center;
}
.poster-info h3 {
  font-size: 1.1rem;
  margin-bottom: 8px;
}
.poster-info p {
  font-size: 0.9rem;
  color: #aaa;
}

/* Singers Section */
#singers {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}
.singer-card {
  background: #1f1f1f;
  border-radius: 15px;
  width: 150px;
  padding: 10px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
}
.singer-card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.singer-card img {
  width: 100%;
  border-radius: 50%;
  border: 2px solid #1ed760;
  margin-bottom: 10px;
}
.singer-card h4 {
  text-align: center;
  font-size: 1rem;
}

/* Upload Button */
#upload-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 40px;
}
#uploadBtn {
  background-color: #1ed760;
  color: #fff;
  padding: 12px 30px;
  border: none;
  border-radius: 50px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.3s;
}
#uploadBtn:hover {
  background-color: #17b34a;
}

/* Music Player */
#music-player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: #222;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
  transition: background 0.3s;
  z-index: 999;
}
.player-info {
  display: flex;
  align-items: center;
}
.album-art {
  width: 60px;
  height: 60px;
  border-radius: 10px;
  overflow: hidden;
  margin-right: 15px;
}
.album-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.song-details {
  display: flex;
  flex-direction: column;
}
.song-title {
  font-weight: 600;
  font-size: 1rem;
}
.song-artist {
  font-size: 0.9rem;
  color: #aaa;
}
.controls {
  display: flex;
  align-items: center;
  gap: 15px;
}
.controls button {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
  transition: color 0.3s;
}
.controls button:hover {
  color: #1ed760;
}
#volumeControl {
  width: 100px;
}
@media(max-width: 768px){
  #music-player {
    flex-direction: column;
    height: auto;
  }
  .player-info {
    margin-bottom: 10px;
  }
}

/* Theme toggle - optional */
</style>
</head>
<body>

<!-- Header with Logo & Navigation -->
<header>
  <div class="logo">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Music Logo" />
  </div>
  <h1>Sur Wave Music</h1>
  <nav>
    <a href="#posters">Posters</a>
    <a href="#singers">Singers</a>
    <a href="#upload">Upload</a>
  </nav>
</header>

<!-- Posters & Albums Section -->
<section id="posters">
  <h2>Featured Albums & Posters</h2>
  <div id="posters-container">
    <div class="poster-card">
      <img src="https://images.unsplash.com/photo-1549924231-f129b911e442?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Album 1" />
      <div class="poster-info">
        <h3>Vibrant Beats</h3>
        <p>by DJ Sur</p>
      </div>
    </div>
    <div class="poster-card">
      <img src="https://images.unsplash.com/photo-1516707025808-1cae4a7d7bff?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Album 2" />
      <div class="poster-info">
        <h3>Melody Moods</h3>
        <p>by Singer X</p>
      </div>
    </div>
    <!-- Add more posters as needed -->
  </div>
</section>

<!-- Singers Section -->
<section id="singers">
  <h2>Top Singers</h2>
  <div id="singers-container">
    <div class="singer-card">
      <img src="https://images.unsplash.com/photo-1544725176-7c40e5a4c6e4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Singer 1" />
      <h4>Singer A</h4>
    </div>
    <div class="singer-card">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Singer 2" />
      <h4>Singer B</h4>
    </div>
    <!-- Add more singers -->
  </div>
</section>

<!-- Upload Button -->
<section id="upload" style="text-align:center; margin-top:50px;">
  <h2>Upload Your Songs</h2>
  <input type="file" id="fileUpload" multiple style="display:none" onchange="handleFiles(this.files)" />
  <button id="uploadBtn" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-upload"></i> Upload Songs</button>
</section>

<!-- Music Player -->
<div id="music-player">
  <div class="player-info">
    <div class="album-art" id="currentAlbum">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Current Song" />
    </div>
    <div class="song-details">
      <div class="song-title" id="songTitle">Sample Song</div>
      <div class="song-artist" id="songArtist">Unknown Artist</div>
    </div>
  </div>
  <div class="controls">
    <button id="prevBtn" title="Previous"><i class="fas fa-backward"></i></button>
    <button id="playPauseBtn" title="Play/Pause"><i class="fas fa-play"></i></button>
    <button id="nextBtn" title="Next"><i class="fas fa-forward"></i></button>
    <button id="shuffleBtn" title="Shuffle"><i class="fas fa-random"></i></button>
    <button id="repeatBtn" title="Repeat"><i class="fas fa-redo"></i></button>
    <input type="range" id="seekBar" min="0" max="100" value="0" style="width:150px; margin-left:15px;" />
    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5" title="Volume" />
  </div>
</div>

<!-- Optional: Scripts for functionality -->
<script>
  // Placeholder Variables
  let isPlaying = false;
  const playPauseBtn = document.getElementById('playPauseBtn');
  const seekBar = document.getElementById('seekBar');
  const volumeControl = document.getElementById('volumeControl');

  // Play/Pause toggle
  document.getElementById('playPauseBtn').addEventListener('click', () => {
    isPlaying = !isPlaying;
    document.querySelector('#playPauseBtn i').className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
  });

  // Volume control
  volumeControl.addEventListener('input', () => {
    // Here you can connect to actual audio element
    // e.g., audio.volume = volumeControl.value;
  });

  // Seek bar change
  seekBar.addEventListener('input', () => {
    // Connect to actual audio currentTime
  });

  // Upload songs
  function handleFiles(files) {
    alert(files.length + ' song(s) uploaded!');
    // Implement upload logic or add to playlist
  }

  // Control buttons
  document.getElementById('nextBtn').addEventListener('click', () => {
    alert('Next song');
  });
  document.getElementById('prevBtn').addEventListener('click', () => {
    alert('Previous song');
  });
  document.getElementById('shuffleBtn').addEventListener('click', () => {
    alert('Shuffle toggled');
  });
  document.getElementById('repeatBtn').addEventListener('click', () => {
    alert('Repeat toggled');
  });
</script>

</body>
</html>
